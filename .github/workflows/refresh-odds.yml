name: refresh-odds

# Refreshes today's ESPN odds and commits the rebuilt parquets so they survive
# Railway redeploys. Only covers ODDS — for new train.parquet rows or model
# retraining, run the pipeline locally and push.
#
# Cron: every 2 hours during the MLB regular season window (Mar 15 – Nov 1),
# only between 14:00 and 04:00 UTC (roughly noon ET pregame through end of
# late-night West Coast games). Outside that window, no traffic on the data
# anyway — Railway's on-request refresh handles edge cases.

on:
  schedule:
    - cron: '0 14,16,18,20,22,0,2,4 * 3-11 *'  # every 2h, Mar-Nov
  workflow_dispatch:                            # manual trigger from UI

# Only one refresh at a time. New triggers cancel stale runs to avoid commit races.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # so we can git push back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run odds refresh
        run: python -m src.refresh --days-forward 7
        env:
          PYTHONUNBUFFERED: '1'

      - name: Refresh value_picks (predict-only)
        # Reusa modelos .pkl commiteados. No reentrena en CI porque el target
        # de first-scorer requiere pitches.parquet (384 MB) que no vive en git.
        run: python -m src.model.value_picks --predict-only --summary
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show diff summary
        run: |
          git status --short
          git diff --stat -- 'data/processed/*.parquet' || true

      - name: Commit + push if changed
        run: |
          if [[ -z "$(git status --porcelain data/processed/odds_close.parquet data/processed/features_market.parquet data/processed/value_picks.parquet data/raw/odds 2>/dev/null)" ]]; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git config user.name  "strikecast-bot"
          git config user.email "strikecast-bot@users.noreply.github.com"
          # Slim commit: only the working parquets ship. Raw JSONs stay in the
          # runner's tmp filesystem and get discarded when the job ends.
          git add data/processed/odds_close.parquet \
                  data/processed/features_market.parquet \
                  data/processed/value_picks.parquet
          # Value model pkls only if they changed (rare — same shape each retrain).
          git add data/models/value_first.pkl data/models/value_win.pkl 2>/dev/null || true
          git commit -m "data: auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Trigger Cloudflare D1 refresh
        # Poblado del D1 con schedules + odds del dia. Independiente del
        # commit: aun si no hay cambios en parquets, D1 necesita ver fechas
        # nuevas cuando amanece un dia distinto.
        if: always()
        run: |
          curl -sS -X POST "${{ secrets.STATSMLB_URL }}/api/refresh" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -w "\nHTTP %{http_code}\n" || echo "D1 refresh HTTP error (non-fatal)"
