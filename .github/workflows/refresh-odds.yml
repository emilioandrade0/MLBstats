name: refresh-odds

# Refreshes today's ESPN odds y captura un snapshot con timestamp propio para
# alimentar el panel Movimiento de linea. Cero costo de API (ESPN es gratis).
#
# Cron: cada hora en la ventana de temporada (Mar-Nov). Antes era cada 2 h,
# lo subimos a 1 h para que el time-series ESPN tenga granularidad util.

on:
  schedule:
    - cron: '35 * * 3-11 *'   # cada hora en el minuto 35, Mar-Nov
  workflow_dispatch:

# Only one refresh at a time. New triggers cancel stale runs to avoid commit races.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # so we can git push back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run odds refresh
        run: python -m src.refresh --days-forward 7
        env:
          PYTHONUNBUFFERED: '1'

      - name: Retrain value_picks model
        # Full retrain usando el cache commiteado del target (67 KB) en vez de
        # pitches.parquet (384 MB). ~15s. Regenera value_picks.parquet.
        run: python -m src.model.value_picks --summary
        env:
          PYTHONUNBUFFERED: '1'

      - name: Snapshot ESPN moneylines en vivo (pickcenter)
        # Query directo al endpoint summary de ESPN. Devuelve pickcenter con
        # moneyline actualizado. Independiente de src.refresh — funciona incluso
        # si event_odds endpoint sigue devolviendo count:0.
        run: python -u StatsMLB/scripts/snapshot_espn_live.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Regenerar line-movement JSONs por fecha
        run: python -u StatsMLB/scripts/build_line_movement.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show diff summary
        run: |
          git status --short
          git diff --stat -- 'data/processed/*.parquet' || true

      - name: Commit + push if changed
        run: |
          if [[ -z "$(git status --porcelain data/processed/odds_close.parquet data/processed/features_market.parquet data/processed/value_picks.parquet data/processed/espn_odds_timeseries.parquet StatsMLB/public/data/line-movement StatsMLB/public/data/line-movement-index.json 2>/dev/null)" ]]; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git config user.name  "strikecast-bot"
          git config user.email "strikecast-bot@users.noreply.github.com"
          git add data/processed/odds_close.parquet \
                  data/processed/features_market.parquet \
                  data/processed/value_picks.parquet \
                  data/processed/espn_odds_timeseries.parquet \
                  StatsMLB/public/data/line-movement \
                  StatsMLB/public/data/line-movement-index.json
          # Value model pkls only if they changed (rare — same shape each retrain).
          git add data/models/value_first.pkl data/models/value_win.pkl 2>/dev/null || true
          git commit -m "data: auto-refresh + espn snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry push up to 3 times: if a concurrent commit landed, rebase our
          # parquet commit on top of it. Parquets se regeneran integros cada corrida.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "Push race detected, rebasing on remote (attempt $i)..."
            git pull --rebase --strategy-option=ours origin main || {
              git rebase --abort || true
              exit 1
            }
          done

      - name: Trigger Cloudflare D1 refresh
        # Poblado del D1 con schedules + odds del dia. Independiente del
        # commit: aun si no hay cambios en parquets, D1 necesita ver fechas
        # nuevas cuando amanece un dia distinto.
        if: always()
        run: |
          curl -sS -X POST "${{ secrets.STATSMLB_URL }}/api/refresh" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -w "\nHTTP %{http_code}\n" || echo "D1 refresh HTTP error (non-fatal)"
