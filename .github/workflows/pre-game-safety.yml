name: pre-game-safety

# Seguro pre-game: verifica que value_picks.parquet este fresco antes de que
# empiecen juegos MLB. Corre 3 veces al dia alineado a los slates tipicos:
#   - 16:30 UTC (10:30 AM CDMX) — antes de juegos de dia (12:35 PM ET)
#   - 21:30 UTC (3:30 PM CDMX) — antes de slate vespertino (4-5 PM ET)
#   - 00:30 UTC (6:30 PM CDMX) — antes de prime time + West Coast
#
# Que hace en cada corrida:
#   1. Fetch /api/value del Cloudflare Worker
#   2. Si updated_at > 90 min -> data stale, dispara actualizar-historico
#   3. Log al Actions job. Sin notificaciones (Telegram queda para picks).
#
# Ver resultados: GitHub -> Actions -> pre-game-safety -> click run.

on:
  schedule:
    - cron: '30 16 * * *'
    - cron: '30 21 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: pre-game-safety
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # necesario para dispatchear actualizar-historico
    steps:
      - name: Verificar frescura de value_picks
        id: freshness
        env:
          STATSMLB_URL: ${{ secrets.STATSMLB_URL }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)
          RESPONSE=$(curl -sS --max-time 30 "$STATSMLB_URL/api/value?date=$TODAY")
          echo "raw response head:"
          echo "$RESPONSE" | head -c 400
          echo ""

          UPDATED_AT=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('updatedAt') or '')")
          PICKS_COUNT=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('picks') or []))")

          if [ -z "$UPDATED_AT" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "age_min=99999" >> "$GITHUB_OUTPUT"
            echo "picks_count=$PICKS_COUNT" >> "$GITHUB_OUTPUT"
            echo "::warning::endpoint value no devolvio updated_at"
            exit 0
          fi

          UPDATED_TS=$(python3 -c "from datetime import datetime; print(int(datetime.fromisoformat('$UPDATED_AT'.replace('Z','+00:00')).timestamp()))")
          NOW_TS=$(date -u +%s)
          AGE_MIN=$(( (NOW_TS - UPDATED_TS) / 60 ))

          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"
          echo "age_min=$AGE_MIN" >> "$GITHUB_OUTPUT"
          echo "picks_count=$PICKS_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$AGE_MIN" -gt 90 ]; then
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "::warning::data stale ($AGE_MIN min old, $PICKS_COUNT picks) — trigger refresh"
          else
            echo "status=fresh" >> "$GITHUB_OUTPUT"
            echo "::notice::data fresca ($AGE_MIN min old, $PICKS_COUNT picks)"
          fi

      - name: Disparar actualizar-historico si data stale
        if: steps.freshness.outputs.status == 'stale' || steps.freshness.outputs.status == 'missing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Data status='${{ steps.freshness.outputs.status }}' age=${{ steps.freshness.outputs.age_min }} min."
          echo "Disparando actualizar-historico via workflow_dispatch..."
          gh workflow run actualizar-historico.yml -r main
          echo "Dispatch enviado. Revisa Actions -> actualizar-historico para el nuevo run."
