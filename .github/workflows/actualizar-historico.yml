name: actualizar-historico

# Automatiza el `ACTUALIZAR HISTORICO.bat` en la nube. Corre diario a las
# 15:00 UTC (9:00 AM CDMX) — despues de que terminen los juegos West Coast
# de la noche anterior y antes de que empiecen los del dia.
#
# Pipeline (~6-10 min):
#   1. refresh_history_schedule.py  → MLB schedule del mes actual
#   2. mlb_three_game_sweep_report  → stats de series (work/sweep_report_*)
#   3. build_data.py                 → walkforward JSONs (StatsMLB/public/data/)
#   4. Commit los JSONs actualizados
#   5. pnpm build + wrangler deploy  → sube el Worker a Cloudflare
#
# Requiere secrets:
#   CLOUDFLARE_API_TOKEN   (perms: Workers Scripts:Edit, D1:Edit, Account:Read)
#   CLOUDFLARE_ACCOUNT_ID  (8a839b9640e9bd55fd9bb4ec70ac7a4c segun deploy log)

on:
  schedule:
    # Con el cache de walk-forward: cada corrida solo reentrena la fold del mes
    # actual (~5-8 min). Cadencia horaria es sostenible.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: actualizar-historico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Primer run "cold" (sin cache) toma ~55 min por los 21 folds walkforward.
    # Runs subsecuentes usan cache y bajan a ~10 min. Timeout de 90 cubre ambos.
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install scikit-learn

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Refresh MLB schedule (mes actual)
        working-directory: StatsMLB
        run: python -u scripts/refresh_history_schedule.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Refresh ESPN odds + rebuild odds_close.parquet
        run: python -m src.refresh --days-forward 7
        env:
          PYTHONUNBUFFERED: '1'

      - name: Refresh StatsAPI feeds (ultimos 3 dias — captura scores finales)
        # ESPN refresh trae odds y scoreboard pero NO regenera games.parquet
        # con box scores completos. StatsAPI feed/live nos da los scores
        # oficiales de juegos ya terminados. Sin esto, walkforward-2026.json
        # aparece con solo 1 juego del dia anterior.
        run: |
          END=$(date -u +%Y-%m-%d)
          START=$(date -u -d '3 days ago' +%Y-%m-%d)
          echo "StatsAPI ingest: $START -> $END"
          python -m src.ingest_statsapi --start "$START" --end "$END" --concurrency 8
        env:
          PYTHONUNBUFFERED: '1'

      - name: Regenerate games.parquet from StatsAPI feeds
        run: python -m src.normalize.games
        env:
          PYTHONUNBUFFERED: '1'

      - name: Rebuild three-game sweep report
        run: |
          mkdir -p work/sweep_report_20260824
          python -u analysis/mlb_three_game_sweep_report.py --output-dir work/sweep_report_20260824
        env:
          PYTHONUNBUFFERED: '1'

      - name: Retrain Value Model + regenerate value_picks.parquet
        # Usa el cache commiteado value_target_first_scorer.parquet (67 KB)
        # en vez de pitches.parquet (384 MB). Full retrain en CI, ~15s.
        run: python -m src.model.value_picks --summary
        env:
          PYTHONUNBUFFERED: '1'

      - name: Build StatsMLB dashboard data (build_data.py, cached walkforward)
        # Sin --full-rebuild: reusa las folds walk-forward ya calculadas de meses
        # cerrados (guardadas en public/data/walkforward-*.json). Solo recomputa
        # la fold del mes actual. Corre en 5-8 min en vez de 35+.
        working-directory: StatsMLB
        run: python -u scripts/build_data.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Build validated evidence for game cards
        working-directory: StatsMLB
        run: python -u scripts/build_card_evidence.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Build player performance snapshot (L30)
        working-directory: StatsMLB
        run: python -u scripts/build_player_performance.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit JSON updates
        run: |
          git config user.name  "strikecast-bot"
          git config user.email "strikecast-bot@users.noreply.github.com"
          git add StatsMLB/public/data/*.json \
                  data/processed/odds_close.parquet \
                  data/processed/features_market.parquet \
                  data/processed/value_picks.parquet \
                  data/processed/games.parquet 2>/dev/null || true
          git add data/models/value_first.pkl data/models/value_win.pkl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: actualizar historico $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Install StatsMLB deps
        working-directory: StatsMLB
        run: pnpm install --frozen-lockfile

      - name: Build StatsMLB
        working-directory: StatsMLB
        run: pnpm build

      - name: Deploy Cloudflare Worker
        working-directory: StatsMLB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Trigger Cloudflare D1 refresh (post-deploy)
        if: always()
        run: |
          curl -sS -X POST "${{ secrets.STATSMLB_URL }}/api/refresh" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -w "\nHTTP %{http_code}\n" || echo "D1 refresh HTTP error (non-fatal)"
