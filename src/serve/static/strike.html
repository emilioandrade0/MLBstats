// ─── HOY EXPANDABLE ROW — integrated header + tall book-page cards ───────────
function HoyExpandableRow({
  games,
  onOpen,
  date,
  titleOverride = null,
  kicker = '01 · Slate del día',
  primaryLabel = 'partidos del día',
  secondaryValue = null,
  secondarySuffix = '',
  secondaryLabel = 'con valor +EV',
  extraStats = [],
  description = 'Pasa el mouse sobre cualquier partido para desplegar el análisis comparativo. Las cards se reorganizan suavemente para revelar las métricas, el matchup y la recomendación del modelo.',
  emptyText = 'No hay partidos para mostrar en esta fecha.',
}) {
  const [hoveredPk, setHoveredPk] = useState(null);
  const [lockOnly, setLockOnly] = useState(false);
  const [sharpOnly, setSharpOnly] = useState(false);
  const rowRef = useRef(null);
  const headRef = useRef(null);
  const scrollRef = useRef(null);
  const valueCount = games?.filter(g => g.ev_grade === 'sweet' || g.ev_grade === 'marginal').length || 0;
  const lockCount = games?.filter(g => g.confidence_tier === 'lock' || g.confidence_tier === 'fuerte').length || 0;
  const sharpCount = games?.filter(g => g.pin_value_side && g.pin_value_book).length || 0;

  // Convert vertical wheel to horizontal scroll while hovering the row.
  useEffect(() => {
    if (!games?.length) return;
    const onWheel = (e) => {
      const el = scrollRef.current;
      if (!el || !el.contains(e.target)) return;
      const dx = e.deltaX !== 0 ? e.deltaX : e.deltaY;
      if (dx === 0) return;
      const max = el.scrollWidth - el.clientWidth;
      if (max <= 0) return;
      const atLeftEdge  = el.scrollLeft <= 0 && dx < 0;
      const atRightEdge = el.scrollLeft >= max && dx > 0;
      if (atLeftEdge || atRightEdge) return;
      e.preventDefault();
      e.stopPropagation();
      el.scrollLeft = Math.max(0, Math.min(max, el.scrollLeft + dx));
    };
    window.addEventListener('wheel', onWheel, { passive: false, capture: true });
    return () => window.removeEventListener('wheel', onWheel, { capture: true });
  }, [games?.length]);

  useLayoutEffect(() => {
    if (!rowRef.current || !games?.length) return;
    const tl = gsap.timeline();
    if (headRef.current) {
      tl.fromTo(headRef.current.querySelectorAll('[data-fade]'),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.85, ease: 'power3.out', stagger: 0.08 });
    }
    tl.fromTo(rowRef.current.querySelectorAll('[data-card]'),
      { opacity: 0, y: 40, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'power3.out', stagger: 0.04 },
      "-=0.35");
  }, [games.length, date]);

  const allItems = games || [];
  const items = allItems.filter(g =>
    (!lockOnly || g.confidence_tier === 'lock' || g.confidence_tier === 'fuerte') &&
    (!sharpOnly || (g.pin_value_side && g.pin_value_book))
  );
  const hovered = items.find(g => g.game_pk === hoveredPk);

  const dateObj = date ? new Date(date + 'T12:00:00') : new Date();
  const dateStr = titleOverride || dateObj.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });

  return (
    <section
      ref={rowRef}
      className="min-h-screen pt-28 pb-16">
      {/* ── Integrated header (aligned to cards row) ─────────────────────── */}
      <div ref={headRef} className="max-w-[1900px] mx-auto px-4 md:px-8 mb-8">
        <div data-fade className="text-[11px] tracking-[0.32em] uppercase font-bold text-accent-red mb-3">
          {kicker}
        </div>
        <div className="flex items-end justify-between gap-8 flex-wrap">
          <h1 data-fade className="mega text-[clamp(54px,7vw,108px)] leading-[0.88]">{dateStr}</h1>
          <div data-fade className="w-full lg:w-auto grid grid-cols-2 sm:flex items-end sm:items-baseline gap-5 sm:gap-6 pb-3">
            <div className="text-right">
              <div className="mega text-accent-red text-[clamp(46px,5.5vw,88px)] leading-none tabular-nums">{items.length}</div>
              <div className="text-[10px] tracking-[0.28em] uppercase text-white/40 font-black mt-1">{primaryLabel}</div>
            </div>
            <div className="hidden sm:block h-16 w-px bg-white/[0.08]"/>
            <div>
              <div className="mega text-accent-gold text-[clamp(46px,5.5vw,88px)] leading-none tabular-nums">
                {secondaryValue == null ? valueCount : secondaryValue}{secondarySuffix}
              </div>
              <div className="text-[10px] tracking-[0.28em] uppercase text-white/40 font-black mt-1">{secondaryLabel}</div>
            </div>
            {extraStats.map((stat, index) => (
              <React.Fragment key={stat.label}>
                <div className="hidden sm:block h-16 w-px bg-white/[0.08]"/>
                <div>
                  <div className="mega text-[clamp(38px,4.5vw,72px)] leading-none tabular-nums" style={{ color: stat.color || '#4DABF7' }}>
                    {stat.value}{stat.suffix || ''}
                  </div>
                  <div className="text-[9px] tracking-[0.22em] uppercase text-white/40 font-black mt-1">{stat.label}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
        <p data-fade className="text-[12px] text-white/45 max-w-[680px] mt-5 leading-relaxed">
          {description}
        </p>
        {/* Filter toggles */}
        {(lockCount > 0 || sharpCount > 0) && (
          <div data-fade className="mt-5 flex items-center gap-3 flex-wrap">
            {lockCount > 0 && (
              <button
                onClick={() => { setLockOnly(v => !v); setSharpOnly(false); }}
                className={`inline-flex items-center gap-2 px-4 py-2 rounded-full border text-[11px] font-black tracking-[0.14em] uppercase transition
                  ${lockOnly
                    ? 'bg-accent-green/20 text-accent-green border-accent-green/50'
                    : 'bg-white/[0.04] text-white/55 border-white/[0.12] hover:border-accent-green/40 hover:text-accent-green/80'}`}>
                <span>🔒</span>
                {lockOnly ? `Mostrando ${lockCount} de máxima confianza` : `Ver solo máxima confianza (${lockCount})`}
              </button>
            )}
            {sharpCount > 0 && (
              <button
                onClick={() => { setSharpOnly(v => !v); setLockOnly(false); }}
                className={`inline-flex items-center gap-2 px-4 py-2 rounded-full border text-[11px] font-black tracking-[0.14em] uppercase transition
                  ${sharpOnly
                    ? 'bg-accent-gold/20 text-accent-gold border-accent-gold/55'
                    : 'bg-white/[0.04] text-white/55 border-white/[0.12] hover:border-accent-gold/45 hover:text-accent-gold/85'}`}>
                <span>🎯</span>
                {sharpOnly ? `Mostrando ${sharpCount} con valor sharp` : `Ver solo valor sharp (${sharpCount})`}
              </button>
            )}
            <span className="text-[10px] text-white/35 tracking-wide">
              LOCK ≈ 71% · SHARP = book blando paga sobre Pinnacle
            </span>
          </div>
        )}
      </div>

      {/* ── Tall book-page cards ────────────────────────────────────────────── */}
      <div className="max-w-[1900px] mx-auto px-4 md:px-8">
        <div
          ref={scrollRef}
          onMouseLeave={() => setHoveredPk(null)}
          className="flex flex-nowrap gap-4 overflow-x-auto py-6 hoy-row">
          {items.map((g, i) => (
            <React.Fragment key={g.game_pk}>
              <div data-card style={{ flexShrink: 0 }}>
                <CompactCard
                  g={g}
                  onOpen={onOpen}
                  onHover={setHoveredPk}
                  expanded={g.game_pk === hoveredPk}
                  accent={
                    g.ev_grade === 'sweet' ? '#51CF66' :
                    g.ev_grade === 'marginal' ? '#4DABF7' :
                    g.ev_grade === 'overconfident' ? '#E63946' : '#4DABF7'
                  }
                />
              </div>
              {hoveredPk === g.game_pk && (
                <div className="animate-[panelIn_0.5s_cubic-bezier(0.2,0.8,0.2,1)]"
                     style={{ flexShrink: 0 }}>
                  <InsightPanel g={hovered} onOpen={onOpen} />
                </div>
              )}
            </React.Fragment>
          ))}
          {!items.length && (
            <div className="w-full min-h-[360px] glass border border-white/[0.07] rounded-[24px] flex items-center justify-center text-white/35 text-sm tracking-[0.16em] uppercase">
              {emptyText}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function TeamSearchPage({ date, query, resolvedTeam, games, loading, onOpen, onQueryChange, winProbFilter, onWinProbFilterChange }) {
  const normalized = query.trim().toLowerCase();
  const targetWinProb = winProbFilter === '' ? null : Math.max(0, Math.min(100, Number(winProbFilter)));
  const tolerance = 1.0;
  const filtered = useMemo(() =>
    (games || []).filter((g) => {
      if (!g.is_played) return false;
      if (!resolvedTeam) return true;
      const teamProb = g.home_abbrev === resolvedTeam ? Number(g.p_home) * 100
        : g.away_abbrev === resolvedTeam ? Number(g.p_away) * 100
        : null;
      if (teamProb == null || !Number.isFinite(teamProb)) return false;
      if (targetWinProb == null) return true;
      return Math.abs(Number(teamProb.toFixed(1)) - Number(targetWinProb.toFixed(1))) <= tolerance;
    }).sort((a, b) => {
      if (a.date === b.date) return (b.slot || 0) - (a.slot || 0);
      return String(b.date).localeCompare(String(a.date));
    }),
  [games, resolvedTeam, targetWinProb]);
  const matchingTeams = useMemo(() => {
    const set = new Set();
    TEAM_SEARCH_POOL.forEach((t) => {
      if (!normalized) return;
      if (t.abbr.toLowerCase().includes(normalized) || t.name.toLowerCase().includes(normalized)) set.add(t.abbr);
    });
    return [...set].filter(Boolean);
  }, [normalized]);
  const rangeStart = shiftDate(date, -89);
  const titleOverride = resolvedTeam
    ? `${TEAM_NAMES[resolvedTeam] || resolvedTeam} · últimos 90 días`
    : normalized
    ? `Coincidencias: ${query} · últimos 90 días`
    : 'Busca un equipo';

  return (
    <>
      <div className="pt-28 pb-6 px-10 max-w-[1600px] mx-auto">
        <div className="glass border border-white/[0.07] rounded-[28px] p-6 md:p-8">
          <div className="text-[11px] tracking-[0.32em] uppercase font-bold text-accent-blue mb-4">06 · Búsqueda por equipo</div>
          <div className="grid grid-cols-1 xl:grid-cols-[1fr_auto_auto] gap-5 items-end">
            <div>
              <div className="mega text-[clamp(34px,5vw,64px)] leading-[0.95]">Cards por equipo</div>
              <p className="text-white/55 text-sm mt-3 max-w-[760px] leading-relaxed">
                Escribe una abreviación o nombre como <span className="text-white">NYY</span>, <span className="text-white">Dodgers</span> o <span className="text-white">Philadelphia</span> y verás las mismas cards de Hoy filtradas para ese equipo en la ventana {rangeStart} a {date}, mostrando sólo juegos ya cerrados.
              </p>
            </div>
            <div className="w-full xl:w-[460px]">
              <input
                type="text"
                list="team-search-options"
                value={query}
                onChange={(e) => onQueryChange(e.target.value)}
                placeholder="Busca por equipo o abreviación…"
                className="w-full rounded-2xl border border-white/[0.12] bg-white/[0.04] px-5 py-4 text-white placeholder:text-white/28 outline-none focus:border-accent-blue/55 focus:bg-white/[0.06] transition"
              />
              <datalist id="team-search-options">
                {TEAM_SEARCH_POOL.map(({ abbr, name }) => (
                  <option key={abbr} value={abbr}>{name}</option>
                ))}
              </datalist>
            </div>
            <div className="w-full xl:w-[220px]">
              <div className="text-[10px] tracking-[0.2em] uppercase text-white/38 font-black mb-2">Win Probability Objetivo</div>
              <div className="relative">
                <input
                  type="number"
                  min="0"
                  max="100"
                  step="1"
                  value={winProbFilter}
                  onChange={(e) => onWinProbFilterChange(e.target.value)}
                  placeholder="Ej. 53.5"
                  className="w-full rounded-2xl border border-white/[0.12] bg-white/[0.04] px-5 py-4 pr-12 text-white placeholder:text-white/28 outline-none focus:border-accent-gold/55 focus:bg-white/[0.06] transition"
                />
                <span className="absolute right-5 top-1/2 -translate-y-1/2 text-white/35 text-sm font-black">%</span>
              </div>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mt-5">
            {['NYY', 'LAD', 'PHI', 'CHC', 'SEA', 'HOU', 'DET', 'SD'].map((abbr) => (
              <button
                key={abbr}
                onClick={() => onQueryChange(abbr)}
                className={`px-3 py-2 rounded-full border text-[11px] font-black tracking-[0.14em] uppercase transition ${
                  query.trim().toUpperCase() === abbr
                    ? 'bg-accent-blue/20 text-accent-blue border-accent-blue/45'
                    : 'bg-white/[0.03] text-white/50 border-white/[0.08] hover:border-white/[0.18] hover:text-white'
                }`}>
                {abbr}
              </button>
            ))}
            {query && (
              <button
                onClick={() => { onQueryChange(''); onWinProbFilterChange(''); }}
                className="px-3 py-2 rounded-full border border-white/[0.08] bg-white/[0.03] text-white/45 text-[11px] font-black tracking-[0.14em] uppercase hover:text-white hover:border-white/[0.18] transition">
                Limpiar
              </button>
            )}
            {winProbFilter !== '' && (
              <button
                onClick={() => onWinProbFilterChange('')}
                className="px-3 py-2 rounded-full border border-accent-gold/25 bg-accent-gold/[0.06] text-accent-gold/75 text-[11px] font-black tracking-[0.14em] uppercase hover:border-accent-gold/45 hover:text-accent-gold transition">
                Quitar filtro %
              </button>
            )}
          </div>
        </div>
      </div>

      {loading ? (
        <div className="max-w-[1400px] mx-auto px-10 pb-24">
          <div className="glass border border-white/[0.06] rounded-[28px] p-10 text-white/45 tracking-[0.22em] uppercase text-xs animate-pulse">
            Cargando histórico por equipo…
          </div>
        </div>
      ) : (
        <HoyExpandableRow
          games={filtered}
          onOpen={onOpen}
          date={date}
          titleOverride={titleOverride}
          kicker="07 · Histórico filtrado"
          primaryLabel="cards encontradas"
          secondaryValue={targetWinProb == null ? matchingTeams.length : targetWinProb}
          secondarySuffix={targetWinProb == null ? '' : '%'}
          secondaryLabel={targetWinProb == null ? 'equipos coincidentes' : 'win prob objetivo'}
          description={resolvedTeam
            ? `Ventana de 90 días hasta ${date}. Las cards son exactamente las mismas de Hoy, filtradas desde el backend para ${TEAM_NAMES[resolvedTeam] || resolvedTeam} y ${targetWinProb == null ? 'limitadas a juegos finalizados para ver cómo le fue.' : `además recortadas a juegos donde su win probability mostrada cae dentro de ${Number(targetWinProb - tolerance).toFixed(1)}% a ${Number(targetWinProb + tolerance).toFixed(1)}%, sin importar si fue local o visita.`}`
            : normalized
            ? 'Tu búsqueda todavía coincide con varios equipos o con ninguno. Prueba con una abreviación exacta como NYY, LAD o PHI para cargar sólo ese historial.'
            : 'Empieza escribiendo un equipo para ver únicamente sus cards y revisar su comportamiento reciente con el mismo formato visual de Hoy.'}
          emptyText={resolvedTeam
            ? `No encontré cards para "${query}"${targetWinProb == null ? '' : ` dentro del rango ${Number(targetWinProb - tolerance).toFixed(1)}% a ${Number(targetWinProb + tolerance).toFixed(1)}%`} en la ventana ${rangeStart} a ${date}.`
            : normalized
            ? `La búsqueda "${query}" no apunta todavía a un solo equipo.`
            : 'Escribe un equipo para cargar sus cards.'}
        />
      )}
    </>
  );
}

// Ball with a parabolic offset-path — computed per-viewport so the arc feels natural.
function BurstBall() {
  const ref = useRef(null);
  const trailRef = useRef(null);
  useLayoutEffect(() => {
    // Path from batter's contact zone → up through a high pixel peak → off top-right.
    // We use viewport %s so it scales with screen size.
    const vw = window.innerWidth, vh = window.innerHeight;
    const startX = vw * 0.22, startY = vh * 0.68;      // batter contact
    const peakX  = vw * 0.55, peakY  = vh * 0.12;      // high arc apex
    const endX   = vw * 1.10, endY   = vh * 0.30;      // off-screen right
    const path = `path("M ${startX} ${startY} Q ${peakX} ${peakY}, ${endX} ${endY}")`;
    if (ref.current) ref.current.style.offsetPath = path;
    if (trailRef.current) trailRef.current.style.offsetPath = path;
  }, []);
  return (
    <>
      <div ref={trailRef} className="run-burst-ball-trail"/>
      <div ref={ref} className="run-burst-ball"/>
    </>
  );
}

// ─── FLASHCORE BOARD ─────────────────────────────────────────────────────────
function FlashcoreBoard({ games, onOpen, date }) {
  const slipKey = `strikecast:flash-slip:${date || 'today'}`;
  const [manualPicks, setManualPicks] = useState(() => {
    try {
      const raw = localStorage.getItem(slipKey);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  });
  useEffect(() => {
    try {
      const raw = localStorage.getItem(slipKey);
      const parsed = raw ? JSON.parse(raw) : [];
      setManualPicks(Array.isArray(parsed) ? parsed : []);
    } catch { setManualPicks([]); }
  }, [slipKey]);
  useEffect(() => {
    try { localStorage.setItem(slipKey, JSON.stringify(manualPicks)); } catch {}
  }, [slipKey, manualPicks]);
  const sortedGames = useMemo(() => [...games].sort((a, b) => {
    const ta = a.first_pitch_utc ? Date.parse(a.first_pitch_utc) : Number.POSITIVE_INFINITY;
    const tb = b.first_pitch_utc ? Date.parse(b.first_pitch_utc) : Number.POSITIVE_INFINITY;
    if (ta !== tb) return ta - tb;
    const homeA = TEAM_NAMES[a.home_abbrev] || a.home_abbrev || '';
    const homeB = TEAM_NAMES[b.home_abbrev] || b.home_abbrev || '';
    if (homeA !== homeB) return homeA.localeCompare(homeB);
    if ((a.slot || 999) !== (b.slot || 999)) return (a.slot || 999) - (b.slot || 999);
    return (a.game_pk || 0) - (b.game_pk || 0);
  }), [games]);
  const manualMap = useMemo(() => new Map(manualPicks.map(p => [String(p.game_pk), p.side])), [manualPicks]);
  const manualGames = useMemo(() => sortedGames
    .map(g => ({ game: g, side: manualMap.get(String(g.game_pk)) }))
    .filter(x => x.side), [sortedGames, manualMap]);
  const toggleManualPick = (g, side) => {
    setManualPicks(prev => {
      const key = String(g.game_pk);
      const existing = prev.find(p => String(p.game_pk) === key);
      if (existing && existing.side === side) return prev.filter(p => String(p.game_pk) !== key);
      return [...prev.filter(p => String(p.game_pk) !== key), { game_pk: g.game_pk, side }];
    });
  };
  const clearManualPicks = () => setManualPicks([]);
  const fmtStatus = (g) => {
    if (g.is_played) return 'FINAL';
    if (g.is_live) {
      const state = g.game_state || {};
      return state.detailed || state.inning_state || 'EN VIVO';
    }
    if (!g.first_pitch_utc) return 'TBD';
    try {
      return new Date(g.first_pitch_utc).toLocaleTimeString('en-US', {
        timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: false
      });
    } catch { return 'TBD'; }
  };
  const predictionSide = (g) => {
    if (g.value_side && (g.ev_grade === 'sweet' || g.ev_grade === 'marginal')) return g.value_side;
    if (g.pick_abbrev === g.home_abbrev) return 'HOME';
    if (g.pick_abbrev === g.away_abbrev) return 'AWAY';
    return null;
  };
  const pickStatus = (g, side) => {
    if (predictionSide(g) !== side) return 'none';
    if (g.is_played && g.home_score != null && g.away_score != null) {
      const pickWon = side === 'HOME' ? g.home_score > g.away_score : g.away_score > g.home_score;
      return pickWon ? 'win' : 'loss';
    }
    return 'pending';
  };
  const oddStyle = (g, side) => {
    const status = pickStatus(g, side);
    if (status === 'loss') return { borderColor:'#E63946', background:'rgba(230,57,70,0.16)', color:'#ff6b76' };
    if (status === 'win' || status === 'pending') return { borderColor:'#FFD43B', background:'rgba(255,212,59,0.10)', color:'#fff' };
    return null;
  };
  const moveMark = (g, side) => {
    if (pickStatus(g, side) === 'loss') return <span style={{ color:'#ff6b76' }} className="mr-1">↓</span>;
    if (predictionSide(g) !== side) return null;
    if (g.value_side === side && g.ev_grade_reason === 'slot_flip') return <span className="text-accent-gold mr-1">↻</span>;
    if (g.value_side === side && g.ev_grade_reason === 'slot_sharp') return <span className="text-accent-blue mr-1">↑</span>;
    if (g.value_side === side && g.ev_grade_reason === 'dog_46_48') return <span className="text-accent-green mr-1">↑</span>;
    return <span className="text-accent-green mr-1">↑</span>;
  };
  const teamLine = (g, side) => {
    const isHome = side === 'HOME';
    const abbr = isHome ? g.home_abbrev : g.away_abbrev;
    const score = isHome ? g.home_score : g.away_score;
    const probability = isHome ? g.p_home : g.p_away;
    const isModelFavorite = probability != null && probability >= 0.5;
    const isWinner = g.is_played && g.home_score != null && g.away_score != null
      ? (isHome ? g.home_score > g.away_score : g.away_score > g.home_score)
      : false;
    return (
      <div className={`grid grid-cols-[30px_1fr_34px] items-center gap-2 min-h-[34px] ${isWinner ? 'text-white' : 'text-white/72'}`}>
        <div className="w-[28px] h-[28px] rounded-md bg-white/[0.035] border border-white/[0.05] grid place-items-center">
          <img src={teamLogo(abbr)} alt={abbr} className="w-[23px] h-[23px] object-contain" onError={(e)=>e.target.style.opacity=0.16}/>
        </div>
        <span className="min-w-0 flex items-baseline gap-2">
          <span className={`truncate text-[13px] ${isWinner ? 'font-extrabold' : 'font-semibold'}`}>{TEAM_NAMES[abbr] || abbr}</span>
          <span className="shrink-0 text-[9px] font-black text-white/25">{abbr}</span>
          {probability != null && (
            <span className={`shrink-0 rounded px-1.5 py-0.5 text-[9px] tabular-nums font-black ${isModelFavorite ? 'bg-accent-blue/10 text-accent-blue' : 'bg-white/[0.035] text-white/35'}`}>
              {(probability * 100).toFixed(1)}%
            </span>
          )}
        </span>
        <span className={`text-right tabular-nums text-[17px] ${isWinner ? 'font-black' : 'font-bold text-white/65'}`}>{score ?? '–'}</span>
      </div>
    );
  };
  const oddBox = (g, side) => {
    const dec = side === 'HOME' ? g.market_home_decimal : g.market_away_decimal;
    const isPick = pickStatus(g, side) !== 'none';
    const isManual = manualMap.get(String(g.game_pk)) === side;
    return (
      <button
        type="button"
        onClick={(e) => { e.stopPropagation(); toggleManualPick(g, side); }}
        title={`Agregar ${side === 'HOME' ? g.home_abbrev : g.away_abbrev} a mi tabla`}
        style={oddStyle(g, side) || undefined}
        className={`h-[32px] w-full rounded-md border px-2 flex items-center justify-center text-[11px] font-black tabular-nums transition
          ${isPick ? '' : 'border-white/[0.08] bg-ink-2/55 text-white/80'}
          ${isManual ? 'ring-1 ring-accent-green border-accent-green bg-accent-green/15 shadow-[0_0_18px_rgba(81,207,102,0.18)]' : 'hover:border-accent-blue/55 hover:bg-accent-blue/10'}`}>
        {moveMark(g, side)}{dec != null ? dec.toFixed(2) : '–'}
        <span className="text-[8px] text-white/35 ml-0.5">↗</span>
      </button>
    );
  };
  const manualPickBadge = (g, side) => {
    const abbr = side === 'HOME' ? g.home_abbrev : g.away_abbrev;
    const status = pickStatus(g, side);
    const color = status === 'win' ? 'border-accent-green/60 text-accent-green bg-accent-green/10'
      : status === 'loss' ? 'border-accent-red/60 text-accent-red bg-accent-red/10'
      : 'border-accent-gold/55 text-accent-gold bg-accent-gold/10';
    return (
      <span className={`inline-flex items-center justify-center rounded border px-2.5 py-1 text-[10px] font-black tracking-wide ${color}`}>
        {status === 'win' ? '✓' : status === 'loss' ? '✗' : '◆'} {abbr}
      </span>
    );
  };
  return (
    <div className="px-4 md:px-10 pb-32 max-w-[1540px] mx-auto -mt-8">
      <div className="grid grid-cols-1 xl:grid-cols-[minmax(820px,1fr)_360px] gap-5 items-start">
      <div className="overflow-x-auto rounded-xl border border-white/[0.09] bg-[#071722]/95 shadow-[0_26px_80px_rgba(0,0,0,0.42)]">
        <div className="min-w-[780px]">
        <div className="h-14 px-5 flex items-center justify-between bg-[linear-gradient(90deg,#0c3150,#0a263d)] border-b border-white/[0.08]">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-md bg-white text-[#092b47] grid place-items-center text-[10px] font-black">MLB</div>
            <div>
              <div className="text-[12px] font-black tracking-[0.08em] uppercase">Major League Baseball</div>
              <div className="text-[9px] text-white/40 mt-0.5">Estados Unidos · Moneyline</div>
            </div>
          </div>
          <div className="flex items-center gap-3 text-[10px] uppercase tracking-[0.16em] text-white/45">
            <span>{fmtDateLong(date)}</span>
            <span className="px-2.5 py-1 rounded-full bg-white/[0.06] text-white/65 font-black">{sortedGames.length} juegos</span>
          </div>
        </div>
        <div className="grid grid-cols-[106px_1fr_88px_88px] items-center gap-3 h-9 px-4 bg-[#06131d] border-b border-white/[0.06] text-[9px] font-black uppercase tracking-[0.18em] text-white/35">
          <span>Estado</span>
          <span>Evento / Prob. modelo</span>
          <span className="text-center">Local</span>
          <span className="text-center">Visitante</span>
        </div>
        {sortedGames.length === 0 ? (
          <div className="py-14 text-center text-white/45 text-sm">Sin eventos para {fmtDateLong(date)}.</div>
        ) : sortedGames.map((g) => {
          const modelSide = predictionSide(g);
          const modelStatus = modelSide ? pickStatus(g, modelSide) : 'none';
          const rowTone = modelStatus === 'win' ? 'border-l-accent-green bg-accent-green/[0.025]'
            : modelStatus === 'loss' ? 'border-l-accent-red bg-accent-red/[0.025]'
            : g.is_live ? 'border-l-accent-green bg-accent-green/[0.02]'
            : 'border-l-transparent bg-[#071722]';
          return (
            <div key={g.game_pk} onClick={() => onOpen(g)} role="button" tabIndex={0}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') onOpen(g); }}
              className={`grid grid-cols-[106px_1fr_88px_88px] items-center gap-3 px-4 py-2.5 border-l-[3px] border-b border-b-white/[0.055] ${rowTone} hover:bg-[#0a2230] transition text-left cursor-pointer`}>
              <div className="self-stretch flex flex-col justify-center border-r border-white/[0.06] pr-3">
                <span className={`text-[10px] font-black tracking-[0.12em] ${g.is_live ? 'text-accent-green' : g.is_played ? 'text-white/55' : 'text-accent-blue'}`}>{fmtStatus(g)}</span>
                <span className="text-[9px] text-white/25 mt-1">Juego #{g.slot || '–'}</span>
                {modelStatus === 'win' && <span className="text-[8px] text-accent-green font-black mt-1">✓ PICK</span>}
                {modelStatus === 'loss' && <span className="text-[8px] text-accent-red font-black mt-1">✕ PICK</span>}
              </div>
              <div className="min-w-0">
                {teamLine(g, 'HOME')}
                {teamLine(g, 'AWAY')}
              </div>
              <div className="flex flex-col gap-2">{oddBox(g, 'HOME')}</div>
              <div className="flex flex-col gap-2">{oddBox(g, 'AWAY')}</div>
            </div>
          );
        })}
        </div>
      </div>
      <div className="rounded-xl overflow-hidden border border-white/[0.09] bg-[#071722]/95 shadow-[0_26px_80px_rgba(0,0,0,0.38)] xl:sticky xl:top-24">
        <div className="flex items-center justify-between h-14 px-4 bg-[linear-gradient(90deg,#123629,#0a2b24)] border-b border-accent-green/20">
          <div className="flex items-center gap-3">
            <span className="w-8 h-8 rounded-md bg-accent-green text-ink-0 grid place-items-center font-black">+</span>
            <div><div className="text-[11px] font-black uppercase tracking-[0.16em]">Mi tabla</div><div className="text-[9px] text-white/35">Selecciones manuales</div></div>
          </div>
          <button type="button" onClick={clearManualPicks}
            className="text-[9px] uppercase tracking-wider text-white/35 hover:text-accent-red transition">
            Limpiar
          </button>
        </div>
        {manualGames.length === 0 ? (
          <div className="px-7 py-12 text-center">
            <div className="w-12 h-12 mx-auto rounded-full border border-dashed border-white/15 grid place-items-center text-white/25 text-xl mb-4">+</div>
            <div className="text-[13px] font-bold text-white/75">Tu tabla está vacía</div>
            <div className="text-[10px] text-white/35 mt-2 leading-relaxed">
              Selecciona una cuota local o visitante para añadirla al boleto.
            </div>
          </div>
        ) : manualGames.map(({ game:g, side }) => (
          <div key={`manual-${g.game_pk}`} onClick={() => onOpen(g)} role="button" tabIndex={0}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') onOpen(g); }}
            className="grid grid-cols-[24px_1fr_auto] items-center gap-3 px-4 py-3 border-b border-white/[0.06] bg-[#071722] hover:bg-[#0a2230] transition text-left cursor-pointer">
            <button type="button" onClick={(e) => { e.stopPropagation(); toggleManualPick(g, side); }}
              className="w-6 h-6 rounded border border-white/10 text-[15px] text-white/45 hover:text-accent-red hover:border-accent-red/40 leading-none" title="Quitar">×</button>
            <div className="min-w-0">
              <div className="text-[9px] text-white/30 mb-1">{fmtStatus(g)} · {g.away_abbrev} @ {g.home_abbrev}</div>
              <div className="font-bold text-[12px] truncate">{TEAM_NAMES[side === 'HOME' ? g.home_abbrev : g.away_abbrev]}</div>
            </div>
            {manualPickBadge(g, side)}
          </div>
        ))}
        {manualGames.length > 0 && (
          <div className="px-4 py-4 bg-[#05131b] text-[9px] uppercase tracking-[0.18em] text-white/35 flex justify-between">
            <span>{manualGames.length} selecciones</span>
            <span className="text-accent-green">Boleto activo</span>
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

// ─── BURN PANEL — "carne al asador" ──────────────────────────────────────────
// Shows teams that burned heavy yesterday (bullpen, extra innings, comeback).
// Historical data: heavy burns (>=65) actually correlate with +3pp WR today,
// so this is contextual narrative, NOT a hangover prediction.
function BurnPanel({ data }) {
  if (!data?.burns?.length) return null;
  // Only show teams with meaningful burn (>= 35) — anything lower is noise
  const heavy = data.burns.filter(b => b.burn_score >= 35).slice(0, 8);
  if (!heavy.length) return null;

  const tier = (s) =>
    s >= 65 ? { label:'CARNE AL ASADOR', color:'text-accent-red', bg:'bg-accent-red/15 border-accent-red/40' } :

// ─── YESTERDAY BANNER ────────────────────────────────────────────────────────
function YesterdayBanner({ data }) {
  if (!data?.recent?.length) return null;
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const ydStr = yd.toISOString().split('T')[0];
  const picks = data.recent.filter(r => r.date === ydStr && r.value_profit != null);
  if (!picks.length) return null;
  const won = picks.filter(r => r.value_won).length;
  const units = picks.reduce((s, r) => s + (r.value_profit || 0), 0);
  const positive = units >= 0;
  return (
    <div className="mx-10 mb-2 -mt-2 flex items-center gap-4 px-5 py-3 rounded-2xl bg-white/[0.03] border border-white/[0.07] text-[11px]">
      <span className="text-white/40 uppercase tracking-[0.22em] font-black text-[9px]">Ayer</span>
      <span className="font-black text-white/80">{won}-{picks.length - won}</span>
      <span className={`font-black tabular-nums ${positive ? 'text-accent-green' : 'text-accent-red'}`}>
        {positive ? '+' : ''}{units.toFixed(2)} u
      </span>
      <span className="text-white/28 text-[9px]">picks +EV · {ydStr}</span>
    </div>
  );
}

// ─── BANKROLL CHART ──────────────────────────────────────────────────────────
function BankrollChart({ rows }) {
  const picks = [...rows].filter(r => r.value_profit != null).sort((a, b) => a.date > b.date ? 1 : -1);
  if (picks.length < 3) return null;
  const START = 1000, FLAT = 100;
  let bk = START;
  const pts = picks.map(r => { bk += r.value_profit * FLAT; return { bk, won: r.value_won, date: r.date }; });
  const final = pts[pts.length - 1]?.bk ?? START;
  const pnl = final - START;
  const positive = pnl >= 0;
  const W = 340, H = 80;
  const minV = Math.min(START * 0.88, ...pts.map(p => p.bk));
  const maxV = Math.max(START * 1.12, ...pts.map(p => p.bk));
  const range = maxV - minV || 1;
  const toX = i => (i / (pts.length - 1)) * W;
  const toY = v => H - ((v - minV) / range * H);
  const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${toX(i).toFixed(1)},${toY(p.bk).toFixed(1)}`).join(' ');
  const color = positive ? '#51CF66' : '#E63946';
  return (
    <div data-fade className="glass border border-white/[0.06] rounded-[28px] p-7 mt-5">
      <div className="flex items-start justify-between mb-4">
        <div>
          <div className="text-[11px] uppercase tracking-[0.28em] text-white/45 font-black mb-1">Simulador de bankroll</div>
          <div className="text-[10px] text-white/30">$100 plano por pick +EV · inicio $1,000</div>
        </div>
        <div className="text-right">
          <div className={`text-3xl tabular-nums font-black ${positive ? 'text-accent-green' : 'text-accent-red'}`}>${final.toFixed(0)}</div>
          <div className={`text-[11px] font-black tabular-nums ${positive ? 'text-accent-green/70' : 'text-accent-red/70'}`}>
            {positive ? '+' : ''}${pnl.toFixed(0)} ({((pnl / START) * 100).toFixed(1)}%)
          </div>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-20 overflow-visible">
        <defs>
          <linearGradient id="bkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={`${pathD} L${W},${H} L0,${H} Z`} fill="url(#bkGrad)"/>
        <line x1="0" y1={toY(START)} x2={W} y2={toY(START)} stroke="rgba(255,255,255,0.1)" strokeWidth="1" strokeDasharray="4,3"/>
        <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
        {pts.map((p, i) => (
          <circle key={i} cx={toX(i)} cy={toY(p.bk)} r="2.5" fill={p.won ? '#51CF66' : '#E63946'} opacity="0.65"/>
        ))}
      </svg>
      <div className="flex items-center gap-4 mt-3 text-[9px] text-white/30">
        <span><span className="inline-block w-2 h-2 rounded-full bg-accent-green mr-1 align-middle"/>Ganó</span>
        <span><span className="inline-block w-2 h-2 rounded-full bg-accent-red mr-1 align-middle"/>Perdió</span>
        <span className="ml-auto">{picks.length} picks +EV totales</span>
      </div>
    </div>
  );
}

function GradeBreakdown({ grades }) {
  const order = ['sweet', 'marginal', 'no_edge', 'overconfident', 'skip', 'no_data'];
  const sorted = [...grades].sort((a,b) => order.indexOf(a.grade) - order.indexOf(b.grade));
  const label = (g) => g === 'sweet' ? 'Sweet spot' :
    g === 'marginal' ? 'Marginal' :
    g === 'no_edge' ? 'No bet' :
    g === 'overconfident' ? 'Riesgoso' :
    g === 'skip' ? 'Slot skip' : g;
  return (
    <div data-fade className="glass border border-accent-gold/15 rounded-[28px] p-7">
      <div className="text-[11px] uppercase tracking-[0.28em] text-accent-gold font-black mb-6">Por categoría</div>
      <div className="space-y-3">
        {sorted.map(g => {

              <div>
                <div className="font-black text-white/85">{label(g.grade)}</div>
                <div className="text-[11px] text-white/38 mt-1">{g.games} juegos · {g.picks} picks</div>

              <div className="text-right">
                <div className={`font-black tabular-nums ${roi == null ? 'text-white/40' : roi >= 0 ? 'text-accent-green' : 'text-accent-red'}`}>{perfPct(g.roi)}</div>
                <div className="text-[10px] text-white/35 uppercase tracking-[0.16em]">ROI</div>

            </div>
          );
        })}

          </div>
        ))}
      </div>
    </div>

}

// ─── ERROR VULNERABILITY PAGE ────────────────────────────────────────────────
function ErrorPage({ data, loading, season, onSeasonChange }) {
  const wrapRef = useRef(null);
  useLayoutEffect(() => {
    if (!wrapRef.current || !data) return;
    gsap.fromTo(wrapRef.current.querySelectorAll('[data-fade]'),
      { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.04 });
  }, [data]);

  const [sortBy, setSortBy] = React.useState('resilience'); // 'resilience' | 'avg_errors' | 'wr_with_error'

  if (loading || !data) return (
    <div className="max-w-[1400px] mx-auto px-10 pb-24 pt-10">
      <div className="glass border border-white/[0.06] rounded-[28px] p-10 text-white/45 tracking-[0.22em] uppercase text-xs animate-pulse">Calculando vulnerabilidad defensiva…</div>
    </div>
  );

  const teams = [...(data.teams || [])].sort((a, b) => {
    if (sortBy === 'resilience') return (b.resilience ?? -99) - (a.resilience ?? -99);
    if (sortBy === 'avg_errors') return b.avg_errors - a.avg_errors;
    if (sortBy === 'wr_with_error') return (b.wr_with_error ?? 0) - (a.wr_with_error ?? 0);
    return 0;
  });

  const avgResilience = teams.reduce((s, t) => s + (t.resilience ?? 0), 0) / teams.length;

  return (
    <div ref={wrapRef} className="max-w-[1400px] mx-auto px-10 pb-24">
      <div data-fade className="flex items-end justify-between mb-8 pt-2">
        <div>
          <div className="text-[11px] uppercase tracking-[0.32em] text-accent-red mb-3 font-bold">Errores defensivos</div>
          <h2 className="mega text-[clamp(36px,5vw,80px)] leading-[0.9]">
            Vulnerabilidad<br/><span className="text-white/30 text-[0.55em]">cuando cometen errores</span>
          </h2>
          <p className="text-white/38 text-sm mt-3 max-w-[520px]">
            Con 0 errores los equipos ganan ~58%. Con 2+ errores caen a ~35%.
            La "resiliencia" mide cuánto le afecta a cada equipo cometer errores.
          </p>
        </div>
        <div className="flex flex-col items-end gap-3">
          <div className="flex gap-2">
            {[2023,2024,2025,2026].map(y => (
              <button key={y} onClick={() => onSeasonChange(y)}
                className={`px-3 py-1.5 rounded-xl text-[10px] font-black tracking-wider uppercase border transition-all
                  ${season===y ? 'bg-accent-red/15 border-accent-red/45 text-accent-red' : 'border-white/10 text-white/35 hover:border-white/25'}`}>
                {y}
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            {[['resilience','Más resilientes'],['avg_errors','Más errores'],['wr_with_error','Mejor con errores']].map(([k,l]) => (
              <button key={k} onClick={() => setSortBy(k)}
                className={`px-3 py-1.5 rounded-xl text-[10px] font-black tracking-wider uppercase border transition-all
                  ${sortBy===k ? 'bg-white/10 border-white/25 text-white' : 'border-white/[0.06] text-white/35 hover:border-white/18'}`}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Header row */}
      <div data-fade className="grid grid-cols-[2fr_1fr_1fr_1fr_1fr_1fr_1.4fr] gap-3 px-4 pb-2 text-[9px] uppercase tracking-[0.22em] text-white/28 font-black">
        <span>Equipo</span>
        <span className="text-right">Sin errores</span>
        <span className="text-right">Con error</span>
        <span className="text-right">Con 2+</span>
        <span className="text-right">Prom errores</span>
        <span className="text-right">% juegos c/error</span>
        <span className="text-right">Resiliencia</span>
      </div>

      {teams.filter(t => ['ATL','AZ','BAL','BOS','CHC','CIN','CLE','COL','CWS','DET',
        'HOU','KC','LAA','LAD','MIA','MIL','MIN','NYM','NYY','OAK','ATH',
        'PHI','PIT','SD','SEA','SF','STL','TB','TEX','TOR','WSH'].includes(t.team)).map((t, i) => {
        const res = t.resilience ?? 0;
        const isGood = res > avgResilience;      // less hurt than avg
        const isBad  = res < avgResilience - 0.08;
        const barW   = Math.max(0, Math.min(100, (res + 0.30) / 0.35 * 100));
        return (
          <div key={t.team} data-fade
            className={`grid grid-cols-[2fr_1fr_1fr_1fr_1fr_1fr_1.4fr] gap-3 items-center px-4 py-3 rounded-2xl border mb-1.5
              ${isBad  ? 'bg-accent-red/[0.04] border-accent-red/18'
              : isGood ? 'bg-accent-green/[0.03] border-accent-green/15'
              : 'bg-white/[0.02] border-white/[0.05]'}`}>
            <div className="flex items-center gap-3">
              <span className="text-[9px] text-white/22 tabular-nums w-4">{i+1}</span>
              <img src={`https://www.mlbstatic.com/team-logos/${_teamIdFromAbbrev(t.team)||0}.svg`}
                className="w-6 h-6 object-contain opacity-75" onError={e=>e.target.style.display='none'}/>
              <span className="font-black text-white/90">{t.team}</span>
            </div>
            <div className="text-right tabular-nums text-white/60 font-bold">{t.wr_no_error != null ? (t.wr_no_error*100).toFixed(0)+'%' : '—'}</div>
            <div className="text-right tabular-nums font-bold text-white/80">{t.wr_with_error != null ? (t.wr_with_error*100).toFixed(0)+'%' : '—'}</div>
            <div className={`text-right tabular-nums font-bold ${t.wr_multi_error != null && t.wr_multi_error < 0.33 ? 'text-accent-red/80' : 'text-white/55'}`}>
              {t.wr_multi_error != null ? (t.wr_multi_error*100).toFixed(0)+'%' : '—'}
            </div>
            <div className="text-right tabular-nums text-white/50">{t.avg_errors.toFixed(2)}</div>
            <div className="text-right tabular-nums text-white/45">{(t.error_game_pct*100).toFixed(0)}%</div>
            <div className="flex items-center gap-2 justify-end">
              <div className="w-20 h-1.5 rounded-full bg-white/[0.06] overflow-hidden">
                <div className={`h-full rounded-full ${isBad ? 'bg-accent-red/60' : isGood ? 'bg-accent-green/60' : 'bg-white/30'}`}
                  style={{width:`${barW}%`}}/>
              </div>
              <span className={`tabular-nums font-black text-[11px] w-14 text-right
                ${isBad ? 'text-accent-red' : isGood ? 'text-accent-green' : 'text-white/55'}`}>
                {res >= 0 ? '+' : ''}{(res*100).toFixed(1)}pp
              </span>
            </div>
          </div>
        );
      })}
      <div data-fade className="mt-6 px-4 text-[10px] text-white/25 leading-relaxed max-w-[600px]">
        Resiliencia = WR con error − WR sin error. Promedio histórico: −13.6pp.
        Equipos cerca de 0 mantienen competitividad incluso cuando fallan en defensa.
        Equipos en rojo son especialmente vulnerables — un error cambia el juego.
      </div>
    </div>
  );
}

function _teamIdFromAbbrev(abbrev) {
  const MAP = {
    ARI:109,ATH:133,ATL:144,BAL:110,BOS:111,CHC:112,CIN:113,CLE:114,COL:115,
    CWS:145,DET:116,HOU:117,KC:118,LAA:108,LAD:119,MIA:146,MIL:158,MIN:142,
    NYM:121,NYY:147,OAK:133,PHI:143,PIT:134,SD:135,SEA:136,SF:137,STL:138,
    TB:139,TEX:140,TOR:141,WSH:120,AZ:109,
  };
  return MAP[abbrev] || null;
}

function WinProbabilityChart({ pk, awayAbbr, homeAbbr }) {
  const [data, setData] = useState(null);
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!pk) return;
    let alive = true;
    const load = () => fetch(`/api/games/${pk}/win_probability?t=${Date.now()}`)
      .then(r => r.json()).then(d => alive && setData(d)).catch(() => {});
    load();
    // Refresh every 30s so live games update their curve
    const t = setInterval(load, 30000);
    return () => { alive = false; clearInterval(t); };
  }, [pk]);

  if (!data || !data.plays || data.plays.length === 0) {
    return (
      <div className="rounded-2xl border border-white/[0.06] bg-ink-2/40 p-6 text-center text-[11px] tracking-[0.2em] uppercase text-white/35">
        Sin datos de win probability
      </div>
    );
  }

  const plays = data.plays;
  const W = 720, H = 240, PAD = 32;
  const innerW = W - 2 * PAD, innerH = H - 2 * PAD;
  const xs = (i) => PAD + (i / Math.max(1, plays.length - 1)) * innerW;
  const ys = (p) => PAD + (1 - p) * innerH;

  // Home win prob path
  const pathHome = plays.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xs(i).toFixed(1)} ${ys(p.p_home).toFixed(1)}`).join(' ');
  // Filled area: split into "home above 50" (blue) and "away above 50" (red)
  const area = `${pathHome} L ${xs(plays.length-1).toFixed(1)} ${ys(0.5).toFixed(1)} L ${xs(0).toFixed(1)} ${ys(0.5).toFixed(1)} Z`;

  // Inning markers
  const innings = [];
  let prevInning = null;
  plays.forEach((p, i) => {
    if (p.inning != null && p.inning !== prevInning && p.half === 'top') {
      innings.push({ i, inning: p.inning });
      prevInning = p.inning;
    }
  });

  const final = plays[plays.length - 1];
  const initial = plays[0];

  return (
    <div className="rounded-2xl border border-white/[0.06] bg-ink-2/40 p-5">
      <div className="flex items-center justify-between mb-3">
        <span className="text-[10px] tracking-[0.22em] uppercase text-white/55 font-bold">Win Probability · Play by Play</span>
        <div className="flex gap-4 text-[11px] tabular-nums">
          <span className="flex items-center gap-1.5"><span className="w-3 h-1 bg-accent-blue rounded"/><span className="text-white/65">{homeAbbr}</span><span className="text-white/40">inicio {(initial.p_home*100).toFixed(0)}%</span></span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-1 bg-accent-red rounded"/><span className="text-white/65">{awayAbbr}</span></span>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" onMouseLeave={()=>setHover(null)}>
        {/* gridlines at 25/50/75 */}
        {[0.25, 0.5, 0.75].map(p => (
          <line key={p} x1={PAD} x2={W-PAD} y1={ys(p)} y2={ys(p)}
            stroke="white" strokeOpacity={p===0.5?0.18:0.06} strokeDasharray={p===0.5?'':'2 3'}/>
        ))}
        {/* shaded area: above 50 = home advantage */}
        <defs>
          <linearGradient id="wpGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="#4DABF7" stopOpacity="0.35"/>
            <stop offset="50%" stopColor="#4DABF7" stopOpacity="0"/>
            <stop offset="50%" stopColor="#E63946" stopOpacity="0"/>
            <stop offset="100%" stopColor="#E63946" stopOpacity="0.35"/>
          </linearGradient>
        </defs>
        <rect x={PAD} y={PAD} width={innerW} height={innerH} fill="url(#wpGrad)"/>
        {/* inning markers */}
        {innings.map(({i, inning}) => (
          <g key={inning} opacity={0.55}>
            <line x1={xs(i)} x2={xs(i)} y1={PAD} y2={H-PAD} stroke="white" strokeOpacity="0.08" strokeDasharray="2 3"/>
            <text x={xs(i)} y={H-PAD+14} fontSize="9" fill="white" fillOpacity="0.45" textAnchor="middle" fontFamily="Inter, sans-serif">
              {inning}
            </text>
          </g>
        ))}
        {/* main line */}
        <path d={pathHome} fill="none" stroke="#4DABF7" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
        {/* scoring play dots */}
        {plays.map((p, i) => p.is_scoring && (
          <circle key={i} cx={xs(i)} cy={ys(p.p_home)} r="3.5" fill="#FFD43B" stroke="#03060c" strokeWidth="1.2"/>
        ))}
        {/* hover interaction */}
        <rect x={PAD} y={PAD} width={innerW} height={innerH} fill="transparent"
          onMouseMove={(e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (W / rect.width);
            const idx = Math.max(0, Math.min(plays.length-1, Math.round((px - PAD) / innerW * (plays.length-1))));
            setHover({ idx, p: plays[idx] });
          }}/>
        {hover && (
          <g pointerEvents="none">
            <line x1={xs(hover.idx)} x2={xs(hover.idx)} y1={PAD} y2={H-PAD} stroke="#FFD43B" strokeOpacity="0.6" strokeWidth="1"/>
            <circle cx={xs(hover.idx)} cy={ys(hover.p.p_home)} r="5" fill="#FFD43B" stroke="#03060c" strokeWidth="1.4"/>
          </g>
        )}
        {/* y axis labels */}
        <text x={PAD-6} y={ys(0.75)+3} fontSize="9" fill="white" fillOpacity="0.45" textAnchor="end" fontFamily="Inter, sans-serif">75%</text>
        <text x={PAD-6} y={ys(0.50)+3} fontSize="9" fill="white" fillOpacity="0.45" textAnchor="end" fontFamily="Inter, sans-serif">50%</text>
        <text x={PAD-6} y={ys(0.25)+3} fontSize="9" fill="white" fillOpacity="0.45" textAnchor="end" fontFamily="Inter, sans-serif">25%</text>
      </svg>
      <div className="flex items-center justify-between mt-2 text-[11px] tabular-nums">
        <span className="text-white/45">{plays.length} jugadas</span>
        {hover ? (
          <span className="text-white/80">
            Jugada {hover.idx + 1}
            {hover.p.inning != null && ` · Inn ${hover.p.inning}${hover.p.half === 'top' ? '↑' : '↓'}`}
            {hover.p.event && ` · ${hover.p.event}`}
            {hover.p.away_score != null && ` · ${awayAbbr} ${hover.p.away_score}–${hover.p.home_score} ${homeAbbr}`}
            <span className="ml-2 text-accent-blue">{homeAbbr} {(hover.p.p_home*100).toFixed(1)}%</span>
          </span>
        ) : (
          <span className="text-white/55">{homeAbbr} final <span className="text-accent-blue font-bold">{(final.p_home*100).toFixed(0)}%</span></span>
        )}
      </div>
    </div>
  );
}

function DetailBody({ d }) {
  const a = d.away_team, h = d.home_team;
  const ap = d.away_pitcher, hp = d.home_pitcher;
  const v = d.value || {};
  const mdl = d.model;
  const live = (d.live_score && d.live_score.state) || {};
  const isLive = live.is_live, played = d.result.played;
  const hasBoxScore = (d.live_score?.innings?.length || 0) > 0;
  const hasStarterActual = !!(d.starter_actual?.away || d.starter_actual?.home);
  const awayRuns = (d.live_score?.away?.runs) ?? d.result.away_score;
  const homeRuns = (d.live_score?.home?.runs) ?? d.result.home_score;
  const hasScore = awayRuns != null && homeRuns != null;
  const hasResult = played || isLive || hasBoxScore || hasStarterActual || hasScore;
  // Display probability: prefer live ESPN WP (updates with score) over the
  // pregame model prediction. Falls back to model when game hasn't started.
  const pHomeDisplay = (mdl.live_p_home != null && (isLive || hasResult)) ? mdl.live_p_home : mdl.p_home;
  const pAwayDisplay = pHomeDisplay != null ? (1 - pHomeDisplay) : mdl.p_away;
  const isLiveWp = mdl.live_p_home != null && (isLive || hasResult);
  // Empirical sweet spot — bet only when edge vs BOOK is in [0%, 2%].
  // edge ≥ 2pp → model overconfident, statistically loses money.
  const valueGood = v.value_side && (v.ev_grade === 'sweet' || v.ev_grade === 'marginal');
  const recommendation = valueGood
    ? { kind:'valor', team:v.value_team_abbrev, dec:v.value_decimal, edge:v.value_edge_pp }
    : (mdl.p_home != null
        ? { kind:'ml', team: mdl.p_home >= 0.5 ? h.abbrev : a.abbrev,
            dec: mdl.p_home >= 0.5 ? v.market_home_decimal : v.market_away_decimal,
            edge: mdl.p_home >= 0.5 ? v.home_edge_pp : v.away_edge_pp }
        : null);
  // Confidence level
  const pickHome = mdl.p_home != null && mdl.p_home >= 0.5;
  const confidence = pickHome ? mdl.p_home : (1 - mdl.p_home);
  const confLevel = confidence >= 0.58 ? 'Alta' : confidence >= 0.53 ? 'Media' : 'Baja';
  const confColor = confLevel === 'Alta' ? 'text-accent-green' : confLevel === 'Media' ? 'text-accent-gold' : 'text-accent-red';
  // Verdict
  const homeWon = hasResult && hasScore ? homeRuns > awayRuns : null;
  const pickedHome = recommendation && (recommendation.team === h.abbrev);
  const verdict = !hasResult || homeWon == null ? 'pending' : (pickedHome === homeWon ? 'win' : 'loss');
  // Projected score — convert win prob into run differential with a wider spread
  // so close games still show 1-run gap and clear favorites show 2-3 run gaps.
  const projTotal = mdl.pred_total_runs;
  let projAway = null, projHome = null;
  if (projTotal != null && mdl.p_home != null) {
    // ~ 0.55 → 0.5 run diff, 0.65 → 1.5, 0.75 → 2.5
    const runDiff = Math.abs(mdl.p_home - 0.5) * 10;
    const half = projTotal / 2;
    const favRuns = Math.max(1, Math.round(half + runDiff / 2));
    const dogRuns = Math.max(0, Math.round(half - runDiff / 2));
    // Guarantee favorite > underdog by at least 1
    const finalFav = favRuns <= dogRuns ? dogRuns + 1 : favRuns;
    if (pickHome) { projHome = finalFav; projAway = dogRuns; }
    else          { projAway = finalFav; projHome = dogRuns; }
  }
  // Donut SVG (probability split)
  const pH = mdl.p_home ?? 0.5;
  const circumference = 2 * Math.PI * 60;
  const analysis = buildGameAnalysis({ d, a, h, ap, hp, v, mdl, recommendation, confidence, confLevel, valueGood });

  return (
    <div className="max-w-[1480px] mx-auto px-10 pt-8 pb-12">
      {/* HERO MATCHUP */}
      <div className="relative overflow-hidden border border-white/[0.08] rounded-[32px] px-10 py-9 mb-5
        bg-[radial-gradient(circle_at_50%_0%,rgba(77,171,247,0.14),transparent_42%),linear-gradient(145deg,rgba(13,20,36,0.94),rgba(3,6,12,0.98))]
        shadow-[0_28px_95px_rgba(0,0,0,0.45)]">
        <div className="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-accent-blue to-transparent opacity-80"/>
        <div className="absolute -left-24 -top-24 w-72 h-72 rounded-full bg-accent-red/12 blur-3xl"/>
        <div className="absolute -right-24 -top-24 w-72 h-72 rounded-full bg-accent-blue/14 blur-3xl"/>
        <div className="relative grid grid-cols-[1fr_auto_1fr_auto] items-center gap-8">
          {/* Away team */}
          <div className="text-center">
            <div className="w-36 h-36 mx-auto mb-4 rounded-[28px] bg-white/[0.035] border border-white/[0.07] flex items-center justify-center shadow-inner">
              <img src={a.logo} className="w-28 h-28 object-contain drop-shadow-[0_16px_30px_rgba(0,0,0,0.5)]" onError={(e)=>e.target.style.opacity=0.18}/>
            </div>
            <div className="text-[10px] tracking-[0.36em] uppercase text-white/45 mb-1 font-black">{(a.name || a.abbrev).split(' ')[0]}</div>
            <div className="mega text-5xl tracking-tight text-accent-red">{(a.name || a.abbrev).split(' ').slice(1).join(' ').toUpperCase() || a.abbrev}</div>
            <div className="text-white/55 text-sm mt-2 font-medium">{a.wins ?? '–'}-{a.losses ?? '–'}</div>
            <div className="text-accent-red font-black text-2xl mt-4 tabular-nums">{fmtPct(pAwayDisplay)} <span className="text-white/40 text-[10px] tracking-[0.22em] ml-1">{isLiveWp ? 'WIN PROB · LIVE' : 'WIN PROB'}</span></div>
            {isLiveWp && mdl.p_away != null && (
              <div className="text-white/30 text-[10px] tracking-[0.18em] uppercase mt-1 tabular-nums">pregame {fmtPct(mdl.p_away)}</div>
            )}
          </div>
          {/* Center */}
          <div className="flex flex-col items-center">
            {isLive && <div className="px-4 py-1.5 mb-4 rounded-full border border-accent-green/40 text-accent-green text-[10px] tracking-[0.24em] uppercase font-black flex items-center gap-1.5 bg-accent-green/10"><span className="live-dot"/> En vivo</div>}

            <div className="mt-5 px-5 py-3 rounded-2xl border border-white/[0.07] bg-ink-0/55 text-center">
              <div className="text-[11px] tracking-[0.2em] uppercase text-white/45">{d.date}</div>

            </div>
            <LiveDiamond liveScore={d.live_score} isLive={isLive}/>

function MetricCard({ icon, label, value, sub, accent }) {
  const accentColor = accent === 'green' ? 'text-accent-green' : accent === 'red' ? 'text-accent-red' : 'text-white';
  return (
    <div className="glass border border-white/[0.06] rounded-2xl px-5 py-4">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-accent-blue text-lg">{icon}</span>
        <span className="text-[10px] tracking-[0.22em] uppercase text-white/45 font-bold">{label}</span>
      </div>
      <div className={`mega text-2xl tracking-tight ${accentColor} tabular-nums`}>{value}</div>
      <div className="text-[10px] text-white/40 mt-1">{sub}</div>
    </div>
  );
}

function buildGameAnalysis({ d, a, h, ap, hp, v, mdl, recommendation, confidence, confLevel, valueGood }) {
  const cleanNum = (n) => n == null || Number.isNaN(Number(n)) ? null : Number(n);
  const ctx = d.context || {};

  // ── Pitcher narrative — name, handedness, recent form ───────────────────────
  const pitcherStory = (team, pitcher) => {
    if (!pitcher?.name) return `Abridor de ${team.abbrev} por confirmar.`;
    const s = pitcher.season || {};
    const hand = pitcher.throws ? `${pitcher.throws === 'L' ? 'zurdo' : 'derecho'}` : '';
    const era = cleanNum(s.era);
    const k = cleanNum(s.k_pct);
    const bb = cleanNum(s.bb9);
    const xwoba = cleanNum(pitcher.starter_xwoba_l15);
    const bits = [];
    if (era != null)   bits.push(`${era.toFixed(2)} ERA`);
    if (k != null)     bits.push(`${(k*100).toFixed(0)}% K`);
    if (bb != null)    bits.push(`${bb.toFixed(2)} BB/9`);
    if (xwoba != null) bits.push(`${xwoba.toFixed(3)} xwOBA L15`);
    return `${team.abbrev}: ${pitcher.name}${hand ? ` (${hand})` : ''}${bits.length ? ` — ${bits.join(', ')}` : ''}.`;
  };

  // ── Team form narrative — last 10 runs scored/allowed, win% L30 ─────────────
  const teamForm = (team) => {
    const rs = cleanNum(team.runs_scored_l10);
    const ra = cleanNum(team.runs_allowed_l10);
    const wp = cleanNum(team.win_pct_l30);
    const parts = [];
    if (wp != null) parts.push(`${pct(wp)} en L30`);
    if (rs != null) parts.push(`${rs.toFixed(1)} carreras anotadas`);
    if (ra != null) parts.push(`${ra.toFixed(1)} permitidas en L10`);
    return `${team.abbrev}: ${parts.length ? parts.join(', ') : 'forma reciente sin datos suficientes'}.`;
  };

  // ── Pick lead — short, game-focused ──────────────────────────────────────────
  const pick = recommendation?.team || (mdl.p_home >= 0.5 ? h.abbrev : a.abbrev);
  const pickName = pick === h.abbrev ? (h.name || h.abbrev) : (a.name || a.abbrev);
  const dog     = pick === h.abbrev ? a.abbrev : h.abbrev;
  const pickProb = pick === h.abbrev ? mdl.p_home : (1 - (mdl.p_home ?? 0.5));

  // Why each side leads — derive from concrete factors
  const reasons = [];
  // Pitcher matchup factor
  if (ap?.season?.era != null && hp?.season?.era != null) {
    const pickPitcher  = pick === h.abbrev ? hp : ap;
    const oppPitcher   = pick === h.abbrev ? ap : hp;
    const pickEra = Number(pickPitcher.season.era);
    const oppEra  = Number(oppPitcher.season.era);
    if (oppEra - pickEra >= 0.5) {
      reasons.push(`tiene a ${pickPitcher.name} (${pickEra.toFixed(2)} ERA) contra ${oppPitcher.name} (${oppEra.toFixed(2)} ERA)`);
    } else if (Math.abs(oppEra - pickEra) < 0.4) {
      reasons.push(`mide a un duelo parejo de abridores`);
    }
  }
  // Recent form factor
  const pickTeam = pick === h.abbrev ? h : a;
  const oppTeam  = pick === h.abbrev ? a : h;
  if (pickTeam.win_pct_l30 != null && oppTeam.win_pct_l30 != null) {
    const dw = pickTeam.win_pct_l30 - oppTeam.win_pct_l30;
    if (dw >= 0.1) reasons.push(`viene mejor (${pct(pickTeam.win_pct_l30)} vs ${pct(oppTeam.win_pct_l30)} en L30)`);
    else if (dw <= -0.1) reasons.push(`llega más frío en forma reciente`);
  }
  // Burn factor — note it's actually a tailwind, not a hangover
  const pickBurn = pick === h.abbrev ? ctx.ctx_burn_home : ctx.ctx_burn_away;
  const oppBurn  = pick === h.abbrev ? ctx.ctx_burn_away : ctx.ctx_burn_home;
  if (oppBurn >= 65) {
    reasons.push(`enfrenta a un ${dog} que ayer quemó fuerte el bullpen (burn ${oppBurn})`);
  } else if (pickBurn >= 65) {
    reasons.push(`viene de un partido intenso ayer (burn ${pickBurn} — históricamente neutral o leve tailwind)`);
  }

  const title = valueGood
    ? `Valor en ${pickName}`
    : v.ev_grade === 'overconfident'
      ? `${pickName}, con cautela`
      : `Lean hacia ${pickName}`;

  // ── Lead paragraph — story first ────────────────────────────────────────────
  const lead = reasons.length > 0
    ? `${pickName} es el lado con valor porque ${reasons.join(', y ')}.`
    : `${pickName} es el lado preferido con probabilidad implícita ${pct(pickProb)}.`;

  // ── Weather paragraph ──────────────────────────────────────────────────────
  const w = d.weather || {};
  const indoor = ctx.ctx_roof_type && /closed|dome/i.test(ctx.ctx_roof_type);
  let weatherText = null;
  if (indoor) {
    weatherText = `Se juega en estadio techado, así que el clima no influye.`;
  } else if (w.temp_f != null || w.condition) {
    const bits = [];
    if (w.temp_f != null) bits.push(`${Math.round(Number(w.temp_f))}°F`);
    if (w.condition)      bits.push(w.condition);
    if (w.wind)           bits.push(`viento ${w.wind}`);
    weatherText = `Condiciones: ${bits.join(', ')}.`;
  }

  // ── Burn aftermath paragraph (if either team burned hard yesterday) ─────────
  let burnPara = null;
  const burnA = ctx.ctx_burn_away ?? 0;
  const burnH = ctx.ctx_burn_home ?? 0;
  const burnedTeams = [];
  if (burnA >= 50) burnedTeams.push({ abbrev: a.abbrev, score: burnA, tags: ctx.ctx_burn_away_tags || [] });
  if (burnH >= 50) burnedTeams.push({ abbrev: h.abbrev, score: burnH, tags: ctx.ctx_burn_home_tags || [] });
  if (burnedTeams.length > 0) {
    burnPara = burnedTeams.map(t =>
      `${t.abbrev} venía ayer con la "carne al asador" (burn ${t.score}${t.tags.length ? `: ${t.tags.join(', ')}` : ''}).`
    ).join(' ') + ' En promedio histórico esto no afecta el día siguiente — los datos dicen +3pp WR, no menos.';
  }

  return {
    title,
    paragraphs: [
      lead,
      weatherText,
      burnPara,
    ].filter(Boolean),
    sections: [
      {
        title: 'El duelo en la loma',
        items: [pitcherStory(a, ap), pitcherStory(h, hp)],
      },
      {
        title: 'Cómo llegan',
        items: [teamForm(a), teamForm(h)],
      },
    ],
    bullets: [
      { label: 'Pick', value: recommendation?.dec != null ? `${pick} @ ${recommendation.dec.toFixed(2)}` : pick },
      { label: 'Probabilidad', value: pickProb != null ? pct(pickProb) : '–' },
      { label: 'Total est.', value: mdl.pred_total_runs != null ? `${Number(mdl.pred_total_runs).toFixed(1)} carreras` : '–' },
      { label: 'Park factor', value: d.park_runs_factor != null ? d.park_runs_factor.toFixed(2) : '–' },
    ],
  };
}

function AnalysisSummary({ analysis, recommendation }) {
  return (
    <div className="relative overflow-hidden rounded-[26px] border border-white/[0.08] mb-5 p-6
      bg-[radial-gradient(circle_at_12%_0%,rgba(230,57,70,0.12),transparent_34%),radial-gradient(circle_at_88%_10%,rgba(77,171,247,0.13),transparent_36%),linear-gradient(145deg,rgba(13,20,36,0.88),rgba(3,6,12,0.96))]
      shadow-[0_20px_70px_rgba(0,0,0,0.28)]">
      <div className="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-accent-gold to-transparent opacity-70"/>
      <div className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-6 items-start relative">
        <div>
          <div className="text-[10px] tracking-[0.32em] uppercase font-black text-accent-gold/85 mb-3">Resumen del análisis</div>
          <h3 className="mega text-4xl tracking-tight mb-4">{analysis.title}</h3>
          <div className="space-y-3 text-sm leading-relaxed text-white/68">
            {analysis.paragraphs.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {analysis.sections?.length > 0 && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-5">
              {analysis.sections.map((section) => (
                <div key={section.title} className="rounded-2xl border border-white/[0.06] bg-white/[0.025] p-4">
                  <div className="text-[10px] tracking-[0.24em] uppercase font-black text-accent-blue/85 mb-3">{section.title}</div>
                  <div className="space-y-2 text-[12px] leading-relaxed text-white/58">
                    {section.items.map((item, idx) => <p key={idx}>{item}</p>)}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="rounded-2xl border border-white/[0.07] bg-ink-0/55 p-4">
          <div className="text-[10px] tracking-[0.24em] uppercase text-white/45 font-black mb-3">Lectura rápida</div>
          <div className="space-y-2">
            {analysis.bullets.map((b) => (
              <div key={b.label} className="flex items-center justify-between gap-4 rounded-xl bg-white/[0.025] border border-white/[0.04] px-3 py-2.5">
                <span className="text-[10px] tracking-[0.16em] uppercase text-white/42 font-black">{b.label}</span>
                <span className={`text-sm font-black tabular-nums ${b.label === 'Pick sugerido' && recommendation?.kind === 'valor' ? 'text-accent-green' : 'text-white/82'}`}>{b.value}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

      <div className="text-right text-accent-red px-4">{away}</div>
      <div className="text-center min-w-[180px]">Métrica</div>
      <div className="text-left text-accent-blue px-4">{home}</div>
    </div>
  );
}

      <div>
        <div className="text-[12px] font-bold text-white leading-tight">{title}</div>
        <div className="text-[10px] text-white/50 mt-0.5 leading-snug">{text}</div>
      </div>
    </div>
  );
}

function PickRow({ star, title, line, conf, active, edge }) {
  return (

      <span className={active ? 'text-accent-green' : 'text-white/40'}>{star ? '★' : '•'}</span>
      <div>
        <div className="text-[12px] font-bold text-white">{title}</div>
        {edge != null && <div className="text-[10px] text-white/50">Edge {edge >= 0 ? '+' : ''}{edge.toFixed(1)}pp</div>}
      </div>
      <div className="text-[11px] text-white/65 font-bold tabular-nums">{line}</div>
      <div className={`text-[10px] font-bold uppercase tracking-wider
        ${conf === 'Alta' ? 'text-accent-green' : conf === 'Media' ? 'text-accent-gold' : 'text-white/50'}`}>{conf}</div>

}

function SectionTitle({ children }) {
  return <div className="text-[10px] tracking-[0.32em] uppercase font-bold text-accent-gold/85 mt-12 mb-5 text-center">{children}</div>;
}
function CompareRow({ label, away, home }) {

    <div className="grid grid-cols-[1fr_auto_1fr] items-center text-sm border-b border-white/[0.04] last:border-0">

function BoxScoreTable({ d, a, h }) {
  const innings = d.live_score?.innings || [];
  const awayTotals = d.live_score?.away || {};
  const homeTotals = d.live_score?.home || {};
  const cols = innings.length ? innings : Array.from({ length: 9 }, (_, i) => ({ num: i + 1, away:{}, home:{} }));
  const cell = (v) => v == null ? '–' : v;
  const total = (side, key) => cell((side === 'away' ? awayTotals : homeTotals)?.[key]);
  const row = (side, team, colorCls) => (
    <tr className="border-t border-white/[0.06]">
      <th className={`sticky left-0 bg-ink-1 py-2 pr-4 text-left text-[12px] font-black ${colorCls}`}>{team.abbrev}</th>
      {cols.map((inn, i) => (
        <td key={`${side}-${i}`} className="px-2 py-2 text-center text-[12px] font-bold tabular-nums text-white/80">{cell(inn[side]?.runs)}</td>
      ))}
      <td className="px-3 py-2 text-center text-[12px] font-black tabular-nums text-white">{total(side, 'runs')}</td>
      <td className="px-3 py-2 text-center text-[12px] font-bold tabular-nums text-white/75">{total(side, 'hits')}</td>
      <td className="px-3 py-2 text-center text-[12px] font-bold tabular-nums text-white/75">{total(side, 'errors')}</td>
    </tr>
  );
  return (
    <div className="glass border border-white/[0.06] rounded-2xl p-5 overflow-hidden">
      <SectionTitle>Box score por entradas</SectionTitle>
      <div className="overflow-x-auto">
        <table className="w-full min-w-[720px] border-collapse">
          <thead>
            <tr className="text-[10px] tracking-[0.16em] uppercase text-white/45">
              <th className="sticky left-0 bg-ink-1 py-2 pr-4 text-left">Equipo</th>
              {cols.map((inn, i) => <th key={i} className="px-2 py-2 text-center">{inn.num || i + 1}</th>)}
              <th className="px-3 py-2 text-center text-accent-gold">R</th>
              <th className="px-3 py-2 text-center">H</th>
              <th className="px-3 py-2 text-center">E</th>
            </tr>
          </thead>
          <tbody>
            {row('away', a, 'text-accent-red')}
            {row('home', h, 'text-accent-blue')}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function F5Block({ f5, a, h }) {
  // F5 = first 5 innings market. Lower variance, more starter-driven.
  const pickHome = f5.f5_p_home >= 0.5;
  const pickAbbr = pickHome ? h.abbrev : a.abbrev;
  const pickProb = pickHome ? f5.f5_p_home : f5.f5_p_away;
  const fairML = pickHome ? f5.f5_fair_home_ml : f5.f5_fair_away_ml;
  const played = f5.f5_played;
  // F5 verdict: home won, away won, or tied at 5
  let verdict = 'pending';
  if (played) {
    if (f5.f5_actual_tied) verdict = 'push';
    else if (pickHome === f5.f5_actual_home_won) verdict = 'win';
    else verdict = 'loss';
  }
  const verdictColor =
    verdict === 'win' ? 'border-accent-green/40 bg-accent-green/[0.06]' :
    verdict === 'loss' ? 'border-accent-red/40 bg-accent-red/[0.06]' :
    verdict === 'push' ? 'border-accent-gold/40 bg-accent-gold/[0.06]' :
    'border-white/[0.06]';
  return (
    <div className={`mb-5 rounded-2xl border ${verdictColor} px-6 py-4`}>
      <div className="flex items-center justify-between mb-3">
        <div className="text-[11px] tracking-[0.28em] uppercase font-bold text-accent-blue">
          ◐ F5 · primeras 5 entradas
        </div>
        <div className="text-[10px] tracking-[0.18em] uppercase text-white/40">
          Depende solo de starters · menos variance
        </div>
      </div>
      <div className="grid grid-cols-4 gap-3">
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">P({a.abbrev})</div>
          <div className={`mega text-2xl tabular-nums ${!pickHome ? 'text-accent-red' : 'text-white/45'}`}>{(f5.f5_p_away*100).toFixed(1)}%</div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">P({h.abbrev})</div>
          <div className={`mega text-2xl tabular-nums ${pickHome ? 'text-accent-blue' : 'text-white/45'}`}>{(f5.f5_p_home*100).toFixed(1)}%</div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">Pick F5</div>
          <div className="mega text-2xl">
            <span className={pickHome ? 'text-accent-blue' : 'text-accent-red'}>{pickAbbr}</span>
            <span className="text-white/50 text-sm ml-2">{fairML > 0 ? '+' : ''}{fairML}</span>
          </div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">Total F5 pred.</div>
          <div className="mega text-2xl text-accent-gold tabular-nums">{f5.f5_pred_total?.toFixed(1)}</div>
        </div>
      </div>
      {played && (
        <div className="mt-4 pt-3 border-t border-white/[0.06] flex items-center justify-between text-sm">
          <div className="text-white/65">
            Resultado F5: <strong className="text-white">{a.abbrev} {f5.f5_away_score} · {f5.f5_home_score} {h.abbrev}</strong>
            <span className="text-white/40 ml-2">(total {f5.f5_actual_total})</span>
          </div>
          <span className={`px-3 py-1 rounded text-[10px] font-bold tracking-[0.2em] uppercase
            ${verdict === 'win' ? 'bg-accent-green text-ink-0' :
              verdict === 'loss' ? 'bg-accent-red text-white' :
              verdict === 'push' ? 'bg-accent-gold text-ink-0' :
              'bg-white/[0.08] text-white/60'}`}>
            {verdict === 'win' ? '✓ F5 ganado' : verdict === 'loss' ? '✗ F5 fallado' : verdict === 'push' ? '= F5 push (empate)' : 'F5 pendiente'}
          </span>
        </div>
      )}
    </div>
  );
}
