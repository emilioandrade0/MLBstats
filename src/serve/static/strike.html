<style>
  html {
    margin: 0;
    background: #061019;
  }
  body {
    margin: 0;
    color: #fff;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    background:
      radial-gradient(circle at 12% 8%, rgba(230,57,70,0.14), transparent 32%),
      radial-gradient(circle at 84% 10%, rgba(77,171,247,0.17), transparent 34%),
      radial-gradient(circle at 50% 100%, rgba(81,207,102,0.07), transparent 34%),
      linear-gradient(180deg, #091827 0%, #061019 46%, #050c14 100%);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at 50% 25%, black, transparent 72%);
    opacity: 0.34;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse at center, transparent 0%, transparent 52%, rgba(0,0,0,0.34) 100%),
      linear-gradient(180deg, rgba(255,255,255,0.035), transparent 18%, rgba(0,0,0,0.18));
  }
  *::-webkit-scrollbar { width: 0; height: 0; }
  .mega { font-family: 'Anton', Impact, sans-serif; letter-spacing: -0.035em; line-height: 0.88; }
  .glass {
    background: linear-gradient(145deg, rgba(13,30,46,0.62), rgba(6,16,25,0.44));
    backdrop-filter: blur(24px) saturate(155%);
    -webkit-backdrop-filter: blur(24px) saturate(155%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
  }
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.56; mix-blend-mode: screen; }
  #root { position: relative; z-index: 1; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #51CF66; box-shadow: 0 0 0 0 rgba(81,207,102,0.6); animation: ring 1.6s infinite; }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 rgba(81,207,102,0.55); }
    70%  { box-shadow: 0 0 0 12px rgba(81,207,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(81,207,102,0); }
  }
  /* Insight panel slide-in animation for the Hoy expandable row */
  @keyframes panelIn {
    0%   { opacity: 0; transform: translateX(-12px) scaleX(0.92); transform-origin: left center; max-width: 0; }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translateX(0) scaleX(1); max-width: 420px; }
  }
  /* Hoy expandable row — invisible scrollbar, mouse wheel → horizontal scroll */
  .hoy-row { scrollbar-width: none; -ms-overflow-style: none; }
  .hoy-row::-webkit-scrollbar { display: none; width: 0; height: 0; }
  /* Sharp-value badge subtle glow pulse */
  @keyframes sharpPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(255,212,59,0.20); }
    50%      { box-shadow: 0 0 26px rgba(255,212,59,0.42); }
  }
  /* ═══ Run-scored celebration overlay v2 (cinematic) ═════════════════════ */
  /* Total duration: 3800ms — climax on team logo between 1400-3200ms */
  @keyframes rbStageIn {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes rbVignetteIn {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes rbScanLine {
    0%   { transform: translateY(-100%); opacity: 0; }
    16%  { opacity: 0.5; }
    100% { transform: translateY(100vh); opacity: 0; }
  }
  @keyframes rbBatterLoad {
    0%   { opacity: 0; transform: translate3d(-6vw, 4vh, 0) scale(0.86); }
    10%  { opacity: 1; }
    24%  { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    72%  { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    100% { opacity: 0; transform: translate3d(0, 2vh, 0) scale(0.94); }
  }
  @keyframes rbBatterSwing {
    /* windup 0-14%, load 14-22%, contact 22-28%, follow-through 28-48% */
    0%   { transform: rotate(0deg); }
    14%  { transform: rotate(30deg); }
    22%  { transform: rotate(32deg); }
    28%  { transform: rotate(-24deg); }
    48%  { transform: rotate(-42deg); }
    100% { transform: rotate(-42deg); }
  }
  @keyframes rbHipRotate {
    0%   { transform: rotate(0deg); }
    16%  { transform: rotate(-8deg); }
    28%  { transform: rotate(12deg); }
    100% { transform: rotate(12deg); }
  }
  @keyframes rbContactFlash {
    0%, 22%  { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    26%      { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
    34%      { opacity: 0.6; transform: translate(-50%, -50%) scale(2.4); }
    46%      { opacity: 0; transform: translate(-50%, -50%) scale(3.4); }
    100%     { opacity: 0; }
  }
  @keyframes rbBallFly {
    /* Parabolic arc: from batter's contact zone up-right-across, then off screen */
    0%   { offset-distance: 0%; opacity: 0; transform: scale(0.9) rotate(0deg); }
    22%  { opacity: 0; }
    28%  { opacity: 1; offset-distance: 8%; transform: scale(1) rotate(60deg); }
    56%  { opacity: 1; offset-distance: 60%; transform: scale(1.05) rotate(300deg); }
    82%  { opacity: 0.85; offset-distance: 90%; transform: scale(1.15) rotate(560deg); }
    100% { opacity: 0; offset-distance: 100%; transform: scale(1.25) rotate(720deg); }
  }
  @keyframes rbBallTrail {
    0%, 22% { opacity: 0; offset-distance: 0%; }
    28%     { opacity: 0.7; offset-distance: 8%; }
    82%     { opacity: 0.55; offset-distance: 90%; }
    100%    { opacity: 0; offset-distance: 100%; }
  }
  @keyframes rbLogoIn {
    0%, 34%  { opacity: 0; transform: translate(-50%, -50%) scale(0.4); filter: blur(14px); }
    44%      { opacity: 1; transform: translate(-50%, -50%) scale(1.15); filter: blur(0px); }
    52%      { transform: translate(-50%, -50%) scale(1); }
    78%      { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
    92%      { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    100%     { opacity: 0; transform: translate(-50%, -50%) scale(1.3); filter: blur(6px); }
  }
  @keyframes rbLogoRipple {
    0%, 40%  { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    50%      { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
    80%      { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    100%     { opacity: 0; }
  }
  @keyframes rbNameIn {
    0%, 44%  { opacity: 0; transform: translateX(-50%) translateY(20px); letter-spacing: 0.02em; }
    56%      { opacity: 1; transform: translateX(-50%) translateY(0px); letter-spacing: 0.18em; }
    84%      { opacity: 1; transform: translateX(-50%) translateY(0px); letter-spacing: 0.18em; }
    100%     { opacity: 0; transform: translateX(-50%) translateY(-10px); letter-spacing: 0.22em; }
  }
  @keyframes rbBadgeIn {
    0%, 46%  { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.9); }
    58%      { opacity: 1; transform: translateX(-50%) translateY(0px) scale(1); }
    84%      { opacity: 1; }
    100%     { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(1.04); }
  }
  @keyframes rbEyebrowIn {
    0%, 40%  { opacity: 0; letter-spacing: 0.20em; }
    54%      { opacity: 1; letter-spacing: 0.42em; }
    84%      { opacity: 1; }
    100%     { opacity: 0; letter-spacing: 0.50em; }
  }
  @keyframes rbShake {
    0%, 20%   { transform: translate3d(0, 0, 0); }
    24%       { transform: translate3d(-2px, 1px, 0); }
    26%       { transform: translate3d(2px, -1px, 0); }
    28%       { transform: translate3d(-1px, 2px, 0); }
    30%       { transform: translate3d(1px, -2px, 0); }
    32%       { transform: translate3d(0, 0, 0); }
    100%      { transform: translate3d(0, 0, 0); }
  }
  .run-burst-layer {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 120;
    animation: rbShake 3800ms ease-out forwards;
  }
  .run-burst {
    position: absolute; inset: 0;
  }
  .run-burst-stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(81,207,102,0.10), transparent 55%),
      radial-gradient(circle at 50% 40%, rgba(255,214,59,0.04), transparent 22%),
      linear-gradient(180deg, rgba(4,10,18,0.32), rgba(4,10,18,0.55) 60%, rgba(4,10,18,0.72));
    animation: rbStageIn 3800ms ease-out forwards;
  }
  .run-burst-vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 44%, rgba(0,0,0,0.55) 100%);
    animation: rbVignetteIn 3800ms ease-out forwards;
  }
  .run-burst-scanline {
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(77,171,247,0.15) 60%, transparent);
    mix-blend-mode: screen;
    opacity: 0;
    animation: rbScanLine 2400ms ease-out forwards;
  }
  /* Batter — SVG silhouette in swing pose */
  .run-burst-batter {
    position: absolute; left: 14%; bottom: 14%;
    width: 180px; height: 220px;
    opacity: 0;
    animation: rbBatterLoad 3800ms cubic-bezier(0.2,0.7,0.1,1) forwards;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.55));
  }
  .run-burst-batter svg {
    width: 100%; height: 100%; display: block;
    transform-origin: 50% 78%;
    animation: rbHipRotate 3800ms cubic-bezier(0.4,0.1,0.2,1) forwards;
  }
  .run-burst-batter .rb-bat-group {
    transform-origin: 62% 46%;
    animation: rbBatterSwing 3800ms cubic-bezier(0.4,0.1,0.2,1) forwards;
  }
  /* Contact flash */
  .run-burst-contact {
    position: absolute; left: calc(14% + 108px); bottom: calc(14% + 130px);
    width: 100px; height: 100px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,220,120,0.9) 30%, rgba(255,180,90,0.55) 55%, transparent 72%);
    filter: blur(1px);
    animation: rbContactFlash 3800ms ease-out forwards;
    mix-blend-mode: screen;
  }
  /* Ball flying along a parabolic path */
  .run-burst-ball {
    position: absolute; top: 0; left: 0;
    width: 42px; height: 42px;
    offset-path: path("M 18 68 Q 42 8, 68 22 T 96 44");
    offset-rotate: 0deg;
    animation: rbBallFly 3800ms cubic-bezier(0.25,0.4,0.3,1) forwards;
    z-index: 3;
  }
  /* Actual pixel coordinates via a wrapper that scales the offset-path viewport */
  .run-burst-ball-wrap {
    position: absolute; inset: 0;
    /* Path is defined in a 100x100 conceptual box, scaled to viewport */
    /* Uses a CSS custom offset-path on wrapper's inner element */
  }
  .run-burst-ball::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 999px;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,1), rgba(248,240,232,1) 45%, rgba(210,200,190,1) 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.5) inset, 0 8px 20px rgba(0,0,0,0.4), 0 0 30px rgba(255,214,59,0.35);
  }
  .run-burst-ball::after {
    content: "";
    position: absolute; left: 10%; top: 22%; width: 80%; height: 56%;
    border: 2px solid transparent; border-top-color: #c23; border-left-color: #c23;
    border-radius: 50%;
    transform: rotate(-18deg);
  }
  /* Long fading trail behind the ball */
  .run-burst-ball-trail {
    position: absolute; top: 0; left: 0;
    width: 6px; height: 6px;
    border-radius: 999px;
    box-shadow:
      0 0 0 3px rgba(255,214,59,0.10),
      0 0 20px 6px rgba(255,214,59,0.35),
      0 0 42px 12px rgba(255,180,80,0.20);
    animation: rbBallTrail 3800ms cubic-bezier(0.25,0.4,0.3,1) forwards;
  }
  /* Team logo — HERO of the animation */
  .run-burst-logo {
    position: absolute; left: 50%; top: 44%;
    width: 180px; height: 180px;
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    animation: rbLogoIn 3800ms cubic-bezier(0.2,0.9,0.15,1) forwards;
    z-index: 5;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.55)) drop-shadow(0 0 40px rgba(255,214,59,0.28));
  }
  .run-burst-logo img {
    width: 100%; height: 100%; object-fit: contain;
  }
  .run-burst-logo-ripple {
    position: absolute; left: 50%; top: 44%;
    width: 260px; height: 260px;
    border-radius: 999px;
    border: 2px solid rgba(255,214,59,0.6);
    box-shadow: 0 0 60px rgba(255,214,59,0.3) inset;
    transform: translate(-50%, -50%) scale(0.6);
    opacity: 0;
    animation: rbLogoRipple 3800ms ease-out forwards;
    z-index: 4;
  }
  .run-burst-logo-ripple.delay1 { animation-delay: 200ms; }
  .run-burst-logo-ripple.delay2 { animation-delay: 420ms; }
  /* Eyebrow "ANOTA" tiny header */
  .run-burst-eyebrow {
    position: absolute; left: 50%; top: calc(44% - 128px);
    transform: translateX(-50%);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px; font-weight: 900; letter-spacing: 0.42em; text-transform: uppercase;
    color: rgba(255,214,59,0.95);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    opacity: 0;
    animation: rbEyebrowIn 3800ms ease-out forwards;
    z-index: 5;
    white-space: nowrap;
  }
  /* Team name in Anton mega typography */
  .run-burst-name {
    position: absolute; left: 50%; top: calc(44% + 110px);
    transform: translateX(-50%);
    font-family: 'Anton', 'Impact', sans-serif;
    font-size: 56px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    color: #fff;
    text-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 40px rgba(77,171,247,0.35);
    opacity: 0;
    animation: rbNameIn 3800ms cubic-bezier(0.2,0.9,0.15,1) forwards;
    z-index: 5;
    white-space: nowrap;
  }
  /* Rally badge below name */
  .run-burst-badge {
    position: absolute; left: 50%; top: calc(44% + 176px);
    transform: translateX(-50%);
    padding: 8px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(5,11,22,0.72);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,0.9);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10px; font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase;
    opacity: 0;
    animation: rbBadgeIn 3800ms cubic-bezier(0.2,0.9,0.15,1) forwards;
    z-index: 5;
    white-space: nowrap;
    box-shadow: 0 14px 32px rgba(0,0,0,0.4);
  }
  @media (max-width: 767px) {
    .run-burst-batter { width: 130px; height: 160px; left: 8%; bottom: 18%; }
    .run-burst-contact { width: 70px; height: 70px; left: calc(8% + 78px); bottom: calc(18% + 90px); }
    .run-burst-logo { width: 130px; height: 130px; }
    .run-burst-logo-ripple { width: 200px; height: 200px; }
    .run-burst-eyebrow { top: calc(44% - 100px); font-size: 10px; letter-spacing: 0.36em; }
    .run-burst-name { top: calc(44% + 82px); font-size: 34px; letter-spacing: 0.14em; }
    .run-burst-badge { top: calc(44% + 138px); font-size: 9px; padding: 6px 14px; }
  }
  /* Scroll snap container */
  .snap-container { scroll-snap-type: y mandatory; overflow-y: auto; height: 100vh; }
  .snap-section { scroll-snap-align: start; min-height: 100vh; }
  /* Page swap container — flex of two side-by-side viewports */
  .swap-container { display: flex; width: 200vw; height: 100vh; will-change: transform; }
  .swap-pane { width: 100vw; height: 100vh; flex-shrink: 0; }
  @media (max-width: 767px) {
    html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; }
    .swap-container { max-width: 200vw; overflow-x: hidden; }
    .swap-pane { max-width: 100vw; overflow-x: hidden; }
    .mobile-tab-select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,.7) 50%), linear-gradient(135deg, rgba(255,255,255,.7) 50%, transparent 50%);
      background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }
  }
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useLayoutEffect, useCallback } = React;

// ─── Helpers ──────────────────────────────────────────────────────────────────
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const shiftDate = (iso, n) => { const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDateLong = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return `${d} de ${MES[m-1]}, ${y}`; };
const fmtPct = (p) => p == null ? '–' : (p*100).toFixed(1) + '%';
const fmt3 = (n) => n == null ? '–' : (+n).toFixed(3).replace(/^0/, '');
const pct  = (n) => n == null ? '–' : ((+n)*100).toFixed(1) + '%';
const perfPct = (n) => n == null ? '–' : `${Number(n).toFixed(1)}%`;
const perfUnits = (n) => n == null ? '–' : `${Number(n) >= 0 ? '+' : ''}${Number(n).toFixed(2)}u`;
// Formato compacto del inning en vivo: "5A" (5ta alta), "7B" (7ma baja),
// "CAMBIO" (entre mitades). Devuelve null si no hay data.
const fmtInning = (ls) => {
  if (!ls) return null;
  const n = ls.inning;
  if (n == null) return null;
  const st = String(ls.inning_state || ls.inning_half || '').toLowerCase();
  if (st.startsWith('mid') || st.startsWith('end')) return 'CAMBIO';
  const half = st.startsWith('top') ? 'A' : st.startsWith('bot') ? 'B' : '';
  return `${n}${half}`;
};
// Version larga para tooltip/detalle: "5ta ALTA", "7ma BAJA"
const fmtInningLong = (ls) => {
  if (!ls) return null;
  const n = ls.inning;
  if (n == null) return null;
  const ORD = ['', '1ra', '2da', '3ra', '4ta', '5ta', '6ta', '7ma', '8va', '9na'];
  const ord = ORD[n] || `${n}ma`;
  const st = String(ls.inning_state || ls.inning_half || '').toLowerCase();
  if (st.startsWith('mid')) return `Cambio · ${ord}`;
  if (st.startsWith('end')) return `Fin ${ord}`;
  const half = st.startsWith('top') ? 'Alta' : st.startsWith('bot') ? 'Baja' : '';
  return `${ord} ${half}`.trim();
};
const TEAM_ID = {ARI:109,ATL:144,BAL:110,BOS:111,CHC:112,CHW:145,CWS:145,CIN:113,CLE:114,COL:115,DET:116,HOU:117,KC:118,LAA:108,LAD:119,MIA:146,MIL:158,MIN:142,NYM:121,NYY:147,OAK:133,ATH:133,PHI:143,PIT:134,SD:135,SF:137,SEA:136,STL:138,TB:139,TEX:140,TOR:141,WSH:120};
const teamLogo = (a) => `https://www.mlbstatic.com/team-logos/${TEAM_ID[a]||0}.svg`;
const TEAM_NAMES = {
  ARI:'Arizona Diamondbacks', ATL:'Atlanta Braves', BAL:'Baltimore Orioles', BOS:'Boston Red Sox',

    return { abbr, name };
  });

function resolveTeamQuery(raw) {
  const q = (raw || '').trim().toLowerCase();
  if (!q) return null;
  const exactAbbr = TEAM_SEARCH_POOL.find((t) => t.abbr.toLowerCase() === q);
  if (exactAbbr) return exactAbbr.abbr;
  const exactName = TEAM_SEARCH_POOL.find((t) => t.name.toLowerCase() === q);
  if (exactName) return exactName.abbr;
  const hits = TEAM_SEARCH_POOL.filter((t) =>
    t.abbr.toLowerCase().includes(q) || t.name.toLowerCase().includes(q)
  );
  return hits.length === 1 ? hits[0].abbr : null;
}
function gameTotalRuns(g) {

// ─── THREE.JS PARTICLE SPHERE (cursor-reactive) ──────────────────────────────
function startParticles() {
  if (!window.THREE) return;
  const canvas = document.getElementById('bg-canvas');
  if (!canvas || canvas.__started) return;
  canvas.__started = true;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 6;

  // Sphere of points
  const N = 2400;
  const positions = new Float32Array(N * 3);
  const original  = new Float32Array(N * 3);
  const radius = 3.2;
  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.sin(phi) * Math.sin(theta);
    const z = radius * Math.cos(phi);
    positions[i*3]   = x; positions[i*3+1] = y; positions[i*3+2] = z;
    original[i*3]    = x; original[i*3+1]  = y; original[i*3+2]  = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  // colors: mix of red, blue, white
  const colors = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = Math.random();
    if (r < 0.4)      { colors[i*3]=0.90; colors[i*3+1]=0.22; colors[i*3+2]=0.27; } // red
    else if (r < 0.8) { colors[i*3]=0.30; colors[i*3+1]=0.67; colors[i*3+2]=0.97; } // blue
    else              { colors[i*3]=1.00; colors[i*3+1]=1.00; colors[i*3+2]=1.00; } // white
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.038, vertexColors: true, transparent: true, opacity: 0.86,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Mouse tracking (NDC + world)
  const mouseNDC = new THREE.Vector2(-10, -10);
  const mouseWorld = new THREE.Vector3();
  const raycaster = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
  window.addEventListener('pointermove', (e) => {
    mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.ray.intersectPlane(plane, mouseWorld);
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  let t = 0;
  const tmp = new THREE.Vector3();
  function tick() {
    t += 0.0035;
    points.rotation.y = t * 0.4;
    points.rotation.x = Math.sin(t * 0.35) * 0.18;

    // particle dispersion near cursor (world-space)
    const pos = geo.attributes.position.array;
    for (let i = 0; i < N; i++) {
      // restore towards original
      const ox = original[i*3], oy = original[i*3+1], oz = original[i*3+2];
      let px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
      // rotate original by current rotation to get current "ideal" position
      // For simplicity: lerp back towards original (rotation handles the spin visually since group rotates)
      px += (ox - px) * 0.06;
      py += (oy - py) * 0.06;
      pz += (oz - pz) * 0.06;
      // mouse repel — convert point to world using points.matrix
      tmp.set(px, py, pz).applyMatrix4(points.matrixWorld);
      const dx = tmp.x - mouseWorld.x;
      const dy = tmp.y - mouseWorld.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 1.2) {
        const inv = 1 / Math.sqrt(d2 + 0.001);
        const force = (1.2 - d2) * 0.28;
        // local-space displacement
        const localDx = dx * inv * force;
        const localDy = dy * inv * force;
        // apply inverse rotation roughly: just nudge in local x/y is close enough visually
        px += localDx;
        py += localDy;
      }
      pos[i*3] = px; pos[i*3+1] = py; pos[i*3+2] = pz;
    }
    geo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
}

// ─── COUNTER ─────────────────────────────────────────────────────────────────
function Counter({ value, decimals = 0, suffix = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || value == null) return;
    const obj = { v: 0 };
    gsap.to(obj, {
      v: value, duration: 1.4, ease: 'power3.out',
      onUpdate: () => {
        if (!ref.current) return;
        const n = decimals ? obj.v.toFixed(decimals) : Math.round(obj.v).toLocaleString('es-MX');
        ref.current.textContent = n + suffix;
      }
    });
  }, [value]);
  return <span ref={ref}>0{suffix}</span>;
}

function PublishButton() {
  const [state, setState] = useState('idle'); // idle | loading | ok | error
  const [result, setResult] = useState(null);
  const publish = async () => {
    setState('loading');
    try {
      const r = await fetch('/api/publish', { method: 'POST' });
      const d = await r.json();
      setResult(d);
      setState(d.ok ? 'ok' : 'error');
      setTimeout(() => setState('idle'), 5000);
    } catch(e) {
      setState('error');
      setTimeout(() => setState('idle'), 5000);
    }
  };
  const color = state === 'ok' ? 'text-accent-green border-accent-green/40'
              : state === 'error' ? 'text-accent-red border-accent-red/40'
              : 'text-accent-gold border-accent-gold/40 hover:bg-accent-gold/10';
  const label = state === 'loading' ? 'publicando…'
              : state === 'ok' ? `✓ publicado (${result?.games || 0} partidos)`
              : state === 'error' ? 'error al publicar'
              : '↑ publicar en web';
  return (
    <button onClick={publish} disabled={state === 'loading'}
      className={`ml-1 px-3 py-1.5 rounded-full text-[10px] tracking-[0.18em] uppercase font-bold glass border ${color} transition disabled:opacity-50`}>
      {label}
    </button>
  );
}

function RefreshIndicator() {
  const [st, setSt] = useState(null);
  useEffect(() => {

    fetchStatus();
    const t = setInterval(fetchStatus, 10000);
    return () => clearInterval(t);
  }, []);
  const ago = st?.seconds_since_last_ok;
  const label = st?.running_now ? 'refrescando…'
              : ago == null ? '— sin datos —'
              : ago < 60 ? 'recién actualizado'
              : `hace ${Math.round(ago/60)} min`;

      {staleLabel || label}

}

// ─── GAME CARD ───────────────────────────────────────────────────────────────
function displayMlPick(g) {
  const evGrade = g.ev_grade || 'no_data';
  const valueShown = (evGrade === 'sweet' || evGrade === 'marginal') && g.value_team_abbrev;
  const team = valueShown ? g.value_team_abbrev : g.pick_abbrev;
  const side = valueShown ? g.value_side
    : team === g.home_abbrev ? 'HOME'
    : team === g.away_abbrev ? 'AWAY'
    : null;
  // Line shopping: prefer the best available book price for value picks.
  const decimal = valueShown ? (g.value_best_decimal ?? g.value_decimal)
    : team === g.home_abbrev ? g.market_home_decimal
    : team === g.away_abbrev ? g.market_away_decimal
    : null;
  const bestBook = valueShown ? (g.value_best_book || null) : null;
  return { team, side, decimal, valueShown, bestBook };
}

function GameCard({ g, onOpen, index = 0 }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    if (!ref.current) return;
    gsap.fromTo(ref.current,
      { opacity: 0, y: 36, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'power3.out', delay: 0.06 + (index%6) * 0.05 });
  }, [g.game_pk]);

  const isLive = g.is_live, isFinal = g.is_played;
  // NEW EV grading from empirical walk-forward analysis:
  //   sweet (edge 1-2pp)  → +11% ROI band, BET
  //   marginal (0-1pp)    → +0.8% ROI, smaller bet
  //   overconfident (>2pp)→ model wrong → SKIP
  //   no_edge / no_data   → no bet
  const evGrade = g.ev_grade || 'no_data';
  const isSweet = evGrade === 'sweet';
  const isMarginal = evGrade === 'marginal';
  const isPlayable = isSweet || isMarginal;
  const shownPick = displayMlPick(g);
  const valueShown = shownPick.valueShown;
  const pickAbbr = shownPick.team;
  const pickDec  = shownPick.decimal;
  const homeWon = (g.home_score != null && g.away_score != null) ? g.home_score > g.away_score : null;
  const pickedHome = shownPick.side === 'HOME';
  const verdict = !isFinal || homeWon == null ? null
                  : ((pickedHome === homeWon) ? 'win' : 'loss');
  const accentBorder =
    verdict === 'win' ? 'border-accent-green/55' :
    verdict === 'loss' ? 'border-accent-red/55' :
    isLive ? 'border-accent-green/35' : 'border-white/[0.06]';

  // Slot profile (server-computed in api.py from walk-forward analysis):
  //   model_strong → slots {1, 9} — model genuinely beats market (+ROI)
  //   market_sharp → slot {5}     — market hits 62% acc, defer to it
  //   flip_zone    → slots {2,4,12,14} — flipping the pick was +ROI on dogs
  //   skip         → slots {3,6,7,8,10,11,13,15} — best action is no bet
  const slotProfile = g.slot_profile || 'neutral';
  const slotCls =
    slotProfile === 'model_strong' ? 'text-accent-green/85 border-accent-green/35' :
    slotProfile === 'market_sharp' ? 'text-accent-blue/80 border-accent-blue/30' :
    slotProfile === 'flip_zone'    ? 'text-accent-gold/85 border-accent-gold/35' :
    slotProfile === 'skip'         ? 'text-white/35 border-white/[0.06]' :
                                     'text-white/45 border-white/[0.08]';
  const slotLabel =
    slotProfile === 'model_strong' ? 'Bet' :
    slotProfile === 'market_sharp' ? 'Mkt' :
    slotProfile === 'flip_zone'    ? 'Flip' :
    slotProfile === 'skip'         ? 'Skip' : '';
  const fmtET = (iso) => {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleTimeString('en-US', {
        timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true

  const cardAccent =
    verdict === 'win' ? '#51CF66' :

    isSweet ? '#51CF66' :
    isMarginal ? '#4DABF7' :
    slotProfile === 'flip_zone' ? '#FFD43B' :
    slotProfile === 'market_sharp' ? '#4DABF7' :

    isMarginal ? 'from-accent-blue/20 to-accent-blue/[0.04] text-accent-blue border-accent-blue/45' :
    evGrade === 'overconfident' ? 'from-accent-red/18 to-accent-red/[0.04] text-accent-red border-accent-red/40' :
    'from-white/[0.08] to-white/[0.02] text-white/60 border-white/[0.10]';

  return (
    <div ref={ref} onClick={() => onOpen(g)}

                  bg-[radial-gradient(circle_at_50%_0%,rgba(77,171,247,0.10),transparent_42%),linear-gradient(145deg,rgba(13,20,36,0.92),rgba(3,6,12,0.96))]
                  shadow-[0_22px_70px_rgba(0,0,0,0.35)] transition-all duration-300

      style={{ '--card-accent': cardAccent }}>

                            text-[10px] tracking-[0.18em] uppercase font-black tabular-nums bg-ink-0/50`}>

          </div>
          <div className="mega text-[31px] leading-none tracking-tight">{g.home_abbrev}</div>
          <div className="text-[12px] mt-2 tabular-nums font-bold text-white/70">{g.p_home != null ? (g.p_home*100).toFixed(1)+'%' : '—'}</div>
          {cardLiveWP && <div className="text-[10px] tabular-nums text-accent-green/65 mt-0.5">{fmtPct(cardPHome)} vivo</div>}
        </div>
      </div>
      {(g.pitcher_away?.name || g.pitcher_home?.name) && (
        <div className="text-center text-[9px] text-white/32 tracking-wide -mt-2 mb-3">
          <span>{g.pitcher_away?.name ? g.pitcher_away.name.split(' ').pop() : '—'}{g.pitcher_away?.throws ? ` (${g.pitcher_away.throws})` : ''}</span>
          <span className="mx-2 text-white/18">vs</span>
          <span>{g.pitcher_home?.name ? g.pitcher_home.name.split(' ').pop() : '—'}{g.pitcher_home?.throws ? ` (${g.pitcher_home.throws})` : ''}</span>
        </div>
      )}

      <div className="relative mb-4">
        <div className="flex items-center justify-between text-[9px] tracking-[0.18em] uppercase text-white/32 font-black mb-2">
          <span>{g.away_abbrev}</span>
          <span>{cardLiveWP ? 'Win prob · vivo' : 'Modelo'}</span>
          <span>{g.home_abbrev}</span>
        </div>
        <div className="flex h-2 rounded-full overflow-hidden bg-white/[0.06] ring-1 ring-white/[0.04]">
          <div className="bg-gradient-to-r from-accent-red/80 to-accent-red" style={{ width: `${awayPct}%` }}/>
          <div className="bg-gradient-to-r from-accent-blue to-accent-blue/80" style={{ width: `${homePct}%` }}/>
        </div>
      </div>

      <div className="relative flex flex-wrap items-center gap-2 text-[11px] pt-4 border-t border-white/[0.07]">
        {pickAbbr && (
          <span className={`inline-flex items-center gap-2 px-3 py-2 rounded-xl font-black tracking-wider uppercase text-[10px] border bg-gradient-to-r ${pickTone}`}>
            <span className="text-[12px]">
              {isSweet ? '◆' : isMarginal ? '◇' : evGrade === 'overconfident' ? '⚠' : '•'}
            </span>
            <span>
              {isSweet    ? '+EV ' :
               isMarginal ? '+EV LIGHT ' :
               evGrade === 'overconfident' ? 'RIESGOSO ' :
               evGrade === 'no_edge' ? 'NO BET ' : 'ML '}
              {pickAbbr}{pickDec != null && ` @ ${pickDec.toFixed(2)}`}
              {g.value_edge_pp != null && evGrade !== 'no_edge' && ` · ${g.value_edge_pp >= 0 ? '+' : ''}${g.value_edge_pp.toFixed(1)}pp`}
            </span>
          </span>
        )}
        {verdict === 'win'  && <span className="px-2.5 py-1.5 rounded-lg bg-accent-green text-ink-0 font-black text-[10px] tracking-wider">✓ Ganó</span>}
        {verdict === 'loss' && <span className="px-2.5 py-1.5 rounded-lg bg-accent-red text-white font-black text-[10px] tracking-wider">✗ Falló</span>}
        {g.alt_pick && (
          <span className={`px-2.5 py-1.5 rounded-lg font-black tracking-wider uppercase text-[10px] border
            ${g.alt_pick.kind === 'flip_risky'
              ? 'bg-accent-gold/10 text-accent-gold/85 border-accent-gold/35'
              : 'bg-accent-blue/10 text-accent-blue/85 border-accent-blue/35'}`}>
            {g.alt_pick.kind === 'flip_risky' ? '↻ FLIP ' : '⇢ MKT '}
            {g.alt_pick.team} @ {g.alt_pick.decimal.toFixed(2)}
          </span>
        )}
        {g.ev_grade_reason === 'slot_skip' && (
          <span className="text-[10px] text-white/35 uppercase tracking-wider">(slot histórico = no bet)</span>
        )}
        {g.ev_grade_reason === 'slot_boost' && (
          <span className="text-[10px] text-accent-green/70 uppercase tracking-wider">(slot ganador histórico)</span>
        )}
        {g.ev_grade_reason === 'low_conf_market' && (
          <span className="text-[10px] text-accent-blue/75 uppercase tracking-wider">(modelo dudaba — sigue mercado)</span>
        )}
        {g.ev_grade_reason === 'fav_band_market' && (
          <span className="text-[10px] text-accent-blue/75 uppercase tracking-wider">(fav 1.50–1.80 — sigue mercado)</span>
        )}
        {g.ev_grade_reason?.startsWith('rule_lab_') && (
          <span className="text-[10px] text-accent-blue/75 uppercase tracking-wider">(rule lab — accuracy)</span>
        )}
        {g.ev_grade_reason === 'accuracy_holdout_skip' && (
          <span className="text-[10px] text-white/35 uppercase tracking-wider">(holdout skip)</span>
        )}
        {g.ev_grade_reason === 'slot_sharp' && (
          <span className="text-[10px] text-accent-blue/75 uppercase tracking-wider">(slot MKT — sigue mercado)</span>
        )}
        {g.ev_grade_reason === 'slot_flip' && (
          <span className="text-[10px] text-accent-gold/80 uppercase tracking-wider">(slot FLIP — pick invertido)</span>
        )}
        {g.ev_grade_reason === 'dog_46_48' && (
          <span className="text-[10px] text-accent-gold/80 uppercase tracking-wider">(dog 46-48% override)</span>
        )}
        {valueShown && g.value_side && g.p_home != null && g.market_home_implied != null && (
          <div className="w-full mt-2 text-[9px] tabular-nums text-white/30">
            {(() => {
              // Use the model-only value probability to justify the edge
              const pv = g.p_home_value != null ? g.p_home_value : g.p_home;
              const pm = g.value_side === 'HOME' ? pv : 1 - pv;
              const pk = g.value_side === 'HOME' ? g.market_home_implied : g.market_away_implied;
              if (pm == null || pk == null) return null;
              return `Modelo ${(pm*100).toFixed(1)}% · Mercado ${(pk*100).toFixed(1)}%`;
            })()}
          </div>
        )}
      </div>

      {/* ── Mercados adicionales ─────────────────────────────── */}
      {(() => {
        const fmtML = (v) => v == null ? null : (v > 0 ? `+${Math.round(v)}` : `${Math.round(v)}`);
        const ouLine    = g.total_close ?? g.market_total;
        const hasOU     = ouLine != null || g.over_odds != null;
        const hasRL     = g.run_line != null && g.run_line !== 0;
        const hasK      = g.proj_k_away != null || g.proj_k_home != null;
        if (!hasOU && !hasRL && !hasK) return null;

        // ── O/U model pick ────────────────────────────────────────────────────
        const ouEdge    = (g.pred_total != null && ouLine != null) ? g.pred_total - ouLine : null;
        const ouPick    = ouEdge != null ? (ouEdge > 0.5 ? 'OVER' : ouEdge < -0.5 ? 'UNDER' : null) : null;
        const ouPickCls = ouPick === 'OVER'  ? 'text-accent-green font-black' :
                          ouPick === 'UNDER' ? 'text-accent-blue font-black'  : '';

        // ── O/U result (final games only) ─────────────────────────────────────
        const isFinalScored = g.is_played && g.home_score != null && g.away_score != null;
        const actualTotal   = isFinalScored ? g.home_score + g.away_score : null;
        const ouResult = (() => {
          if (!ouPick || !isFinalScored || ouLine == null) return null;
          if (actualTotal === ouLine) return 'push';
          const hit = ouPick === 'OVER' ? actualTotal > ouLine : actualTotal < ouLine;
          return hit ? 'win' : 'loss';
        })();

        // ── Run line recommendation: AWAY +1.5 (base-rate heuristic) ─────────
        // Walk-forward eval: lean from ML 47.4%, dedicated model 60.7%,
        // "always AWAY +1.5" wins both at 64.3%. So we just recommend the dog.
        const fmtRL = (v) => v == null ? null : (v > 0 ? `+${v}` : `${v}`);
        const awayRLVal = g.run_line;
        const homeRLVal = g.run_line != null ? -g.run_line : null;
        // run_line is the away team's spread. The dog is whichever side has +1.5
        const rlLean = (() => {
          if (g.run_line == null) return null;
          const awayIsDog = g.run_line > 0;  // away +1.5 → away dog
          const team = awayIsDog ? g.away_abbrev : g.home_abbrev;
          const side = awayIsDog ? g.run_line : Math.abs(g.run_line);  // always +1.5
          return { team, side, pickHome: !awayIsDog };
        })();

        // ── RL result (final games only): does the dog cover +1.5? ────────────
        const rlResult = (() => {
          if (!rlLean || !isFinalScored) return null;
          const homeMargin = g.home_score - g.away_score;
          // Dog +1.5 covers iff fav does NOT win by 2+
          const covered = rlLean.pickHome
            ? homeMargin >= -1   // home dog: covers unless away wins by 2+
            : homeMargin <= 1;   // away dog: covers unless home wins by 2+
          return covered ? 'win' : 'loss';
        })();

        const verdictBadge = (res) =>
          res === 'win'  ? <span className="text-[9px] font-black text-accent-green ml-1">✓</span> :
          res === 'loss' ? <span className="text-[9px] font-black text-accent-red ml-1">✗</span> :
          res === 'push' ? <span className="text-[9px] text-white/40 ml-1">~</span> : null;

        return (
          <div className="mt-3 pt-3 border-t border-white/[0.05] grid grid-cols-3 gap-3 text-center">

            {/* ── Total O/U ── */}
            <div className="flex flex-col gap-0.5">
              <div className="text-[8px] tracking-[0.2em] uppercase text-white/28 font-black">Total</div>
              {hasOU ? (
                <>
                  {ouLine != null && (
                    <div className="text-[12px] font-black text-white/75 tabular-nums">{ouLine.toFixed(1)}</div>
                  )}
                  {(g.over_odds != null || g.under_odds != null) && (
                    <div className="text-[9px] tabular-nums text-white/38">
                      O {fmtML(g.over_odds) ?? '—'} · U {fmtML(g.under_odds) ?? '—'}
                    </div>
                  )}
                  {ouPick && (
                    <div className={`text-[10px] tracking-wider uppercase mt-0.5 flex items-center justify-center gap-0.5 ${ouPickCls}`}>
                      {ouPick === 'OVER' ? '↑' : '↓'} {ouPick}
                      {ouEdge != null && <span className="text-[8px] opacity-70">({ouEdge > 0 ? '+' : ''}{ouEdge.toFixed(1)})</span>}
                      {verdictBadge(ouResult)}
                    </div>
                  )}
                  {isFinalScored && ouLine != null && (() => {
                    const over = actualTotal > ouLine;
                    const under = actualTotal < ouLine;
                    const push = actualTotal === ouLine;
                    const cls = over ? 'text-accent-green/75' : under ? 'text-accent-blue/75' : 'text-white/35';
                    const label = over ? 'OVER' : under ? 'UNDER' : 'PUSH';
                    return (
                      <div className={`text-[8px] font-black uppercase tabular-nums mt-0.5 ${cls}`}>
                        {actualTotal} {over ? '>' : under ? '<' : '='} {ouLine.toFixed(1)} · {label}
                      </div>
                    );
                  })()}
                </>
              ) : <div className="text-[10px] text-white/22">—</div>}
            </div>

            {/* ── Run Line ── */}
            <div className="flex flex-col gap-0.5">
              <div className="text-[8px] tracking-[0.2em] uppercase text-white/28 font-black">Run Line</div>
              {hasRL ? (
                <>
                  <div className="text-[9px] tabular-nums text-white/50">
                    {g.away_abbrev} {fmtRL(awayRLVal)}
                  </div>
                  <div className="text-[9px] tabular-nums text-white/50">
                    {g.home_abbrev} {fmtRL(homeRLVal)}
                    {g.home_rl_odds != null && <span className="text-white/30 ml-1">({fmtML(g.home_rl_odds)})</span>}
                  </div>
                  {rlLean && (
                    <>
                      <div className="text-[10px] font-black text-accent-gold/85 tracking-wider uppercase mt-0.5 flex items-center justify-center gap-0.5">
                        → {rlLean.team} {fmtRL(rlLean.side)}
                        {verdictBadge(rlResult)}
                      </div>
                      <div className="text-[7px] text-white/22 tracking-wider uppercase">Dog +1.5 · 64% hist.</div>
                    </>
                  )}
                  {isFinalScored && rlLean && (
                    <div className="text-[8px] text-white/28 tabular-nums">
                      {g.away_abbrev} {g.away_score} · {g.home_abbrev} {g.home_score}
                    </div>
                  )}
                </>
              ) : <div className="text-[10px] text-white/22">—</div>}
            </div>

            {/* ── Ks Est. ── */}
            <div className="flex flex-col gap-0.5">
              <div className="text-[8px] tracking-[0.2em] uppercase text-white/28 font-black">Ks Est.</div>
              {hasK ? (
                <>
                  <div className="text-[9px] tabular-nums text-white/55">
                    {g.away_abbrev} {g.proj_k_away?.toFixed(1) ?? '—'}
                  </div>
                  <div className="text-[9px] tabular-nums text-white/55">
                    {g.home_abbrev} {g.proj_k_home?.toFixed(1) ?? '—'}
                  </div>
                  {g.proj_k_away != null && g.proj_k_home != null && (
                    <div className="text-[8px] text-white/28 mt-0.5">
                      Total ~{(g.proj_k_away + g.proj_k_home).toFixed(0)} Ks
                    </div>
                  )}
                </>
              ) : <div className="text-[10px] text-white/22">—</div>}
            </div>

          </div>
        );
      })()}
    </div>
  );
}

// ─── COMPACT CARD (used in the new expandable Hoy row) ──────────────────────
// Narrower version of GameCard that keeps all sections visible vertically.
function CompactCard({ g, onOpen, onHover, expanded, accent }) {
  const isLive = g.is_live, isFinal = g.is_played;
  const evGrade = g.ev_grade || 'no_data';
  const isSweet = evGrade === 'sweet';
  const isMarginal = evGrade === 'marginal';
  const cardLiveWP = g.live_p_home != null && (isLive || isFinal);
  const cardPHome = cardLiveWP ? g.live_p_home : g.p_home;
  const cardPAway = cardPHome != null ? (1 - cardPHome) : g.p_away;
  const awayPct = Math.max(0, Math.min(100, (cardPAway || 0.5) * 100));
  const homePct = Math.max(0, Math.min(100, (cardPHome || 0.5) * 100));
  const shownPick = displayMlPick(g);
  const valueShown = shownPick.valueShown;
  const pickAbbr = shownPick.team;
  const pickDec  = shownPick.decimal;
  const homeWon = (g.home_score != null && g.away_score != null) ? g.home_score > g.away_score : null;
  const pickedHome = shownPick.side === 'HOME';
  const verdict = !isFinal || homeWon == null || !shownPick.side ? null : ((pickedHome === homeWon) ? 'win' : 'loss');
  const borderCls =
    verdict === 'win' ? 'border-accent-green/80' :
    verdict === 'loss' ? 'border-accent-red/80' :
    expanded ? 'border-accent-blue/60' :
    isLive ? 'border-accent-green/30' : 'border-white/[0.07]';
  const surfaceCls =
    verdict === 'win'
      ? 'bg-[radial-gradient(circle_at_50%_0%,rgba(81,207,102,0.24),transparent_48%),linear-gradient(180deg,rgba(8,45,31,0.98),rgba(2,14,10,0.99))] shadow-[0_20px_58px_rgba(81,207,102,0.20)]'
      : verdict === 'loss'
      ? 'bg-[radial-gradient(circle_at_50%_0%,rgba(230,57,70,0.25),transparent_48%),linear-gradient(180deg,rgba(48,10,18,0.98),rgba(16,3,7,0.99))] shadow-[0_20px_58px_rgba(230,57,70,0.20)]'
      : 'bg-[radial-gradient(circle_at_50%_0%,rgba(77,171,247,0.10),transparent_45%),linear-gradient(180deg,rgba(13,20,36,0.95),rgba(3,6,12,0.98))] shadow-[0_20px_56px_rgba(0,0,0,0.45)]';
  const resultColor = verdict === 'win' ? '#51CF66' : verdict === 'loss' ? '#E63946' : (accent || '#4DABF7');
  const fmtML = (v) => v == null ? null : (v > 0 ? `+${Math.round(v)}` : `${Math.round(v)}`);
  const fmtRL = (v) => v == null ? null : (v > 0 ? `+${v}` : `${v}`);

  const ouLine = g.total_close ?? g.market_total;
  const ouEdge = (g.pred_total != null && ouLine != null) ? g.pred_total - ouLine : null;
  // Always show the model's lean (even for tiny edges). Only mark NULL when
  // pred_total is missing entirely or the edge is literally zero.
  const ouPick = ouEdge != null && ouEdge !== 0
                 ? (ouEdge > 0 ? 'OVER' : 'UNDER')
                 : null;
  const isFinalScored = isFinal && g.home_score != null && g.away_score != null;
  const actualTotal = isFinalScored ? g.home_score + g.away_score : null;
  const ouResult = (!ouPick || !isFinalScored || ouLine == null) ? null :
                   (actualTotal === ouLine ? 'push' :
                   (ouPick === 'OVER' ? actualTotal > ouLine : actualTotal < ouLine) ? 'win' : 'loss');

  // Run line — always recommend the dog (+1.5)
  // Treat run_line=0 as missing data (0 isn't a valid MLB spread) — ESPN
  // sometimes returns 0 when no market is posted, which was causing the
  // pickHome / team selection to disagree and mark losses as wins.
  const hasValidRL = g.run_line != null && g.run_line !== 0;
  const awayRLVal = hasValidRL ? g.run_line : null;
  const homeRLVal = hasValidRL ? -g.run_line : null;
  const rlLean = hasValidRL ? {
    team: g.run_line > 0 ? g.away_abbrev : g.home_abbrev,
    side: g.run_line > 0 ? g.run_line : Math.abs(g.run_line),
    pickHome: g.run_line < 0,
  } : null;
  const rlResult = (!rlLean || !isFinalScored) ? null :
                   (rlLean.pickHome ? (g.home_score - g.away_score) >= -1
                                    : (g.away_score - g.home_score) >= -1) ? 'win' : 'loss';

  const fmtET = (iso) => {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleTimeString('en-US', {
        timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true
      });
    } catch { return '—'; }
  };

  // Confidence tier (who-wins reliability). LOCK ~71% hit rate historically.
  const TIER_META = {
    lock:     { label: 'LOCK',     icon: '🔒', cls: 'bg-accent-green/18 text-accent-green border-accent-green/45' },
    fuerte:   { label: 'FUERTE',   icon: '💪', cls: 'bg-accent-blue/18 text-accent-blue border-accent-blue/45' },
    moderado: { label: 'MODERADO', icon: '◆',  cls: 'bg-white/[0.06] text-white/55 border-white/[0.10]' },
    parejo:   { label: 'PAREJO',   icon: '〰', cls: 'bg-white/[0.03] text-white/35 border-white/[0.07]' },
  };
  const tierMeta = g.confidence_tier ? TIER_META[g.confidence_tier] : null;
  const tierPickAbbr = g.pick_abbrev || (g.p_home != null ? (g.p_home >= 0.5 ? g.home_abbrev : g.away_abbrev) : null);

  return (
    <div
      onMouseEnter={() => onHover?.(g.game_pk)}
      onClick={() => onOpen(g)}
      className={`flex-none w-[215px] rounded-[20px] border ${borderCls} cursor-pointer transition-all duration-500 relative overflow-hidden
                  ${surfaceCls}
                  ${g.pin_value_side && g.pin_value_book ? 'ring-1 ring-accent-gold/45' : ''}
                  ${expanded ? 'scale-[1.03] -translate-y-1 ring-1 ring-white/15' : 'hover:-translate-y-1 hover:brightness-110'}`}>
      <div className="absolute inset-x-0 top-0 h-[5px] opacity-100"
           style={{ background:`linear-gradient(90deg, transparent, ${(g.pin_value_side && g.pin_value_book) ? '#FFD43B' : resultColor}, transparent)` }}/>

      {/* ── Header: slot+time, status ─────────────────────────────────────── */}
      <div className="px-4 pt-4 flex items-center justify-between">
        <div className="text-[9px] tabular-nums tracking-[0.16em] uppercase text-white/45 font-black">
          #{g.slot || '?'} · {fmtET(g.first_pitch_utc)}
        </div>
        <span className={`text-[9px] tracking-[0.2em] uppercase font-black flex items-center gap-1
          ${isLive ? 'text-accent-green' : isFinal ? 'text-white/45' : 'text-accent-blue/85'}`}
          title={isLive ? fmtInningLong(g.live_score) || undefined : undefined}>
          {isLive && <span className="live-dot" style={{width:6,height:6}}/>}
          {isLive ? (
            <>
              <span>Live</span>
              {fmtInning(g.live_score) && (
                <span className="text-accent-green/70">· {fmtInning(g.live_score)}</span>
              )}
            </>
          ) : isFinal ? 'Final' : 'Prox'}
        </span>
      </div>

      {/* ── Venue ────────────────────────────────────────────────────────────── */}
      {g.venue && (
        <div className="px-4 mt-2 text-[8.5px] tracking-[0.22em] uppercase text-white/32 font-bold truncate text-center">
          {g.venue}
        </div>
      )}

      {/* ── Confidence tier + flip badges ──────────────────────────────────── */}
      {((tierMeta && g.confidence_tier !== 'parejo' && tierPickAbbr) || g.team_flip || g.day_flip || g.night_flip || g.pickday_flip || g.night_elite || g.series_flip || g.h2h_bias || g.pitcher_bias || g.cold_streak_bias || g.hot_streak_bias || g.blowout_bias) && (
        <div className="px-4 mt-2 flex justify-center gap-1 flex-wrap">
          {tierMeta && g.confidence_tier !== 'parejo' && tierPickAbbr && (
            <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-[8.5px] font-black tracking-[0.14em] uppercase ${tierMeta.cls}`}>
              <span>{tierMeta.icon}</span>
              <span>{tierMeta.label} {tierPickAbbr}</span>
              {g.tier_hit_rate != null && <span className="opacity-70">· {g.tier_hit_rate.toFixed(0)}%</span>}
            </span>
          )}
          {g.team_flip && (
            <span
              title="Ajuste equipo trampa: el modelo pickeaba LAA o contra MIL — histórico <50% acierto en las 4 temporadas. Pick invertido."
              className="inline-flex items-center px-2 py-1 rounded-full border border-accent-orange/40 bg-accent-orange/10 text-accent-orange text-[8.5px] font-black tracking-[0.14em] uppercase">
              Ajuste equipo
            </span>
          )}
          {g.day_flip && (
            <span
              title="Ajuste día trampa: el modelo pickeaba contra WSH un sábado — histórico <45% acierto en 3 temporadas. Pick invertido."
              className="inline-flex items-center px-2 py-1 rounded-full border border-accent-gold/40 bg-accent-gold/10 text-accent-gold text-[8.5px] font-black tracking-[0.14em] uppercase">
              Ajuste día
            </span>
          )}
          {g.night_flip && (
            <span
              title="Ajuste noche trampa: el modelo pickeaba DET en juego nocturno — en 2026 esos picks solo aciertan 34% (n=32). Pick invertido. Regla 2026+, revalidar mensual."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-orange/45 bg-accent-orange/10 text-accent-orange text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>🌙</span>
              <span>Ajuste noche</span>
            </span>
          )}
          {g.pickday_flip && (
            <span
              title="Ajuste día trampa fino: el pick sobre este equipo en este día de la semana falla <42% en 2026 y <48% en 2025 (BOS Dom, HOU/CLE Lun, BAL Mar/Sáb, CLE Dom). Pick invertido. Regla 2026+, revalidar mensual."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-red/40 bg-accent-red/12 text-accent-red text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>📅</span>
              <span>Fade día</span>
            </span>
          )}
          {g.night_elite && (
            <span
              title="Elite noche: el modelo picka PHI en juegos nocturnos — histórico 66.8% acierto en 4 temporadas (2026 al 73%). Zona de alta confianza."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-gold/50 bg-accent-gold/12 text-accent-gold text-[8.5px] font-black tracking-[0.14em] uppercase shadow-[0_0_18px_rgba(255,212,59,0.18)]">
              <span>★</span>
              <span>Elite noche · 67%</span>
            </span>
          )}
          {g.series_flip && (
            <span
              title="Ajuste serie: el modelo repetía el pick que acaba de fallar en esta serie, en contra del mercado — en 2026 esos picks aciertan solo 36% vs 64% del mercado. Pick alineado al mercado."
              className="inline-flex items-center px-2 py-1 rounded-full border border-accent-blue/45 bg-accent-blue/10 text-accent-blue text-[8.5px] font-black tracking-[0.14em] uppercase">
              Ajuste serie
            </span>
          )}
          {g.h2h_bias && (
            <span
              title="Ajuste H2H: matchup con miscalibración histórica del modelo (BAL/BOS, DET/CLE, DET/KC, WSH/MIA, PIT/CIN, KC/MIN, SEA/TEX, PHI/NYM). Sesgo aplicado cambió el pick para alinearlo con el historial. Backtest: +32pp acc 2026 en pares, +0.64pp global 2026."
              className="inline-flex items-center px-2 py-1 rounded-full border border-accent-purple/45 bg-accent-purple/10 text-accent-purple text-[8.5px] font-black tracking-[0.14em] uppercase">
              Ajuste H2H
            </span>
          )}
          {g.pitcher_bias && (
            <span
              title="Ajuste pitcher: abridor con miscalibración histórica del modelo (Wheeler, Sale, deGrom, Sánchez, Woo, Yamamoto, Civale, etc.). Sesgo aplicado cambió el pick para alinearlo con el historial. Backtest: +0.87pp acc en los juegos afectados 2026."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-green/45 bg-accent-green/10 text-accent-green text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>⚾</span>
              <span>Ajuste pitcher</span>
            </span>
          )}
          {g.cold_streak_bias && (
            <span
              title="Ajuste racha fría: local llega con 3+ derrotas consecutivas. En 2026 esos equipos ganan +11pp más de lo predicho (mean reversion). Pick sesgado hacia local. Regla 2026+, revalidar mensual."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-blue/45 bg-accent-blue/10 text-accent-blue text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>❄️</span>
              <span>Racha fría</span>
            </span>
          )}
          {g.hot_streak_bias && (
            <span
              title="Ajuste racha caliente: visitante llega con 3+ victorias consecutivas. En 2026 el local gana +8pp más de lo predicho (fade de racha away). Pick sesgado hacia local. Regla 2026+, revalidar mensual."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-red/40 bg-accent-red/10 text-accent-red text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>🔥</span>
              <span>Fade visita</span>
            </span>
          )}
          {g.blowout_bias && (
            <span
              title="Ajuste momentum: local viene de ganar por 8+ carreras el juego previo. Históricamente sigue ganando más de lo predicho (concordante en 4 años). Pick sesgado hacia local. Regla 2025+, revalidar mensual."
              className="inline-flex items-center gap-1 px-2 py-1 rounded-full border border-accent-gold/45 bg-accent-gold/10 text-accent-gold text-[8.5px] font-black tracking-[0.14em] uppercase">
              <span>💥</span>
              <span>Momentum W</span>
            </span>
          )}
        </div>
      )}

      {/* ── Team logos row ──────────────────────────────────────────────────── */}
      <div className="px-3 pt-5 grid grid-cols-[1fr_auto_1fr] items-center gap-1.5">
        <div className="flex flex-col items-center min-w-0">
          <div className="w-[52px] h-[52px] rounded-xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-center shadow-inner shrink-0">
            <img src={teamLogo(g.away_abbrev)} alt={g.away_abbrev}
                 className="w-[44px] h-[44px] object-contain drop-shadow-[0_6px_12px_rgba(0,0,0,0.45)]" onError={(e)=>e.target.style.opacity=0.25}/>
          </div>
          <div className="mega text-[22px] leading-none tracking-tight mt-2.5">{g.away_abbrev}</div>
          <div className="text-[11px] tabular-nums font-bold text-white/75 mt-1.5">{g.p_away != null ? (g.p_away*100).toFixed(1)+'%' : '—'}</div>
          {cardLiveWP && <div className="text-[8px] tabular-nums text-accent-green/65 mt-0.5">{(cardPAway*100).toFixed(1)}% vivo</div>}
        </div>
        {(isLive || isFinal) ? (
          <div className="flex flex-col items-center bg-ink-0/85 border border-white/[0.08] rounded-xl px-2 py-1.5 shadow-[0_8px_20px_rgba(0,0,0,0.4)]">
            <div className="text-[7.5px] tracking-[0.22em] uppercase text-white/35 font-black">{isFinal ? 'Final' : 'Live'}</div>
            <div className="mega text-[26px] tabular-nums leading-none mt-0.5">
              {g.away_score ?? 0}<span className="text-white/22 text-[17px] mx-1">·</span>{g.home_score ?? 0}
            </div>
          </div>
        ) : (
          <div className="relative flex items-center justify-center w-10 h-10">
            <div className="absolute inset-0 rounded-full border border-white/[0.06] bg-white/[0.02]"/>
            <div className="text-white/30 text-[8.5px] tracking-[0.3em] font-black">VS</div>
          </div>
        )}
        <div className="flex flex-col items-center min-w-0">
          <div className="w-[52px] h-[52px] rounded-xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-center shadow-inner shrink-0">
            <img src={teamLogo(g.home_abbrev)} alt={g.home_abbrev}
                 className="w-[44px] h-[44px] object-contain drop-shadow-[0_6px_12px_rgba(0,0,0,0.45)]" onError={(e)=>e.target.style.opacity=0.25}/>
          </div>
          <div className="mega text-[22px] leading-none tracking-tight mt-2.5">{g.home_abbrev}</div>
          <div className="text-[11px] tabular-nums font-bold text-white/75 mt-1.5">{g.p_home != null ? (g.p_home*100).toFixed(1)+'%' : '—'}</div>
          {cardLiveWP && <div className="text-[8px] tabular-nums text-accent-green/65 mt-0.5">{(cardPHome*100).toFixed(1)}% vivo</div>}
        </div>
      </div>

      {/* ── Pitchers ─────────────────────────────────────────────────────────── */}
      {(g.pitcher_away?.name || g.pitcher_home?.name) && (
        <div className="px-4 pt-4 text-center text-[9px] text-white/40 tracking-wide truncate">
          {g.pitcher_away?.name ? g.pitcher_away.name.split(' ').pop() : '—'}
          {g.pitcher_away?.throws ? ` (${g.pitcher_away.throws})` : ''}
          <span className="text-white/22 mx-2">vs</span>
          {g.pitcher_home?.name ? g.pitcher_home.name.split(' ').pop() : '—'}
          {g.pitcher_home?.throws ? ` (${g.pitcher_home.throws})` : ''}
        </div>
      )}

      {/* ── Win prob donut ──────────────────────────────────────────────────── */}
      <div className="px-4 pt-5 flex items-center justify-center gap-3">
        <span className="mega text-[14px] text-accent-red/80 tabular-nums">{Math.round(awayPct)}%</span>
        {(() => {
          const r = 30;              // ring radius
          const C = 2 * Math.PI * r; // circumference
          const awayLen = (awayPct / 100) * C;
          const homeLen = (homePct / 100) * C;
          return (
            <div className="relative flex items-center justify-center" style={{ width: 78, height: 78 }}>
              <svg width="78" height="78" viewBox="0 0 78 78" style={{ transform: 'rotate(-90deg)' }}>
                {/* track */}
                <circle cx="39" cy="39" r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="7"/>
                {/* away arc — red, starts at top, going clockwise */}
                <circle cx="39" cy="39" r={r} fill="none"
                        stroke="#E63946" strokeWidth="7" strokeLinecap="round"
                        strokeDasharray={`${awayLen} ${C}`} strokeDashoffset="0"/>
                {/* home arc — blue, picks up after away */}
                <circle cx="39" cy="39" r={r} fill="none"
                        stroke="#4DABF7" strokeWidth="7" strokeLinecap="round"
                        strokeDasharray={`${homeLen} ${C}`} strokeDashoffset={`-${awayLen}`}/>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <div className="text-[6.5px] tracking-[0.16em] uppercase text-white/40 font-black leading-none">
                  {cardLiveWP ? 'Vivo' : 'Modelo'}
                </div>
                <div className="text-[7px] tracking-[0.16em] uppercase text-white/55 font-black leading-none mt-0.5">
                  Win Prob
                </div>
              </div>
            </div>
          );
        })()}
        <span className="mega text-[14px] text-accent-blue/80 tabular-nums">{Math.round(homePct)}%</span>
      </div>

      {/* ── Pick badge ───────────────────────────────────────────────────────── */}
      <div className="px-4 pt-4">
        {pickAbbr && (
          <div className={`text-[11px] text-center font-black tracking-wider uppercase rounded-xl py-2.5 px-3 border flex items-center justify-center gap-2
            ${isSweet ? 'bg-gradient-to-r from-accent-green/20 to-accent-green/[0.04] text-accent-green border-accent-green/45' :
              isMarginal ? 'bg-gradient-to-r from-accent-blue/20 to-accent-blue/[0.04] text-accent-blue border-accent-blue/45' :
              evGrade === 'overconfident' ? 'bg-gradient-to-r from-accent-red/18 to-accent-red/[0.04] text-accent-red border-accent-red/40' :
              'bg-gradient-to-r from-white/[0.08] to-white/[0.02] text-white/60 border-white/[0.10]'}`}>
            <span className="text-[12px]">
              {isSweet ? '◆' : isMarginal ? '◇' : evGrade === 'overconfident' ? '⚠' : '•'}
            </span>
            <span>
              {isSweet ? '+EV ' : isMarginal ? '+EV LIGHT ' : evGrade === 'overconfident' ? 'RIESGO ' : ''}
              {pickAbbr}{pickDec != null && ` @ ${pickDec.toFixed(2)}`}
            </span>
          </div>
        )}
        {valueShown && shownPick.bestBook && (
          <div className="text-[8.5px] text-center text-accent-gold/75 font-bold tracking-wide mt-1.5">
            🏷 Mejor precio en {shownPick.bestBook}
            {g.value_shop_gain_pp > 0 && <span className="text-white/30"> · +{g.value_shop_gain_pp.toFixed(1)}pp</span>}
          </div>
        )}
        {/* Pinnacle sharp value — soft book pays over the sharpest book's fair line */}
        {g.pin_value_side && g.pin_value_book && (
          <div className="mt-2.5 rounded-xl border border-accent-gold/55 bg-gradient-to-r from-accent-gold/20 via-accent-gold/12 to-accent-gold/[0.06]
                          px-2.5 py-2 text-center shadow-[0_0_20px_rgba(255,212,59,0.28)] animate-[sharpPulse_2.4s_ease-in-out_infinite]">
            <div className="flex items-center justify-center gap-1.5 text-[10px] font-black tracking-[0.14em] uppercase text-accent-gold">
              <span className="text-[12px]">🎯</span>
              <span>VALOR SHARP</span>
            </div>
            <div className="text-[11px] font-black text-white/90 mt-0.5 tabular-nums">
              {g.pin_value_side === 'HOME' ? g.home_abbrev : g.away_abbrev}
              <span className="text-accent-gold"> +{g.pin_value_edge_pp.toFixed(1)}pp</span>
              <span className="text-white/45"> · {g.pin_value_book}</span>
            </div>
            <div className="text-[7.5px] text-white/35 tracking-wide uppercase mt-0.5">paga sobre Pinnacle</div>
          </div>
        )}
        {verdict === 'win'  && <div className="text-[11px] text-center text-ink-0 bg-accent-green border border-accent-green rounded-xl font-black mt-2 py-2 tracking-[0.18em] shadow-[0_0_22px_rgba(81,207,102,0.28)]">✓ GANÓ</div>}
        {verdict === 'loss' && <div className="text-[11px] text-center text-white bg-accent-red border border-accent-red rounded-xl font-black mt-2 py-2 tracking-[0.18em] shadow-[0_0_22px_rgba(230,57,70,0.30)]">✗ PERDIÓ</div>}
        {valueShown && g.value_side && g.p_home != null && g.market_home_implied != null && (
          <div className="text-[9px] text-center text-white/35 tabular-nums mt-2">
            {(() => {
              // Use the model-only value probability to justify the edge
              const pv = g.p_home_value != null ? g.p_home_value : g.p_home;
              const pm = g.value_side === 'HOME' ? pv : 1 - pv;
              const pk = g.value_side === 'HOME' ? g.market_home_implied : g.market_away_implied;
              if (pm == null || pk == null) return null;
              return `Modelo ${(pm*100).toFixed(1)}% · Mercado ${(pk*100).toFixed(1)}%`;
            })()}
          </div>
        )}
      </div>

      {/* ── Market grid: Total / RL / Ks ─────────────────────────────────────── */}
      <div className="mt-4 mx-4 mb-4 pt-4 border-t border-white/[0.07] grid grid-cols-3 gap-2 text-center">
        {/* TOTAL */}
        <div className="flex flex-col gap-1 min-h-[110px]">
          <div className="text-[8.5px] tracking-[0.2em] uppercase text-white/35 font-black">Total</div>
          {ouLine != null ? (
            <>
              <div className="text-[15px] font-black text-white/80 tabular-nums leading-none">{ouLine.toFixed(1)}</div>
              <div className="text-[9px] tabular-nums text-white/45 leading-tight mt-0.5">
                O {fmtML(g.over_odds) ?? '—'}<br/>U {fmtML(g.under_odds) ?? '—'}
              </div>
              {ouPick && (
                <div className={`text-[10px] font-black tracking-wider mt-auto flex items-center justify-center gap-0.5
                  ${ouPick === 'OVER' ? 'text-accent-green' : 'text-accent-blue'}`}>
                  {ouPick === 'OVER' ? '↑' : '↓'} {ouPick}
                  {ouResult === 'win' && <span className="text-accent-green">✓</span>}
                  {ouResult === 'loss' && <span className="text-accent-red">✗</span>}
                </div>
              )}
              {isFinalScored && (
                <div className={`text-[8.5px] font-black tabular-nums leading-tight
                  ${actualTotal > ouLine ? 'text-accent-green/70' : actualTotal < ouLine ? 'text-accent-blue/70' : 'text-white/30'}`}>
                  {actualTotal} {actualTotal > ouLine ? '>' : actualTotal < ouLine ? '<' : '='} {ouLine.toFixed(1)}
                </div>
              )}
            </>
          ) : <div className="text-[10px] text-white/22 mt-2">—</div>}
        </div>
        {/* RUN LINE */}
        <div className="flex flex-col gap-1 min-h-[110px]">
          <div className="text-[8.5px] tracking-[0.2em] uppercase text-white/35 font-black">Run Line</div>
          {rlLean ? (
            <>
              <div className="text-[10px] tabular-nums text-white/60 leading-tight mt-0.5">
                {g.away_abbrev} {fmtRL(awayRLVal)}<br/>
                {g.home_abbrev} {fmtRL(homeRLVal)}
              </div>
              <div className="text-[10px] font-black text-accent-gold/85 tracking-wider mt-auto flex items-center justify-center gap-0.5">
                → {rlLean.team} +{rlLean.side}
                {rlResult === 'win' && <span className="text-accent-green">✓</span>}
                {rlResult === 'loss' && <span className="text-accent-red">✗</span>}
              </div>
              {isFinalScored && (
                <div className="text-[8.5px] text-white/30 tabular-nums">
                  {g.away_abbrev} {g.away_score}·{g.home_abbrev} {g.home_score}
                </div>
              )}
            </>
          ) : <div className="text-[10px] text-white/22 mt-2">—</div>}
        </div>
        {/* KS EST. */}
        <div className="flex flex-col gap-1 min-h-[110px]">
          <div className="text-[8.5px] tracking-[0.2em] uppercase text-white/35 font-black">Ks Est.</div>
          {(g.proj_k_away != null || g.proj_k_home != null) ? (
            <>
              <div className="text-[10px] tabular-nums text-white/60 leading-tight mt-0.5">
                {g.away_abbrev} {g.proj_k_away?.toFixed(1) ?? '—'}<br/>
                {g.home_abbrev} {g.proj_k_home?.toFixed(1) ?? '—'}
              </div>
              {g.proj_k_away != null && g.proj_k_home != null && (
                <div className="text-[8.5px] text-white/35 font-black mt-auto">~{Math.round(g.proj_k_away + g.proj_k_home)} Ks</div>
              )}
            </>
          ) : <div className="text-[10px] text-white/22 mt-2">—</div>}
        </div>
      </div>
    </div>
  );
}

// ─── INSIGHT PANEL — game-story narrative (not model-talk) ───────────────────
function InsightPanel({ g, onOpen }) {
  if (!g) return null;
  const fmt1 = (v) => v == null ? '—' : v.toFixed(1);
  const fmtPct = (v) => v == null ? '—' : `${Math.round(v*100)}%`;
  const pick   = g.value_team_abbrev || g.pick_abbrev;
  const pickHome = pick === g.home_abbrev;
  const dog    = pick === g.home_abbrev ? g.away_abbrev : g.home_abbrev;
  const pickFullProb = g.p_home != null
    ? (pickHome ? g.p_home : 1 - g.p_home) : null;

  // ── 1. Pitcher matchup story ────────────────────────────────────────────────
  const pa = g.pitcher_away?.name?.split(' ').pop();
  const ph = g.pitcher_home?.name?.split(' ').pop();
  const paT = g.pitcher_away?.throws;
  const phT = g.pitcher_home?.throws;
  const handMatchup = paT && phT
    ? (paT === phT ? `Duelo ${paT === 'L' ? 'zurdo vs zurdo' : 'derecho vs derecho'}.`
       : `Cruce ${paT}HP vs ${phT}HP.`)
    : null;

  // ── 2. Burn — "carne al asador" ayer ────────────────────────────────────────
  const burnA = g.ctx_burn_away ?? 0;
  const burnH = g.ctx_burn_home ?? 0;
  const burnAlerts = [];
  if (burnA >= 50) burnAlerts.push({
    team: g.away_abbrev, score: burnA, tags: g.ctx_burn_away_tags || [],
  });
  if (burnH >= 50) burnAlerts.push({
    team: g.home_abbrev, score: burnH, tags: g.ctx_burn_home_tags || [],
  });

  // ── 3. Forma reciente ───────────────────────────────────────────────────────
  const aRuns = g.ins_runs_scored_a, hRuns = g.ins_runs_scored_h;
  const aAllow = g.ins_runs_allowed_a, hAllow = g.ins_runs_allowed_h;
  const aWin = g.ins_win_pct_a, hWin = g.ins_win_pct_h;

  // ── 4. Weather/venue ────────────────────────────────────────────────────────
  const temp = g.ctx_weather_temp;
  const cond = g.ctx_weather_cond;
  const wind = g.ctx_weather_wind;
  const indoor = g.ctx_roof_type && /closed|dome/i.test(g.ctx_roof_type);
  const weatherLine = indoor
    ? 'Estadio techado · clima sin efecto.'
    : (temp != null || cond)
      ? [
          temp != null ? `${Math.round(temp)}°F` : null,
          cond,
          wind ? `viento ${wind}` : null,
        ].filter(Boolean).join(' · ')
      : null;

  // ── 5. Comeback resilience ──────────────────────────────────────────────────
  const cbA = g.ins_cb_rate_a;
  const cbH = g.ins_cb_rate_h;
  const cbHigh = (cbA != null && cbA >= 0.25) || (cbH != null && cbH >= 0.25);

  return (
    <div className="flex-none w-[440px] rounded-2xl border border-accent-blue/40 bg-gradient-to-br from-ink-1/96 to-ink-0/98
                    px-5 py-5 shadow-[0_22px_56px_rgba(0,0,0,0.55)] relative overflow-hidden"
         onClick={() => onOpen(g)}
         style={{ cursor: 'pointer' }}>
      <div className="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-accent-blue to-transparent opacity-80"/>

      <div className="text-[9px] tracking-[0.28em] uppercase text-accent-blue/85 font-black mb-1">
        Análisis del partido
      </div>
      <div className="mega text-[20px] leading-tight mb-1">
        {g.away_abbrev} <span className="text-white/25">@</span> {g.home_abbrev}
      </div>
      {pick && pickFullProb != null && (
        <div className="text-[10px] text-white/55 mb-4">
          Lean del modelo: <span className="text-accent-blue font-black">{pick}</span>
          <span className="text-white/35 ml-1">({fmtPct(pickFullProb)})</span>
        </div>
      )}

      {/* ── 1) Pitchers ─────────────────────────────────────────────── */}
      {(pa || ph) && (
        <div className="rounded-xl border border-white/[0.07] bg-white/[0.025] p-3 mb-2.5">
          <div className="text-[8px] tracking-[0.22em] uppercase text-accent-gold/80 font-black mb-1.5">El duelo en la loma</div>
          <div className="text-[11px] text-white/70 leading-relaxed">
            <span className="font-black">{pa || 'TBD'}{paT && ` (${paT})`}</span>
            <span className="text-white/30 mx-1.5">vs</span>
            <span className="font-black">{ph || 'TBD'}{phT && ` (${phT})`}</span>
          </div>
          {handMatchup && <div className="text-[10px] text-white/45 mt-1">{handMatchup}</div>}
        </div>
      )}

      {/* ── 2) Burn (carne al asador ayer) ──────────────────────────── */}
      {burnAlerts.length > 0 && (
        <div className="rounded-xl border border-accent-red/30 bg-accent-red/[0.06] p-3 mb-2.5">
          <div className="text-[8px] tracking-[0.22em] uppercase text-accent-red/85 font-black mb-1.5">Carne al asador ayer</div>
          {burnAlerts.map(b => (
            <div key={b.team} className="text-[10.5px] text-white/70 leading-relaxed mb-0.5">
              <span className="font-black text-accent-red">{b.team}</span>
              <span className="text-white/40"> quemó fuerte ({b.score}/100)</span>
              {b.tags.length > 0 && (
                <span className="text-white/35"> — {b.tags.join(', ')}</span>
              )}
            </div>
          ))}
          <div className="text-[8.5px] text-white/35 mt-1.5 italic">
            Histórico dice: equipos quemados ganan +3pp más al día siguiente, no menos.
          </div>
        </div>
      )}
