// ─── ROOT APP ────────────────────────────────────────────────────────────────
function App() {
  const [date, setDate] = useState(todayISO());
  const [games, setGames] = useState([]);
  const [runBursts, setRunBursts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeId, setActiveId] = useState('hero');
  const [scrolled, setScrolled] = useState(false);
  const [openPk, setOpenPk] = useState(null);
  const [transitioning, setTransitioning] = useState(false);
  const [performance, setPerformance] = useState(null);
  const [performanceLoading, setPerformanceLoading] = useState(false);
  const [performanceError, setPerformanceError] = useState(null);
  const [teamRanking, setTeamRanking] = useState(null);
  const [teamRankingLoading, setTeamRankingLoading] = useState(false);
  const [teamRankingDays, setTeamRankingDays] = useState(60);
  const [teamSearchQuery, setTeamSearchQuery] = useState('');
  const [teamWinProbFilter, setTeamWinProbFilter] = useState('');
  const [teamHistoryGames, setTeamHistoryGames] = useState(null);
  const [teamHistoryLoading, setTeamHistoryLoading] = useState(false);
  const [yesterday, setYesterday] = useState(null);
  const [yesterdayLoading, setYesterdayLoading] = useState(false);
  const [burnData, setBurnData] = useState(null);
  const [burnLoading, setBurnLoading] = useState(false);
  const [comebacks, setComebacks] = useState(null);
  const [comebacksLoading, setComebacksLoading] = useState(false);
  const [comebacksSeason, setComebacksSeason] = useState(2026);
  const [errors, setErrors] = useState(null);
  const [errorsLoading, setErrorsLoading] = useState(false);
  const [errorsSeason, setErrorsSeason] = useState(2026);
  const [remontasView, setRemontasView] = useState('comebacks'); // 'comebacks' | 'errors'

  const pageRef = useRef(null);
  const pageContentRef = useRef(null);
  const pageAnimatingRef = useRef(false);
  const swapRef = useRef(null);
  const previousGamesRef = useRef(null);
  const activeIdRef = useRef(activeId);
  const pendingRunBurstsRef = useRef([]);
  const pageHiddenRef = useRef(typeof document !== 'undefined' ? document.hidden : false);

  useEffect(() => {
    activeIdRef.current = activeId;
  }, [activeId]);

  // Sequential burst queue — only ONE animation on screen at a time. When
  // multiple games score simultaneously, we play them back-to-back so the
  // team logos/names don't stack on top of each other at the same position.
  const burstQueueRef = useRef([]);
  const burstPlayingRef = useRef(false);

  const playNextBurst = useCallback(() => {
    if (burstPlayingRef.current) return;
    const next = burstQueueRef.current.shift();
    if (!next) return;
    burstPlayingRef.current = true;
    setRunBursts([next]);
    // Cinematic animation is 3800ms; a small 350ms gap between bursts gives
    // the eye a beat before the next one starts.
    window.setTimeout(() => {
      setRunBursts([]);
      window.setTimeout(() => {
        burstPlayingRef.current = false;
        playNextBurst();
      }, 350);
    }, 3900);
  }, []);

  const releaseBursts = useCallback((bursts) => {
    if (!bursts.length) return;
    burstQueueRef.current.push(...bursts);
    playNextBurst();
  }, [playNextBurst]);

  const flushPendingBursts = useCallback(() => {
    if (pageHiddenRef.current) return;
    if (!RUN_BURST_TABS.has(activeIdRef.current)) return;
    if (!pendingRunBurstsRef.current.length) return;
    const bursts = pendingRunBurstsRef.current.splice(0, pendingRunBurstsRef.current.length);
    const staged = bursts.map((burst, index) => ({
      ...burst,
      id: `${burst.id}-flush-${index}-${Date.now()}`,
    }));
    releaseBursts(staged);
  }, [releaseBursts]);

  useEffect(() => {
    const onVisibility = () => {
      pageHiddenRef.current = document.hidden;
      if (!document.hidden) flushPendingBursts();
    };
    document.addEventListener('visibilitychange', onVisibility);
    return () => document.removeEventListener('visibilitychange', onVisibility);
  }, [flushPendingBursts]);

  useEffect(() => {
    flushPendingBursts();
  }, [activeId, flushPendingBursts]);

  const processIncomingGames = useCallback((incoming) => {
    const prev = previousGamesRef.current;
    const next = Array.isArray(incoming) ? incoming : [];
    if (prev && RUN_BURST_TABS.has(activeIdRef.current)) {
      const bursts = [];
      for (const game of next) {
        const oldGame = prev.get(game.game_pk);
        if (!oldGame) continue;
        const oldRuns = gameTotalRuns(oldGame);
        const newRuns = gameTotalRuns(game);
        if (oldRuns == null || newRuns == null || newRuns <= oldRuns) continue;
        const gained = newRuns - oldRuns;
        const scorer =
          Number(game.home_score ?? 0) > Number(oldGame.home_score ?? 0) ? game.home_abbrev :
          Number(game.away_score ?? 0) > Number(oldGame.away_score ?? 0) ? game.away_abbrev :
          (game.home_abbrev || game.away_abbrev || 'Run');
        // ONE burst per scoring event (not per run). If the rally spans multiple
        // runs, the badge says "RALLY N CARRERAS" so the meaning is preserved
        // without stacking N overlapping animations.
        bursts.push({
          id: `${game.game_pk}-${Date.now()}`,
          label: `${scorer} anota`,
          subLabel: gained > 1 ? `RALLY ${gained} CARRERAS` : 'CARRERA ANOTADA',
          team: scorer,
          teamName: TEAM_NAMES[scorer] || scorer,
          startX: '0vw',
          startY: '0vh',
        });
      }
      if (bursts.length) {
        if (pageHiddenRef.current) {
          pendingRunBurstsRef.current.push(...bursts);
        } else {
          releaseBursts(bursts);
        }
      }
    }
    previousGamesRef.current = new Map(next.map((g) => [g.game_pk, g]));
    return next;
  }, [releaseBursts]);

  // Start Three.js once
  useEffect(() => {
    if (window.THREE) startParticles();
    else {
      const id = setInterval(() => {
        if (window.THREE) { clearInterval(id); startParticles(); }
      }, 80);
      return () => clearInterval(id);
    }
  }, []);

  // Fetch games when date changes
  useEffect(() => {
    setLoading(true);
    previousGamesRef.current = null;
    fetch(`/api/games?start=${date}&end=${date}&t=${Date.now()}`)
      .then(r => r.json())
      .then(d => { setGames(processIncomingGames(d)); setLoading(false); })
      .catch(() => setLoading(false));
  }, [date, processIncomingGames]);

  // Auto refresh
  useEffect(() => {
    const t = setInterval(() => {
      fetch(`/api/games?start=${date}&end=${date}&t=${Date.now()}`)
        .then(r=>r.json())
        .then(d => setGames(processIncomingGames(d)))
        .catch(()=>{});
    }, 30000);
    return () => clearInterval(t);
  }, [date, processIncomingGames]);

  useEffect(() => {
    if (!['resumen', 'modelo'].includes(activeId) || performanceLoading || performance) return;
    setPerformanceLoading(true);
    setPerformanceError(null);
    fetch(`/api/performance?days=90&t=${Date.now()}`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(d => { setPerformance(d); setPerformanceLoading(false); })
      .catch((err) => { setPerformanceError(err.message || 'Error'); setPerformanceLoading(false); });
  }, [activeId, performance, performanceLoading]);

  useEffect(() => {
    if (activeId !== 'ranking') return;
    setTeamRankingLoading(true);
    fetch(`/api/team-ranking?days=${teamRankingDays}&t=${Date.now()}`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(d => { setTeamRanking(d); setTeamRankingLoading(false); })
      .catch(() => { setTeamRanking(null); setTeamRankingLoading(false); });
  }, [activeId, teamRankingDays]);

  useEffect(() => {
    if (activeId !== 'equipo') return;
    const resolvedTeam = resolveTeamQuery(teamSearchQuery);
    if (!resolvedTeam) {
      setTeamHistoryGames([]);
      setTeamHistoryLoading(false);
      return;
    }
    const start = shiftDate(date, -89);
    setTeamHistoryLoading(true);
    fetch(`/api/games?start=${start}&end=${date}&team=${encodeURIComponent(resolvedTeam)}&t=${Date.now()}`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(d => { setTeamHistoryGames(d); setTeamHistoryLoading(false); })
      .catch(() => { setTeamHistoryGames([]); setTeamHistoryLoading(false); });
  }, [activeId, date, teamSearchQuery]);

  // Fetch yesterday stats on first visit to 'hoy'
  useEffect(() => {
    if (activeId !== 'hoy' || yesterdayLoading || yesterday) return;
    setYesterdayLoading(true);
    fetch('/api/performance?days=2')
      .then(r => r.json())
      .then(d => { setYesterday(d); setYesterdayLoading(false); })
      .catch(() => setYesterdayLoading(false));
  }, [activeId, yesterday, yesterdayLoading]);

  // Fetch burn report when 'hoy' is visited (and when date changes)
  useEffect(() => {
    if (activeId !== 'hoy') return;
    setBurnLoading(true);
    fetch(`/api/burn?date=${date}&t=${Date.now()}`)
      .then(r => r.json())
      .then(d => { setBurnData(d); setBurnLoading(false); })
      .catch(() => setBurnLoading(false));
  }, [activeId, date]);

  // Fetch comebacks when visiting 'remontas' or when season changes
  useEffect(() => {
    if (activeId !== 'remontas') return;
    setComebacksLoading(true);
    fetch(`/api/comebacks?season=${comebacksSeason}&t=${Date.now()}`)
      .then(r => r.json())
      .then(d => { setComebacks(d); setComebacksLoading(false); })
      .catch(() => setComebacksLoading(false));
  }, [activeId, comebacksSeason]);

  // Fetch error analysis when switching to errors sub-view
  useEffect(() => {
    if (activeId !== 'remontas' || remontasView !== 'errors') return;
    if (errors && errors.season === errorsSeason) return;
    setErrorsLoading(true);
    fetch(`/api/errors?season=${errorsSeason}&t=${Date.now()}`)
      .then(r => r.json())
      .then(d => { setErrors(d); setErrorsLoading(false); })
      .catch(() => setErrorsLoading(false));
  }, [activeId, remontasView, errorsSeason]);

  // Page scroll state
  useEffect(() => {
    const root = pageRef.current;
    if (!root) return;
    const onScroll = () => {
      setScrolled(root.scrollTop > 80);
    };
    root.addEventListener('scroll', onScroll);
    onScroll();
    return () => root.removeEventListener('scroll', onScroll);
  }, []);

  const goPage = useCallback((id) => {
    if (id === activeId || pageAnimatingRef.current) return;
    const fromIndex = Math.max(0, SECTIONS.findIndex(s => s.id === activeId));
    const toIndex = Math.max(0, SECTIONS.findIndex(s => s.id === id));
    const dir = toIndex >= fromIndex ? 1 : -1;
    const current = pageContentRef.current;
    const root = pageRef.current;
    pageAnimatingRef.current = true;
    const enterNext = () => {
      setActiveId(id);
      setScrolled(false);
      if (root) root.scrollTop = 0;
      requestAnimationFrame(() => {
        const next = pageContentRef.current;
        if (!next || !window.gsap) {
          pageAnimatingRef.current = false;
          return;
        }
        gsap.fromTo(next,
          { x: `${dir * 100}vw`, opacity: 0.72, filter: 'blur(10px)' },
          { x: '0vw', opacity: 1, filter: 'blur(0px)', duration: 0.62, ease: 'power3.out',
            clearProps: 'transform,opacity,filter',
            onComplete: () => { pageAnimatingRef.current = false; } });
      });
    };
    if (!current || !window.gsap) {
      enterNext();
      return;
    }
    gsap.to(current, {
      x: `${-dir * 100}vw`,
      opacity: 0.55,
      filter: 'blur(10px)',
      duration: 0.42,
      ease: 'power3.in',
      onComplete: enterNext,
    });
  }, [activeId]);

  // PUSH transition into detail view
  const openDetail = useCallback((g) => {
    if (transitioning || !swapRef.current) return;
    setTransitioning(true);
    setOpenPk(g.game_pk);
    gsap.to(swapRef.current, {
      x: '-100vw', duration: 0.75, ease: 'power3.inOut',
      onComplete: () => setTransitioning(false),
    });
  }, [transitioning]);

  const closeDetail = useCallback(() => {
    if (transitioning || !swapRef.current) return;
    setTransitioning(true);
    gsap.to(swapRef.current, {
      x: '0vw', duration: 0.7, ease: 'power3.inOut',
      onComplete: () => { setOpenPk(null); setTransitioning(false); },
    });
  }, [transitioning]);

  const live = games.filter(g => g.is_live);
  const finished = games.filter(g => g.is_played);
  // +EV picks: empirical sweet spot from walk-forward (edge vs book in [0%, 2%]).
  // Excludes 'overconfident' band (edge ≥ 2%) where the model is consistently wrong.
  const valueList = games.filter(g => g.ev_grade === 'sweet' || g.ev_grade === 'marginal');
  const sweetValueCount = valueList.filter(g => g.ev_grade === 'sweet').length;
  const stats = useMemo(() => {
    if (!finished.length) return null;
    let mlW=0, mlT=0, totalW=0, totalT=0, ouW=0, ouT=0, rlW=0, rlT=0;
    finished.forEach(g => {
      const homeWon = (g.home_score != null && g.away_score != null) ? g.home_score > g.away_score : null;
      if (homeWon === null) return;
      const pick = displayMlPick(g);
      // All model picks (total accuracy)
      if (pick.side) { totalT++; if ((pick.side === 'HOME') === homeWon) totalW++; }
      // Only value picks (sweet/marginal)
      if (pick.side && pick.valueShown) { mlT++; if ((pick.side === 'HOME') === homeWon) mlW++; }

      const totalLine = g.total_close ?? g.market_total;
      if (g.pred_total != null && totalLine != null && g.pred_total !== totalLine) {
        const actualTotal = g.home_score + g.away_score;
        if (actualTotal !== totalLine) {
          const pickedOver = g.pred_total > totalLine;
          ouT++;
          if (pickedOver === (actualTotal > totalLine)) ouW++;
        }
      }

      if (g.run_line != null && g.run_line !== 0) {
        const dogIsHome = g.run_line < 0;
        const dogMargin = dogIsHome ? g.home_score - g.away_score : g.away_score - g.home_score;
        rlT++;
        if (dogMargin >= -1) rlW++;
      }
    });
    return {
      mlAcc: mlT ? mlW/mlT*100 : null,
      mlT,
      totalAcc: totalT ? totalW/totalT*100 : null,
      totalT,
      ouAcc: ouT ? ouW/ouT*100 : null,
      ouT,
      rlAcc: rlT ? rlW/rlT*100 : null,
      rlT,
    };
  }, [finished]);

  return (
    <>
      <RunBurstOverlay bursts={runBursts} />
      {!openPk && <TopNav activeId={activeId} onNavigate={goPage} date={date} setDate={setDate} scrolled={scrolled} />}
      <div ref={swapRef} className="swap-container relative z-10">
        {/* LEFT PANE: active page */}
        <main ref={pageRef} className="swap-pane overflow-y-auto">
          <div ref={pageContentRef} className="min-h-screen will-change-transform">
            {activeId === 'hero' && (
              <HeroPage
                todayCount={games.length}
                valueCount={valueList.length}
                onCta={goPage}
              />
            )}
            {activeId === 'hoy' && (
              <>
              <HoyExpandableRow games={games} onOpen={openDetail} date={date} />
              <YesterdayBanner data={yesterday} />
              <BurnPanel data={burnData} />
              </>
            )}
            {activeId === 'flash' && (
              <>
              <HeroBlock
                kicker="02 · Vista Flash"
                title={<>Eventos<br/>del día.</>}
                lead="Una pizarra compacta con estado, marcador y cuotas 1/2 para revisar toda la jornada de un vistazo."
                statValue={games.length} statLabel="eventos en tablero" accent="blue"
              />
              <FlashcoreBoard games={games} onOpen={openDetail} date={date} />
              </>
            )}
            {activeId === 'envivo' && (
              <>
              <HeroBlock
                kicker="03 · En progreso"
                title={<>Live<br/>action.</>}
                lead="Scores y conteo de pitches se actualizan cada 30 segundos."
                statValue={live.length} statLabel="partidos en este momento" accent="green"
              />
              <GridList items={live} onOpen={openDetail} emptyText="No hay partidos en vivo ahora mismo." title="En curso" />
              </>
            )}
            {activeId === 'valor' && (
              <HoyExpandableRow
                games={valueList}
                onOpen={openDetail}
                date={date}
                kicker="04 · Solo +EV"
                primaryLabel="picks +EV del día"
                secondaryValue={sweetValueCount}
                secondaryLabel="sweet spot"
                description="Partidos donde la probabilidad del modelo supera la implícita del book. Aquí aparecen únicamente oportunidades clasificadas como sweet o marginal, con todas las métricas de la vista Hoy."
                emptyText="Sin oportunidades de valor +EV en esta fecha."
              />
            )}
            {activeId === 'final' && (
              <HoyExpandableRow
                games={finished}
                onOpen={openDetail}
                date={date}
                kicker="05 · Resultados"
                primaryLabel="partidos finalizados"
                secondaryValue={stats?.totalAcc != null ? stats.totalAcc.toFixed(1) : '—'}
                secondarySuffix="%"
                secondaryLabel="accuracy del modelo"
                extraStats={[
                  { label: 'accuracy over/under', value: stats?.ouAcc != null ? stats.ouAcc.toFixed(1) : '—', suffix: '%', color: '#4DABF7' },
                  { label: 'accuracy handicap', value: stats?.rlAcc != null ? stats.rlAcc.toFixed(1) : '—', suffix: '%', color: '#51CF66' },
                ]}
                description={stats
                  ? `${stats.totalT} predicciones evaluadas. Las cards muestran en verde los picks ganados y en rojo los perdidos, junto con el marcador final y las métricas del matchup.`
                  : 'Todavía no hay predicciones finalizadas en esta fecha.'}
                emptyText="Todavía no hay partidos finalizados en esta fecha."
              />
            )}
            {activeId === 'equipo' && (
              <TeamSearchPage
                date={date}
                query={teamSearchQuery}
                resolvedTeam={resolveTeamQuery(teamSearchQuery)}
                onQueryChange={setTeamSearchQuery}
                winProbFilter={teamWinProbFilter}
                onWinProbFilterChange={setTeamWinProbFilter}
                games={teamHistoryGames}
                loading={teamHistoryLoading}
                onOpen={openDetail}
              />
            )}
            {activeId === 'resumen' && (
              <>
              <HeroBlock
                kicker="06 · Archivo diario"
                title={<>Últimos 3 meses,<br/>por día.</>}
                lead="Resumen diario del rendimiento del modelo de predicciones: juegos evaluados, accuracy contra mercado y retorno de picks +EV fecha por fecha."
                statValue={performance?.daily?.length ?? 0}
                statLabel="días resumidos"
                accent="gold"
              />
              <DailySummaryPage data={performance} loading={performanceLoading} error={performanceError} />
              </>
            )}
            {activeId === 'ranking' && (
              <TeamRankingPage
                data={teamRanking}
                loading={teamRankingLoading}
                days={teamRankingDays}
                onDaysChange={setTeamRankingDays}
              />
            )}
            {activeId === 'remontas' && (
              <>
              <div className="flex gap-2 px-10 pt-8 pb-0">
                {[['comebacks','Remontas'],['errors','Errores defensivos']].map(([v,l]) => (
                  <button key={v} onClick={() => setRemontasView(v)}
                    className={`px-4 py-2 rounded-xl text-[10px] font-black tracking-wider uppercase border transition-all
                      ${remontasView===v ? 'bg-white/10 border-white/30 text-white' : 'border-white/[0.07] text-white/35 hover:border-white/20'}`}>
                    {l}
                  </button>
                ))}
              </div>
              {remontasView === 'comebacks' && (
                <RemontasPage
                  data={comebacks}
                  loading={comebacksLoading}
                  season={comebacksSeason}
                  onSeasonChange={s => { setComebacksSeason(s); setComebacks(null); }}
                />
              )}
              {remontasView === 'errors' && (
                <ErrorPage
                  data={errors}
                  loading={errorsLoading}
                  season={errorsSeason}
                  onSeasonChange={s => { setErrorsSeason(s); setErrors(null); }}
                />
              )}
              </>
            )}
            {activeId === 'modelo' && (
              <ModeloPage
                performance={performance}
                performanceLoading={performanceLoading}
                performanceError={performanceError}
              />
            )}
          </div>
        </main>

        {/* RIGHT PANE: detail page */}
        <div className="swap-pane">
          {openPk && <DetailPage pk={openPk} onBack={closeDetail}/>}
        </div>
      </div>
      {loading && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-ink-0/85 backdrop-blur-sm pointer-events-none">
          <div className="text-white/40 text-sm tracking-[0.32em] uppercase animate-pulse">Cargando partidos…</div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
