<canvas id="bg-canvas"></canvas>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useLayoutEffect, useCallback } = React;

// ─── Helpers ──────────────────────────────────────────────────────────────────
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const shiftDate = (iso, n) => { const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDateLong = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return `${d} de ${MES[m-1]}, ${y}`; };
const fmtPct = (p) => p == null ? '–' : (p*100).toFixed(1) + '%';
const fmt3 = (n) => n == null ? '–' : (+n).toFixed(3).replace(/^0/, '');
const pct  = (n) => n == null ? '–' : ((+n)*100).toFixed(1) + '%';
const TEAM_ID = {ARI:109,ATL:144,BAL:110,BOS:111,CHC:112,CHW:145,CWS:145,CIN:113,CLE:114,COL:115,DET:116,HOU:117,KC:118,LAA:108,LAD:119,MIA:146,MIL:158,MIN:142,NYM:121,NYY:147,OAK:133,ATH:133,PHI:143,PIT:134,SD:135,SF:137,SEA:136,STL:138,TB:139,TEX:140,TOR:141,WSH:120};
const teamLogo = (a) => `https://www.mlbstatic.com/team-logos/${TEAM_ID[a]||0}.svg`;

const SECTIONS = [
  { id:'hero',    label:'Inicio' },
  { id:'hoy',     label:'Hoy' },
  { id:'envivo',  label:'En vivo' },
  { id:'valor',   label:'+EV' },
  { id:'final',   label:'Resultados' },
  { id:'modelo',  label:'Modelo' },
];

// ─── THREE.JS PARTICLE SPHERE (cursor-reactive) ──────────────────────────────
function startParticles() {
  if (!window.THREE) return;
  const canvas = document.getElementById('bg-canvas');
  if (!canvas || canvas.__started) return;
  canvas.__started = true;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 6;

  // Sphere of points
  const N = 2400;
  const positions = new Float32Array(N * 3);
  const original  = new Float32Array(N * 3);
  const radius = 3.2;
  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.sin(phi) * Math.sin(theta);
    const z = radius * Math.cos(phi);
    positions[i*3]   = x; positions[i*3+1] = y; positions[i*3+2] = z;
    original[i*3]    = x; original[i*3+1]  = y; original[i*3+2]  = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  // colors: mix of red, blue, white
  const colors = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = Math.random();
    if (r < 0.4)      { colors[i*3]=0.90; colors[i*3+1]=0.22; colors[i*3+2]=0.27; } // red
    else if (r < 0.8) { colors[i*3]=0.30; colors[i*3+1]=0.67; colors[i*3+2]=0.97; } // blue
    else              { colors[i*3]=1.00; colors[i*3+1]=1.00; colors[i*3+2]=1.00; } // white
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.038, vertexColors: true, transparent: true, opacity: 0.86,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Mouse tracking (NDC + world)
  const mouseNDC = new THREE.Vector2(-10, -10);
  const mouseWorld = new THREE.Vector3();
  const raycaster = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
  window.addEventListener('pointermove', (e) => {
    mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.ray.intersectPlane(plane, mouseWorld);
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  let t = 0;
  const tmp = new THREE.Vector3();
  function tick() {
    t += 0.0035;
    points.rotation.y = t * 0.4;
    points.rotation.x = Math.sin(t * 0.35) * 0.18;

    // particle dispersion near cursor (world-space)
    const pos = geo.attributes.position.array;
    for (let i = 0; i < N; i++) {
      // restore towards original
      const ox = original[i*3], oy = original[i*3+1], oz = original[i*3+2];
      let px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
      // rotate original by current rotation to get current "ideal" position
      // For simplicity: lerp back towards original (rotation handles the spin visually since group rotates)
      px += (ox - px) * 0.06;
      py += (oy - py) * 0.06;
      pz += (oz - pz) * 0.06;
      // mouse repel — convert point to world using points.matrix
      tmp.set(px, py, pz).applyMatrix4(points.matrixWorld);
      const dx = tmp.x - mouseWorld.x;
      const dy = tmp.y - mouseWorld.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 1.2) {
        const inv = 1 / Math.sqrt(d2 + 0.001);
        const force = (1.2 - d2) * 0.28;
        // local-space displacement
        const localDx = dx * inv * force;
        const localDy = dy * inv * force;
        // apply inverse rotation roughly: just nudge in local x/y is close enough visually
        px += localDx;
        py += localDy;
      }
      pos[i*3] = px; pos[i*3+1] = py; pos[i*3+2] = pz;
    }
    geo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
}

// ─── COUNTER ─────────────────────────────────────────────────────────────────
function Counter({ value, decimals = 0, suffix = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || value == null) return;
    const obj = { v: 0 };
    gsap.to(obj, {
      v: value, duration: 1.4, ease: 'power3.out',
      onUpdate: () => {
        if (!ref.current) return;
        const n = decimals ? obj.v.toFixed(decimals) : Math.round(obj.v).toLocaleString('es-MX');
        ref.current.textContent = n + suffix;
      }
    });
  }, [value]);
  return <span ref={ref}>0{suffix}</span>;
}

// ─── TOP NAV (sticky, scroll-aware) ──────────────────────────────────────────
function TopNav({ activeId, onNavigate, date, setDate, scrolled }) {
  return (
    <header className={`fixed top-0 inset-x-0 z-50 transition-all duration-500
      ${scrolled ? 'glass border-b border-white/[0.06]' : 'bg-transparent'}`}>
      <div className="max-w-[1600px] mx-auto px-10 h-[72px] flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-full border-2 border-accent-red flex items-center justify-center text-accent-red font-mega text-xs">SC</div>
          <div className="font-mega text-[22px] tracking-tight">STRIKE<span className="text-accent-red">CAST</span></div>
        </div>
        <nav className="hidden md:flex items-center gap-1 glass rounded-full px-2 py-1.5 border border-white/[0.06]">
          {SECTIONS.map(s => (
            <button key={s.id} onClick={() => onNavigate(s.id)}
              className={`px-4 py-2 rounded-full text-[12px] font-medium tracking-wide transition-all
                ${activeId === s.id ? 'bg-white text-ink-0 font-bold' : 'text-white/70 hover:text-white'}`}>
              {s.label}
            </button>
          ))}
        </nav>
        <div className="flex items-center gap-2">
          <button onClick={() => setDate(shiftDate(date,-1))} className="w-8 h-8 rounded-full glass border border-white/[0.06] hover:bg-white/[0.08] text-white/70 text-sm">‹</button>
          <input type="date" value={date} onChange={(e)=>setDate(e.target.value)}
            className="glass border border-white/[0.06] rounded-full px-3 py-1.5 text-xs text-white/80 cursor-pointer outline-none" />
          <button onClick={() => setDate(shiftDate(date,1))} className="w-8 h-8 rounded-full glass border border-white/[0.06] hover:bg-white/[0.08] text-white/70 text-sm">›</button>
          <button onClick={() => setDate(todayISO())} className="ml-1 px-3 py-1.5 rounded-full text-[11px] tracking-[0.18em] uppercase font-bold text-accent-gold border border-accent-gold/40 hover:bg-accent-gold/10">Hoy</button>
          <RefreshIndicator />
        </div>
      </div>
    </header>
  );
}

function RefreshIndicator() {
  const [st, setSt] = useState(null);
  useEffect(() => {
    const fetchStatus = () => fetch('/api/refresh-status').then(r => r.json()).then(setSt).catch(() => {});
    fetchStatus();
    const t = setInterval(fetchStatus, 10000);
    return () => clearInterval(t);
  }, []);
  const ago = st?.seconds_since_last_ok;
  const label = st?.running_now ? 'refrescando…'
              : ago == null ? '— sin datos —'
              : ago < 60 ? 'recién actualizado'
              : `hace ${Math.round(ago/60)} min`;
  const color = st?.running_now ? 'text-accent-blue'
              : ago == null || ago > 1800 ? 'text-accent-red'
              : ago < 300 ? 'text-accent-green'
              : 'text-accent-gold';
  const trigger = async () => {
    await fetch('/api/refresh-now', { method: 'POST' });
    setTimeout(() => fetch('/api/refresh-status').then(r=>r.json()).then(setSt), 300);
  };
  return (
    <button onClick={trigger} title="Forzar refresh"
      className={`ml-1 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] tracking-[0.16em] uppercase font-bold glass border border-white/[0.08] hover:bg-white/[0.05] ${color}`}>
      <span className={`w-1.5 h-1.5 rounded-full bg-current ${st?.running_now ? 'animate-pulse' : ''}`}/>
      {label}
    </button>
  );
}

// ─── GAME CARD ───────────────────────────────────────────────────────────────
function GameCard({ g, onOpen, index = 0 }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    if (!ref.current) return;
    gsap.fromTo(ref.current,
      { opacity: 0, y: 36, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'power3.out', delay: 0.06 + (index%6) * 0.05 });
  }, [g.game_pk]);

  const isLive = g.is_live, isFinal = g.is_played;
  // NEW EV grading from empirical walk-forward analysis:
  //   sweet (edge 1-2pp)  → +11% ROI band, BET
  //   marginal (0-1pp)    → +0.8% ROI, smaller bet
  //   overconfident (>2pp)→ model wrong → SKIP
  //   no_edge / no_data   → no bet
  const evGrade = g.ev_grade || 'no_data';
  const isSweet = evGrade === 'sweet';
  const isMarginal = evGrade === 'marginal';
  const isPlayable = isSweet || isMarginal;
  const valueShown = isPlayable && g.value_team_abbrev;
  const pickAbbr = valueShown ? g.value_team_abbrev : g.pick_abbrev;
  const pickDec  = valueShown ? g.value_decimal
                   : (g.pick_abbrev === g.home_abbrev ? g.market_home_decimal : g.market_away_decimal);
  const homeWon = (g.home_score != null && g.away_score != null) ? g.home_score > g.away_score : null;
  const pickedHome = valueShown ? g.value_side === 'HOME' : pickAbbr === g.home_abbrev;
  const verdict = !isFinal || homeWon == null ? null
                  : ((pickedHome === homeWon) ? 'win' : 'loss');
  const accentBorder =
    verdict === 'win' ? 'border-accent-green/55' :
    verdict === 'loss' ? 'border-accent-red/55' :
    isLive ? 'border-accent-green/35' : 'border-white/[0.06]';

  return (
    <div ref={ref} onClick={() => onOpen(g)}
      className={`group relative glass border ${accentBorder} rounded-2xl px-6 py-5 cursor-pointer
                  transition-all duration-300 hover:border-accent-blue/55 hover:-translate-y-1 hover:bg-white/[0.04]`}>
      <div className="flex items-center justify-between mb-5">
        <span className="text-[10px] tracking-[0.2em] uppercase text-white/40 truncate max-w-[60%]">{g.venue || '—'}</span>
        <span className={`flex items-center gap-1.5 text-[10px] tracking-[0.22em] uppercase font-bold
                          ${isLive ? 'text-accent-green' : isFinal ? 'text-white/45' : 'text-accent-blue/85'}`}>
          {isLive && <span className="live-dot"/>}
          {isLive ? 'En vivo' : isFinal ? 'Final' : 'Próximo'}
        </span>
      </div>
      <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-4 mb-5">
        <div className="flex flex-col items-center text-center">
          <img src={teamLogo(g.away_abbrev)} alt={g.away_abbrev} className="w-14 h-14 object-contain mb-1.5" onError={(e)=>e.target.style.opacity=0.2}/>
          <div className="mega text-[26px]">{g.away_abbrev}</div>
          <div className="text-[11px] text-white/45 mt-1.5 tabular-nums">{fmtPct(g.p_away)}</div>
        </div>
        {(isLive || isFinal) ? (
          <div className="flex flex-col items-center bg-ink-0/80 border border-white/[0.07] rounded-xl px-5 py-2.5">
            <div className="mega text-[40px] tabular-nums">
              {g.away_score ?? 0}<span className="text-white/25 text-[26px] mx-1.5">·</span>{g.home_score ?? 0}
            </div>
          </div>
        ) : (
          <div className="text-white/25 text-[11px] tracking-[0.32em]">VS</div>
        )}
        <div className="flex flex-col items-center text-center">
          <img src={teamLogo(g.home_abbrev)} alt={g.home_abbrev} className="w-14 h-14 object-contain mb-1.5" onError={(e)=>e.target.style.opacity=0.2}/>
          <div className="mega text-[26px]">{g.home_abbrev}</div>
          <div className="text-[11px] text-white/45 mt-1.5 tabular-nums">{fmtPct(g.p_home)}</div>
        </div>
      </div>
      <div className="flex h-1 rounded-full overflow-hidden bg-white/[0.05] mb-4">
        <div className="bg-accent-red" style={{ width: `${(g.p_away||0.5)*100}%` }}/>
        <div className="bg-accent-blue" style={{ width: `${(g.p_home||0.5)*100}%` }}/>
      </div>
      <div className="flex flex-wrap items-center gap-2 text-[11px] pt-3 border-t border-white/[0.05]">
        {pickAbbr && (
          <span className={`px-2.5 py-1 rounded font-bold tracking-wider uppercase text-[10px]
            ${isSweet    ? 'bg-accent-green/20 text-accent-green border border-accent-green/50'
            : isMarginal ? 'bg-accent-blue/15 text-accent-blue border border-accent-blue/40'
            : evGrade === 'overconfident' ? 'bg-accent-red/10 text-accent-red/80 border border-accent-red/30'
            :              'bg-white/[0.05] text-white/55 border border-white/[0.08]'}`}>
            {isSweet    ? '◆ +EV ' :
             isMarginal ? '◇ +EV LIGHT ' :
             evGrade === 'overconfident' ? '⚠ RIESGOSO ' :
             evGrade === 'no_edge' ? 'NO BET ' : 'ML '}
            {pickAbbr}{pickDec != null && ` @ ${pickDec.toFixed(2)}`}
            {g.value_edge_pp != null && evGrade !== 'no_edge' && ` · ${g.value_edge_pp >= 0 ? '+' : ''}${g.value_edge_pp.toFixed(1)}pp`}
          </span>
        )}
        {verdict === 'win'  && <span className="px-2 py-1 rounded bg-accent-green text-ink-0 font-bold text-[10px] tracking-wider">✓ Ganó</span>}
        {verdict === 'loss' && <span className="px-2 py-1 rounded bg-accent-red text-white font-bold text-[10px] tracking-wider">✗ Falló</span>}
      </div>
      <span className="absolute top-3 right-3 text-white/20 group-hover:text-accent-blue group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all text-lg">↗</span>
    </div>
  );
}

// ─── HERO HEADLINE BLOCK ─────────────────────────────────────────────────────
function HeroBlock({ kicker, title, lead, statValue, statLabel, statSuffix, accent='red' }) {
  const wrapRef = useRef(null);
  useLayoutEffect(() => {
    if (!wrapRef.current) return;
    gsap.fromTo(wrapRef.current.querySelectorAll('[data-fade]'),
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.95, ease: 'power3.out', stagger: 0.08 });
  }, [kicker, title]);
  const aColor = {
    red:'#E63946', blue:'#4DABF7', gold:'#FFD43B', green:'#51CF66',
  }[accent];
  return (
    <div ref={wrapRef} className="min-h-screen flex flex-col justify-center pt-32 pb-20 px-10 max-w-[1600px] mx-auto">
      <div data-fade className="text-[12px] tracking-[0.32em] uppercase font-bold mb-6" style={{ color: aColor }}>
        {kicker}
      </div>
      <h1 data-fade className="mega text-[clamp(72px,10vw,160px)] leading-[0.9] max-w-[1200px]">
        {title}
      </h1>
      {lead && (
        <p data-fade className="text-white/65 text-lg md:text-xl mt-10 max-w-[680px] leading-relaxed font-light">
          {lead}
        </p>
      )}
      <div data-fade className="mt-16 flex items-end gap-10">
        <div>
          <div className="mega text-[clamp(80px,11vw,180px)] tabular-nums tracking-tighter" style={{ color: aColor }}>
            {statValue != null ? <Counter value={statValue} decimals={statSuffix === '%' ? 1 : 0} suffix={statSuffix || ''} /> : '—'}
          </div>
          <div className="text-[12px] tracking-[0.32em] uppercase text-white/45 font-bold mt-3">
            {statLabel}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SECTION WRAPPER ─────────────────────────────────────────────────────────
function Section({ id, refMap, children }) {
  const ref = useRef(null);
  useEffect(() => {
    refMap.current[id] = ref.current;
    return () => { delete refMap.current[id]; };
  }, [id]);
  return <section ref={ref} id={`sec-${id}`} className="snap-section relative">{children}</section>;
}

// ─── LIST GRID ───────────────────────────────────────────────────────────────
function GridList({ items, onOpen, emptyText, title }) {
  return (
    <div className="px-10 pb-32 max-w-[1600px] mx-auto -mt-10">
      <div className="flex items-end justify-between mb-8">
        <h2 className="mega text-4xl uppercase">{title}</h2>
        <div className="text-[10px] tracking-[0.32em] uppercase text-white/45">{items.length} eventos</div>
      </div>
      {items.length === 0 ? (
        <div className="py-32 text-center text-white/35 text-sm tracking-wider">{emptyText}</div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {items.map((g, i) => <GameCard key={g.game_pk} g={g} onOpen={onOpen} index={i} />)}
        </div>
      )}
    </div>
  );
}

// ─── HERO PAGE (intro) ───────────────────────────────────────────────────────
function HeroPage({ todayCount, valueCount, onCta }) {
  const wrapRef = useRef(null);
  useLayoutEffect(() => {
    if (!wrapRef.current) return;
    gsap.fromTo(wrapRef.current.querySelectorAll('[data-fade]'),
      { opacity: 0, y: 40 },
      { opacity: 1, y: 0, duration: 1.1, ease: 'power3.out', stagger: 0.1, delay: 0.15 });
  }, []);
  return (

function DetailBody({ d }) {
  const a = d.away_team, h = d.home_team;
  const ap = d.away_pitcher, hp = d.home_pitcher;
  const v = d.value || {};
  const mdl = d.model;
  const live = (d.live_score && d.live_score.state) || {};
  const isLive = live.is_live, played = d.result.played;
  const awayRuns = (d.live_score?.away?.runs) ?? d.result.away_score;
  const homeRuns = (d.live_score?.home?.runs) ?? d.result.home_score;
  // Empirical sweet spot — bet only when edge vs BOOK is in [0%, 2%].
  // edge ≥ 2pp → model overconfident, statistically loses money.
  const valueGood = v.value_side && (v.ev_grade === 'sweet' || v.ev_grade === 'marginal');
  const recommendation = valueGood
    ? { kind:'valor', team:v.value_team_abbrev, dec:v.value_decimal, edge:v.value_edge_pp }
    : (mdl.p_home != null
        ? { kind:'ml', team: mdl.p_home >= 0.5 ? h.abbrev : a.abbrev,
            dec: mdl.p_home >= 0.5 ? v.market_home_decimal : v.market_away_decimal,
            edge: mdl.p_home >= 0.5 ? v.home_edge_pp : v.away_edge_pp }
        : null);
  // Confidence level
  const pickHome = mdl.p_home != null && mdl.p_home >= 0.5;
  const confidence = pickHome ? mdl.p_home : (1 - mdl.p_home);
  const confLevel = confidence >= 0.58 ? 'Alta' : confidence >= 0.53 ? 'Media' : 'Baja';
  const confColor = confLevel === 'Alta' ? 'text-accent-green' : confLevel === 'Media' ? 'text-accent-gold' : 'text-accent-red';
  // Verdict
  const homeWon = played && homeRuns != null && awayRuns != null ? homeRuns > awayRuns : null;
  const pickedHome = recommendation && (recommendation.team === h.abbrev);
  const verdict = !played || homeWon == null ? 'pending' : (pickedHome === homeWon ? 'win' : 'loss');
  // Projected score — convert win prob into run differential with a wider spread
  // so close games still show 1-run gap and clear favorites show 2-3 run gaps.
  const projTotal = mdl.pred_total_runs;
  let projAway = null, projHome = null;
  if (projTotal != null && mdl.p_home != null) {
    // ~ 0.55 → 0.5 run diff, 0.65 → 1.5, 0.75 → 2.5
    const runDiff = Math.abs(mdl.p_home - 0.5) * 10;
    const half = projTotal / 2;
    const favRuns = Math.max(1, Math.round(half + runDiff / 2));
    const dogRuns = Math.max(0, Math.round(half - runDiff / 2));
    // Guarantee favorite > underdog by at least 1
    const finalFav = favRuns <= dogRuns ? dogRuns + 1 : favRuns;
    if (pickHome) { projHome = finalFav; projAway = dogRuns; }
    else          { projAway = finalFav; projHome = dogRuns; }
  }
  // Donut SVG (probability split)
  const pH = mdl.p_home ?? 0.5;
  const circumference = 2 * Math.PI * 60;

  return (
    <div className="max-w-[1400px] mx-auto px-10 pt-8 pb-12">

            <div className="text-[10px] tracking-[0.32em] uppercase text-white/45 mb-1">{(a.name || a.abbrev).split(' ')[0]}</div>
            <div className="mega text-4xl tracking-tight text-accent-red">{(a.name || a.abbrev).split(' ').slice(1).join(' ').toUpperCase() || a.abbrev}</div>
            <div className="text-white/55 text-sm mt-2 font-medium">{a.wins ?? '–'}-{a.losses ?? '–'}</div>
            <div className="text-accent-red font-bold text-xl mt-3 tabular-nums">{fmtPct(mdl.p_away)} <span className="text-white/40 text-[10px] tracking-[0.2em] ml-1">WIN PROB</span></div>
          </div>
          {/* Center */}
          <div className="flex flex-col items-center">
            {isLive && <div className="px-3 py-1 mb-3 rounded-full border border-accent-green/40 text-accent-green text-[10px] tracking-[0.22em] uppercase font-bold flex items-center gap-1.5"><span className="live-dot"/> En vivo</div>}
            {(played || isLive) ? (
              <div className="mega text-[78px] tabular-nums leading-none">
                {awayRuns ?? 0}<span className="text-white/20 mx-3">·</span>{homeRuns ?? 0}
              </div>
            ) : (
              <>
                <div className="px-3 py-1 mb-2 rounded-full border border-accent-blue/40 text-accent-blue text-[10px] tracking-[0.22em] uppercase font-bold">Juego de hoy</div>
                <div className="mega text-5xl text-white/30 tracking-[0.32em]">VS</div>
              </>
            )}
            <div className="text-[11px] tracking-[0.18em] uppercase text-white/45 mt-3">{d.date}</div>
            <div className="text-[11px] text-white/35">{d.venue}</div>
          </div>
          {/* Home team */}
          <div className="text-center">
            <img src={h.logo} className="w-28 h-28 mx-auto mb-3 object-contain" onError={(e)=>e.target.style.opacity=0.18}/>
            <div className="text-[10px] tracking-[0.32em] uppercase text-white/45 mb-1">{(h.name || h.abbrev).split(' ')[0]}</div>
            <div className="mega text-4xl tracking-tight text-accent-blue">{(h.name || h.abbrev).split(' ').slice(1).join(' ').toUpperCase() || h.abbrev}</div>
            <div className="text-white/55 text-sm mt-2 font-medium">{h.wins ?? '–'}-{h.losses ?? '–'}</div>
            <div className="text-accent-blue font-bold text-xl mt-3 tabular-nums">{fmtPct(mdl.p_home)} <span className="text-white/40 text-[10px] tracking-[0.2em] ml-1">WIN PROB</span></div>
          </div>
          {/* Recommendation panel */}
          {recommendation && (
            <div className="rounded-2xl px-6 py-5 border min-w-[200px]"
              style={{
                background: recommendation.kind === 'valor' ? 'rgba(81,207,102,0.08)' : 'rgba(77,171,247,0.06)',
                borderColor: recommendation.kind === 'valor' ? 'rgba(81,207,102,0.4)' : 'rgba(77,171,247,0.3)',
              }}>
              <div className="text-[10px] tracking-[0.24em] uppercase text-white/55 mb-2 font-bold">
                {recommendation.kind === 'valor' ? '◆ PICK DE VALOR' : '◉ RECOMENDACIÓN'}
              </div>
              <div className="rounded-lg px-4 py-3 mb-3"

        <div className="glass border border-white/[0.06] rounded-2xl p-5">

      <div className="flex items-center gap-2 mb-3">
        <span className="text-accent-blue text-lg">{icon}</span>
        <span className="text-[10px] tracking-[0.22em] uppercase text-white/45 font-bold">{label}</span>
      </div>
      <div className={`mega text-2xl tracking-tight ${accentColor} tabular-nums`}>{value}</div>
      <div className="text-[10px] text-white/40 mt-1">{sub}</div>
    </div>
  );
}

function CompareHead({ away, home }) {
  return (
    <div className="grid grid-cols-[1fr_auto_1fr] items-center text-[10px] uppercase tracking-[0.22em] text-white/45 font-bold border-b border-white/[0.06] pb-2 mb-1">
      <div className="text-right text-accent-red px-4">{away}</div>
      <div className="text-center min-w-[180px]">Métrica</div>
      <div className="text-left text-accent-blue px-4">{home}</div>
    </div>
  );
}

function KeyItem({ icon, title, text }) {
  return (
    <div className="flex items-start gap-3 p-2.5 rounded-lg bg-white/[0.02]">
      <span className="text-accent-blue text-base mt-0.5">{icon}</span>
      <div>
        <div className="text-[12px] font-bold text-white leading-tight">{title}</div>
        <div className="text-[10px] text-white/50 mt-0.5 leading-snug">{text}</div>
      </div>
    </div>
  );
}

function PickRow({ star, title, line, conf, active, edge }) {
  return (
    <div className={`grid grid-cols-[16px_1fr_auto_auto] items-center gap-2 px-3 py-2.5 rounded-lg ${active ? 'bg-accent-green/[0.08] border border-accent-green/30' : 'bg-white/[0.02] border border-white/[0.04]'}`}>
      <span className={active ? 'text-accent-green' : 'text-white/40'}>{star ? '★' : '•'}</span>
      <div>
        <div className="text-[12px] font-bold text-white">{title}</div>
        {edge != null && <div className="text-[10px] text-white/50">Edge {edge >= 0 ? '+' : ''}{edge.toFixed(1)}pp</div>}
      </div>
      <div className="text-[11px] text-white/65 font-bold tabular-nums">{line}</div>
      <div className={`text-[10px] font-bold uppercase tracking-wider
        ${conf === 'Alta' ? 'text-accent-green' : conf === 'Media' ? 'text-accent-gold' : 'text-white/50'}`}>{conf}</div>
    </div>
  );
}

function SectionTitle({ children }) {
  return <div className="text-[10px] tracking-[0.32em] uppercase font-bold text-accent-gold/85 mt-12 mb-5 text-center">{children}</div>;
}
function CompareRow({ label, away, home }) {
  return (
    <div className="grid grid-cols-[1fr_auto_1fr] items-center text-sm border-b border-white/[0.04] last:border-0">
      <div className="text-right text-accent-red font-bold tabular-nums py-3.5 px-5">{away ?? '–'}</div>
      <div className="text-[10px] uppercase tracking-[0.16em] text-white/45 bg-white/[0.02] py-3.5 px-3 text-center min-w-[180px]">{label}</div>
      <div className="text-left text-accent-blue font-bold tabular-nums py-3.5 px-5">{home ?? '–'}</div>
    </div>
  );
}
function F5Block({ f5, a, h }) {
  // F5 = first 5 innings market. Lower variance, more starter-driven.
  const pickHome = f5.f5_p_home >= 0.5;
  const pickAbbr = pickHome ? h.abbrev : a.abbrev;
  const pickProb = pickHome ? f5.f5_p_home : f5.f5_p_away;
  const fairML = pickHome ? f5.f5_fair_home_ml : f5.f5_fair_away_ml;
  const played = f5.f5_played;
  // F5 verdict: home won, away won, or tied at 5
  let verdict = 'pending';
  if (played) {
    if (f5.f5_actual_tied) verdict = 'push';
    else if (pickHome === f5.f5_actual_home_won) verdict = 'win';
    else verdict = 'loss';
  }
  const verdictColor =
    verdict === 'win' ? 'border-accent-green/40 bg-accent-green/[0.06]' :
    verdict === 'loss' ? 'border-accent-red/40 bg-accent-red/[0.06]' :
    verdict === 'push' ? 'border-accent-gold/40 bg-accent-gold/[0.06]' :
    'border-white/[0.06]';
  return (
    <div className={`mb-5 rounded-2xl border ${verdictColor} px-6 py-4`}>
      <div className="flex items-center justify-between mb-3">
        <div className="text-[11px] tracking-[0.28em] uppercase font-bold text-accent-blue">
          ◐ F5 · primeras 5 entradas
        </div>
        <div className="text-[10px] tracking-[0.18em] uppercase text-white/40">
          Depende solo de starters · menos variance
        </div>
      </div>
      <div className="grid grid-cols-4 gap-3">
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">P({a.abbrev})</div>
          <div className={`mega text-2xl tabular-nums ${!pickHome ? 'text-accent-red' : 'text-white/45'}`}>{(f5.f5_p_away*100).toFixed(1)}%</div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">P({h.abbrev})</div>
          <div className={`mega text-2xl tabular-nums ${pickHome ? 'text-accent-blue' : 'text-white/45'}`}>{(f5.f5_p_home*100).toFixed(1)}%</div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">Pick F5</div>
          <div className="mega text-2xl">
            <span className={pickHome ? 'text-accent-blue' : 'text-accent-red'}>{pickAbbr}</span>
            <span className="text-white/50 text-sm ml-2">{fairML > 0 ? '+' : ''}{fairML}</span>
          </div>
        </div>
        <div className="text-center">
          <div className="text-[10px] tracking-[0.2em] uppercase text-white/45 mb-1">Total F5 pred.</div>
          <div className="mega text-2xl text-accent-gold tabular-nums">{f5.f5_pred_total?.toFixed(1)}</div>
        </div>
      </div>
      {played && (
        <div className="mt-4 pt-3 border-t border-white/[0.06] flex items-center justify-between text-sm">
          <div className="text-white/65">
            Resultado F5: <strong className="text-white">{a.abbrev} {f5.f5_away_score} · {f5.f5_home_score} {h.abbrev}</strong>
            <span className="text-white/40 ml-2">(total {f5.f5_actual_total})</span>
          </div>
          <span className={`px-3 py-1 rounded text-[10px] font-bold tracking-[0.2em] uppercase
            ${verdict === 'win' ? 'bg-accent-green text-ink-0' :
              verdict === 'loss' ? 'bg-accent-red text-white' :
              verdict === 'push' ? 'bg-accent-gold text-ink-0' :
              'bg-white/[0.08] text-white/60'}`}>
            {verdict === 'win' ? '✓ F5 ganado' : verdict === 'loss' ? '✗ F5 fallado' : verdict === 'push' ? '= F5 push (empate)' : 'F5 pendiente'}
          </span>
        </div>
      )}
    </div>
  );
}

function MarketBox({ label, sub, children, accent }) {
  const color = accent === 'blue' ? 'text-accent-blue' : 'text-white';
  return (
    <div className="glass border border-white/[0.06] rounded-2xl px-4 py-5 text-center">
      <div className="text-[10px] tracking-[0.2em] uppercase text-white/40 mb-2">{label}</div>
      <div className={`mega text-2xl tabular-nums ${color}`}>{children}</div>
      <div className="text-[10px] text-white/35 mt-2">{sub}</div>
    </div>
  );
}
function PitcherCard({ p, side }) {
  if (!p || !p.name) return <div className="glass border border-white/[0.06] rounded-2xl p-6 text-center text-white/45">Probable TBD</div>;
  const s = p.season || {};
  const hand = p.throws ? `${p.throws}HP` : '';
  const handCls = side === 'away' ? 'bg-accent-gold/15 text-accent-gold border-accent-gold/40'
                                  : 'bg-accent-blue/15 text-accent-blue border-accent-blue/40';
  return (
    <div className="relative glass border border-white/[0.07] rounded-2xl p-5">
      {hand && <div className={`absolute top-3 left-3 ${handCls} border rounded px-2 py-0.5 text-[10px] font-black tracking-widest`}>{hand}</div>}
      <div className="flex items-center gap-4 mt-2">
        <img src={p.headshot} className="w-24 h-24 rounded-full object-cover bg-ink-0 border-2 border-white/[0.06]"
             onError={(e)=>e.target.style.opacity=0.18} alt={p.name}/>
        <div className="flex-1 min-w-0">
          <div className="mega text-[20px] uppercase tracking-tight leading-tight">{p.name}</div>
          <div className="text-white/55 text-xs mt-1.5">{s.wins ?? '–'}-{s.losses ?? '–'} · {s.era?.toFixed(2) ?? '–'} ERA</div>
          <div className="text-white/40 text-[11px] mt-0.5">{s.ip?.toFixed(1) ?? '–'} IP · {s.k9?.toFixed(1) ?? '–'} K/9</div>
        </div>
      </div>
      <div className="grid grid-cols-5 gap-1.5 mt-5 pt-4 border-t border-white/[0.05]">
        <StatCell value={s.k_pct != null ? (s.k_pct*100).toFixed(1)+'%' : '–'} label="K%" />
        <StatCell value={s.bb9?.toFixed(2) ?? '–'} label="BB/9" />
        <StatCell value={s.whip?.toFixed(2) ?? '–'} label="WHIP" />
        <StatCell value={fmt3(s.xwoba_vs_lhb)} label="wOBA L" />
        <StatCell value={fmt3(s.xwoba_vs_rhb)} label="wOBA R" />
      </div>
    </div>
  );
}
function StatCell({ value, label }) {
  return (
    <div className="bg-white/[0.025] border border-white/[0.04] rounded-md py-2 text-center">
      <div className="font-bold text-[13px] tabular-nums leading-none">{value}</div>
      <div className="text-[9px] uppercase tracking-[0.12em] text-white/40 mt-1">{label}</div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────────────────────────────────────
function App() {
  const [date, setDate] = useState(todayISO());
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeId, setActiveId] = useState('hero');
  const [scrolled, setScrolled] = useState(false);
  const [openPk, setOpenPk] = useState(null);
  const [transitioning, setTransitioning] = useState(false);

  const snapRef = useRef(null);
  const sectionRefs = useRef({});
  const swapRef = useRef(null);

  // Start Three.js once
  useEffect(() => {
    if (window.THREE) startParticles();
    else {
      const id = setInterval(() => {
        if (window.THREE) { clearInterval(id); startParticles(); }
      }, 80);
      return () => clearInterval(id);
    }
  }, []);

  // Fetch games when date changes
  useEffect(() => {
    setLoading(true);
    fetch(`/api/games?start=${date}&end=${date}&t=${Date.now()}`)
      .then(r => r.json())
      .then(d => { setGames(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [date]);

  // Auto refresh
  useEffect(() => {
    const t = setInterval(() => {
      fetch(`/api/games?start=${date}&end=${date}&t=${Date.now()}`).then(r=>r.json()).then(setGames).catch(()=>{});
    }, 30000);
    return () => clearInterval(t);
  }, [date]);

  // Scroll observer
  useEffect(() => {
    const root = snapRef.current;
    if (!root) return;
    const onScroll = () => {
      setScrolled(root.scrollTop > 80);
      // active section detection
      let activeNext = 'hero';
      const cy = root.scrollTop + window.innerHeight * 0.4;
      for (const id of Object.keys(sectionRefs.current)) {
        const el = sectionRefs.current[id];
        if (!el) continue;
        const top = el.offsetTop;
        const bot = top + el.offsetHeight;
        if (cy >= top && cy < bot) { activeNext = id; break; }
      }
      setActiveId(activeNext);
    };
    root.addEventListener('scroll', onScroll);
    onScroll();
    return () => root.removeEventListener('scroll', onScroll);
  }, []);

  const goSection = useCallback((id) => {
    const el = sectionRefs.current[id];
    if (!el || !snapRef.current) return;
    snapRef.current.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
  }, []);

  // PUSH transition into detail view
  const openDetail = useCallback((g) => {
    if (transitioning || !swapRef.current) return;
    setTransitioning(true);
    setOpenPk(g.game_pk);
    gsap.to(swapRef.current, {
      x: '-100vw', duration: 0.75, ease: 'power3.inOut',
      onComplete: () => setTransitioning(false),
    });
  }, [transitioning]);

  const closeDetail = useCallback(() => {
    if (transitioning || !swapRef.current) return;
    setTransitioning(true);
    gsap.to(swapRef.current, {
      x: '0vw', duration: 0.7, ease: 'power3.inOut',
      onComplete: () => { setOpenPk(null); setTransitioning(false); },
    });
  }, [transitioning]);

  const live = games.filter(g => g.is_live);
  const finished = games.filter(g => g.is_played);
  // +EV picks: empirical sweet spot from walk-forward (edge vs book in [0%, 2%]).
  // Excludes 'overconfident' band (edge ≥ 2%) where the model is consistently wrong.
  const valueList = games.filter(g => g.ev_grade === 'sweet' || g.ev_grade === 'marginal');
  const stats = useMemo(() => {
    if (!finished.length) return null;
    let mlW=0, mlT=0;
    finished.forEach(g => {
      const homeWon = g.home_score > g.away_score;
      if (g.pick_abbrev) { mlT++; if ((g.pick_abbrev === g.home_abbrev) === homeWon) mlW++; }
    });
    return { mlAcc: mlT ? mlW/mlT*100 : 0, mlT };
  }, [finished]);

  return (
    <>
      {!openPk && <TopNav activeId={activeId} onNavigate={goSection} date={date} setDate={setDate} scrolled={scrolled} />}
      <div ref={swapRef} className="swap-container relative z-10">
        {/* LEFT PANE: scroll-snap landing */}
        <main ref={snapRef} className="swap-pane snap-container">
          <Section id="hero" refMap={sectionRefs}>
            <HeroPage todayCount={games.length} valueCount={valueList.length} onCta={goSection} />
          </Section>
          <Section id="hoy" refMap={sectionRefs}>
            <HeroBlock
              kicker="01 · Slate del día"
              title={<>{fmtDateLong(date)}</>}
              lead={`${games.length} partidos en la pizarra. ${valueList.length} con valor identificado por el modelo.`}
              statValue={games.length} statLabel="partidos del día" accent="red"
            />
            <GridList items={games} onOpen={openDetail} emptyText="Sin partidos en esta fecha." title="Todos los eventos" />
          </Section>
          <Section id="envivo" refMap={sectionRefs}>
            <HeroBlock
              kicker="02 · En progreso"
              title={<>Live<br/>action.</>}
              lead="Scores y conteo de pitches se actualizan cada 30 segundos."
              statValue={live.length} statLabel="partidos en este momento" accent="green"
            />
            <GridList items={live} onOpen={openDetail} emptyText="No hay partidos en vivo ahora mismo." title="En curso" />
          </Section>
          <Section id="valor" refMap={sectionRefs}>
            <HeroBlock
              kicker="03 · Solo +EV"
              title={<>Apuestas<br/>con valor real.</>}
              lead="Partidos donde nuestra probabilidad supera la implícita del book (con vig). Walk-forward demostró: edge 1–2pp → +11% ROI; edge >2pp → modelo overconfident, perdedor. Acá filtramos al sweet spot."
              statValue={valueList.length} statLabel="picks +EV del día" accent="gold"
            />
            <GridList items={valueList} onOpen={openDetail} emptyText="Sin oportunidades de valor en esta fecha — el book está bien calibrado en todos los games." title="Picks +EV" />
          </Section>
          <Section id="final" refMap={sectionRefs}>
            <HeroBlock
              kicker="04 · Resultados"
              title={<>Cómo<br/>cerraron.</>}
              lead={stats ? `${stats.mlT} picks ML evaluados, accuracy ${stats.mlAcc.toFixed(1)}%.` : 'Aún no hay partidos cerrados en esta fecha.'}
              statValue={stats ? stats.mlAcc : 0} statSuffix="%" statLabel="accuracy en picks ML" accent="green"
            />
            <GridList items={finished} onOpen={openDetail} emptyText="No hay resultados en esta fecha." title="Eventos cerrados" />
          </Section>
          <Section id="modelo" refMap={sectionRefs}>
            <ModeloPage/>
          </Section>
        </main>

        {/* RIGHT PANE: detail page */}
        <div className="swap-pane">
          {openPk && <DetailPage pk={openPk} onBack={closeDetail}/>}
        </div>
      </div>
      {loading && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-ink-0/85 backdrop-blur-sm pointer-events-none">
          <div className="text-white/40 text-sm tracking-[0.32em] uppercase animate-pulse">Cargando partidos…</div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
